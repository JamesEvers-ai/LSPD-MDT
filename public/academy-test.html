<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LSPD Academy Prüfung</title><link rel="stylesheet" href="/lspd-design.css"><style>
body{margin:0;background:#f2f5f8;color:#17324d;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.test-shell{max-width:900px;margin:0 auto;padding:32px 22px 50px}.test-head,.test-card{background:#fff;border:1px solid #dbe4ec;border-radius:12px;box-shadow:0 5px 18px rgba(20,45,75,.045)}.test-head{padding:22px;margin-bottom:14px}.eyebrow{font-size:9px;font-weight:900;letter-spacing:.15em;color:#8b6a2c}.test-head h1{margin:7px 0 5px;font-size:24px;color:#173653}.test-head p{margin:0;color:#718397;font-size:12px;line-height:1.55}.progress{margin-top:15px;height:7px;background:#e8eef3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:#1d5f93;width:0}.question{padding:18px;margin-bottom:10px}.question h2{font-size:15px;margin:0 0 12px;color:#1b3c5a}.answer{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid #dce5ed;border-radius:8px;margin:7px 0;background:#fbfcfd;cursor:pointer}.answer:hover{border-color:#b8cddd;background:#f7fafc}.answer input{margin-top:2px}.test-actions{display:flex;justify-content:space-between;gap:10px;margin-top:14px}.btn{border:1px solid #ccd9e5;background:#fff;color:#1b3c5a;border-radius:8px;padding:10px 15px;font-weight:800;font-size:11px;cursor:pointer}.btn.primary{background:#1d5f93;color:#fff;border-color:#1d5f93}.result{text-align:center;padding:30px}.result strong{display:block;font-size:42px;color:#1d5f93}.error{padding:20px;background:#fff1f1;border:1px solid #edcccc;border-radius:10px;color:#963b3b}.muted{color:#718397;font-size:11px}@media(max-width:600px){.test-shell{padding:16px 10px 35px}.test-head h1{font-size:20px}}
</style></head><body><main class="test-shell"><div id="app"><div class="test-card question"><div class="muted">Prüfung wird vorbereitet …</div></div></div></main><script src="/js/cloud-api.js"></script><script>
(()=>{const app=document.getElementById('app');const params=new URLSearchParams(location.search);const testId=params.get('test');let session='';let test=null;let questions=[];let answers=[];let ready=false;function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}function post(){try{if(window.opener)window.opener.postMessage({type:'LSPD_ACADEMY_REQUEST_SESSION'},location.origin);}catch(e){}}window.addEventListener('message',async e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='LSPD_ACADEMY_SESSION'||ready)return;session=e.data.token||'';if(!session)return;ready=true;await load();});post();setInterval(post,1500);async function api(method,...args){return new Promise((res,rej)=>CloudApi.run.withSuccessHandler(res).withFailureHandler(rej)[method](session,...args));}async function load(){if(!testId){app.innerHTML='<div class="error">Keine Prüfung ausgewählt.</div>';return;}try{test=await api('academyGetTestForAttempt',testId);questions=Array.isArray(test.questions)?test.questions:[];answers=questions.map(q=>q.type==='multiple_choice'?[]:'');render();}catch(e){app.innerHTML='<div class="error">'+esc(e?.message||'Die Prüfung konnte nicht geladen werden.')+'</div>';}}function render(){app.innerHTML='<section class="test-head"><div class="eyebrow">LSPD POLICE ACADEMY</div><h1>'+esc(test.title)+'</h1><p>'+esc(test.description||'Bitte beantworte alle Fragen sorgfältig.')+'</p><div class="progress"><span id="bar"></span></div></section><form id="form">'+questions.map((q,i)=>question(q,i)).join('')+'<div class="test-actions"><span class="muted">Bestehensgrenze: '+Number(test.passing_score||70)+' %</span><button class="btn primary" type="submit">Prüfung abgeben</button></div></form>';document.getElementById('form').addEventListener('change',updateProgress);document.getElementById('form').addEventListener('submit',submit);updateProgress();}function question(q,i){let html='<section class="test-card question"><h2>'+esc((i+1)+'. '+q.prompt)+'</h2>';if(q.type==='true_false'){html+=['true','false'].map(v=>'<label class="answer"><input type="radio" name="q'+i+'" value="'+v+'"> <span>'+ (v==='true'?'Richtig':'Falsch')+'</span></label>').join('');}else if(q.type==='multiple_choice'){html+=(q.options||[]).map((o,j)=>'<label class="answer"><input type="checkbox" name="q'+i+'" value="'+j+'"> <span>'+esc(o)+'</span></label>').join('');}else{html+=(q.options||[]).map((o,j)=>'<label class="answer"><input type="radio" name="q'+i+'" value="'+j+'"> <span>'+esc(o)+'</span></label>').join('');}return html+'</section>';}function updateProgress(){const answered=questions.filter((q,i)=>q.type==='multiple_choice'?[...document.querySelectorAll('input[name="q'+i+'"]:checked')].length:document.querySelector('input[name="q'+i+'"]:checked')).length;const bar=document.getElementById('bar');if(bar)bar.style.width=(questions.length?Math.round(answered/questions.length*100):0)+'%';}async function submit(e){e.preventDefault();answers=questions.map((q,i)=>q.type==='multiple_choice'?[...document.querySelectorAll('input[name="q'+i+'"]:checked')].map(x=>Number(x.value)):document.querySelector('input[name="q'+i+'"]:checked')?.value??'');if(answers.some(a=>Array.isArray(a)?a.length===0:a==='')){app.querySelector('.error')?.remove();const d=document.createElement('div');d.className='error';d.textContent='Bitte beantworte alle Fragen.';document.getElementById('form').prepend(d);return;}try{const r=await api('academySubmitTest',testId,answers);app.innerHTML='<section class="test-card result"><div class="eyebrow">PRÜFUNGSERGEBNIS</div><strong>'+Number(r.score||0)+' %</strong><h1>'+ (r.passed?'Bestanden':'Nicht bestanden')+'</h1><p class="muted">'+Number(r.correct||0)+' von '+Number(r.total||0)+' Fragen richtig beantwortet.</p><button class="btn primary" onclick="window.close()">Fenster schließen</button></section>';}catch(e){const d=document.createElement('div');d.className='error';d.textContent=e?.message||'Die Prüfung konnte nicht abgegeben werden.';document.getElementById('form').prepend(d);}}})();
</script></body></html>
