<main class="mdt-workspace mdt-workspace--vacations" data-mdt-page="vacations" data-lspd-module="vacations">
<section class="mdt-module" id="mdt-module-vacations">
 <h2>Urlaubsverwaltung</h2><div class="sub">Urlaubsanträge und deren Bearbeitungsstatus verwalten.</div>
 <div class="toolbar"><input id="vacations-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="vacations-reload">Aktualisieren</button><button id="vacations-new">+ Neuer Eintrag</button></div>
 <div class="message" id="vacations-message" role="status">Daten werden geladen …</div>
 <div class="form" id="vacations-form" style="display:none">
  <input id="vacations-title" placeholder="Titel / Urlaubsantrag" maxlength="180">
  <select id="vacations-status"><option value="pending">Pending</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="vacations-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="vacations-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="vacations-save">Speichern</button><button class="secondary" id="vacations-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="vacations-items"></div>
</section>
<script src="/js/pages/vacations.js?v=3.76" defer></script>
</main>
