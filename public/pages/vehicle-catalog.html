<main class="mdt-workspace mdt-workspace--vehicle-catalog" data-mdt-page="vehicle-catalog" data-lspd-module="vehicle-catalog">
<div class="vehicle-catalog-page" id="vehicleCatalogPage">
 <div class="vc-head"><div><div class="vc-eyebrow">Los Santos Police Department · Fuhrpark</div><h1 class="vc-title">Fahrzeugkatalog</h1><div class="vc-subtitle">Übersicht der im LSPD geführten Fahrzeuge und ihrer Fahrzeugklassen.</div></div><button class="vc-button primary" id="vcAddButton" hidden>＋ Fahrzeug hinzufügen</button></div>
 <div class="vc-admin" id="vcAdmin">
  <h3 id="vcFormTitle">Fahrzeug anlegen</h3>
  <div class="vc-form-grid">
   <input class="vc-field" id="vcName" placeholder="Fahrzeugname / Modell">
   <select class="vc-field" id="vcClass"><option value="STR">STR – Straßenwagen</option><option value="STR (UM)">STR (UM) – Straßenwagen (UM)</option><option value="OFF">OFF – Offroad</option><option value="OFF (UM)">OFF (UM) – Offroad (UM)</option><option value="HSP">HSP – Hochgeschwindigkeit</option><option value="HSP (UM)">HSP (UM) – Hochgeschwindigkeit (UM)</option><option value="OVW">OVW – Overwatch</option></select>
   <input class="vc-field full" id="vcImage" placeholder="Imgur-Bildlink (idealerweise direkter i.imgur.com-Link)">
   <textarea class="vc-field full" id="vcDescription" rows="2" placeholder="Beschreibung / Hinweise (optional)"></textarea>
  </div>
  <div class="vc-form-actions"><button class="vc-button" id="vcCancel">Abbrechen</button><button class="vc-button primary" id="vcSave">Speichern</button></div><div class="vc-status" id="vcStatus"></div>
 </div>
 <div class="vc-toolbar"><input class="vc-search" id="vcSearch" type="search" placeholder="Fahrzeug oder Beschreibung suchen …"><button class="vc-button" id="vcRefresh">Aktualisieren</button></div>
 <div class="vc-filters" id="vcFilters"></div>
 <div class="vc-count" id="vcCount"></div>
 <div class="vc-grid" id="vcGrid"><div class="vc-loading">Fahrzeugkatalog wird geladen …</div></div>
</div>
<div id="vcDeleteDialog" class="vc-dialog" aria-hidden="true">
 <section class="vc-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="vcDeleteTitle">
  <h2 id="vcDeleteTitle" class="vc-dialog-title">Fahrzeug entfernen?</h2>
  <p id="vcDeleteText" class="vc-dialog-copy"></p>
  <div class="vc-dialog-actions"><button class="vc-button" id="vcDeleteCancel" type="button">Abbrechen</button><button class="vc-button danger" id="vcDeleteConfirm" type="button">Entfernen</button></div>
 </section>
</div>
<script src="/js/pages/vehicle-catalog.js?v=3.76" defer></script>
</main>
