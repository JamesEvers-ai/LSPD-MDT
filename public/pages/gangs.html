<main class="mdt-workspace mdt-workspace--gangs" data-mdt-page="gangs" data-lspd-module="gangs">
<section class="mdt-module" id="mdt-module-gangs">
 <h2>Gangübersicht</h2><div class="sub">Ermittlungsrelevante Gruppierungen und Hinweise erfassen.</div>
 <div class="toolbar"><input id="gangs-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="gangs-reload">Aktualisieren</button><button id="gangs-new">+ Neuer Eintrag</button></div>
 <div class="message" id="gangs-message" role="status">Daten werden geladen …</div>
 <div class="form" id="gangs-form" style="display:none">
  <input id="gangs-title" placeholder="Titel / Gruppierung" maxlength="180">
  <select id="gangs-status"><option value="active">Active</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="gangs-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="gangs-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="gangs-save">Speichern</button><button class="secondary" id="gangs-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="gangs-items"></div>
</section>
<script src="/js/pages/gangs.js?v=3.76" defer></script>
</main>
