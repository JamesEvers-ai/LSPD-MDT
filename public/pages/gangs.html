<style>
#mdt-module-gangs{max-width:1280px;margin:0 auto;padding:18px 20px 60px;color:#1a2d42}
#mdt-module-gangs .gang-head{background:linear-gradient(105deg,#12385f,#1d5687);color:#fff;border-left:4px solid #e2c52b;border-radius:10px;padding:18px 22px;margin-bottom:16px}
#mdt-module-gangs .gang-head h2{margin:0;color:#fff;font-size:22px}#mdt-module-gangs .gang-head p{margin:5px 0 0;color:#d9e7f4;font-size:12px}
#mdt-module-gangs .toolbar{display:flex;gap:8px;align-items:center;margin:12px 0}
#mdt-module-gangs input,#mdt-module-gangs textarea,#mdt-module-gangs select{background:#fff!important;color:#1a2d42!important;border:1px solid #cbd7e3;border-radius:7px;padding:9px 11px;font:inherit;min-width:0}
#mdt-module-gangs .toolbar input{flex:1;max-width:420px}
#mdt-module-gangs button{border:0;border-radius:7px;padding:9px 13px;background:#17466f;color:#fff;font-weight:700;cursor:pointer}
#mdt-module-gangs button.secondary{background:#e8eef5;color:#24415e;border:1px solid #cbd7e3}#mdt-module-gangs button.danger{background:#a8323c;color:#fff}
#mdt-module-gangs .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;background:#fff;border:1px solid #d5dfeb;border-radius:10px;padding:16px;margin:14px 0}
#mdt-module-gangs .form label{display:grid;gap:5px;font-size:11px;font-weight:750;color:#40566e}
#mdt-module-gangs .form textarea{min-height:92px;resize:vertical}#mdt-module-gangs .wide{grid-column:1/-1}
#mdt-module-gangs .actions{display:flex;gap:7px;flex-wrap:wrap}
#mdt-module-gangs .items{display:grid;gap:12px}
#mdt-module-gangs .item{background:#fff;border:1px solid #d5dfeb;border-radius:10px;padding:16px;box-shadow:0 3px 12px rgba(16,40,71,.05)}
#mdt-module-gangs .itemhead{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e3eaf1;padding-bottom:10px;margin-bottom:12px}
#mdt-module-gangs h3{margin:0;color:#17395f;font-size:16px}#mdt-module-gangs .meta{font-size:11px;color:#718399;margin-top:5px}
#mdt-module-gangs .evidence-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#mdt-module-gangs .evidence-field{background:#f5f8fb;border:1px solid #e1e8f0;border-radius:7px;padding:10px;min-width:0}
#mdt-module-gangs .evidence-field strong{display:block;color:#1d5687;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
#mdt-module-gangs .evidence-field div{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#263b50}
#mdt-module-gangs .message{font-size:12px;color:#60758a;margin:8px 0}
#mdt-module-gangs .empty{background:#fff;border:1px dashed #bdcbd9;border-radius:10px;padding:24px;text-align:center;color:#718399}
@media(max-width:680px){#mdt-module-gangs .form,#mdt-module-gangs .evidence-grid{grid-template-columns:1fr}#mdt-module-gangs .wide{grid-column:1}#mdt-module-gangs .itemhead{display:block}#mdt-module-gangs .itemhead .actions{margin-top:8px}}
</style>
<section id="mdt-module-gangs">
 <header class="gang-head"><h2>Gang Enforcement Detail – Beweisakten</h2><p>Strukturierte Erfassung von Ermittlungsfällen, Tathergängen und Beweismitteln gegen Gruppierungen</p></header>
 <div class="toolbar"><input id="gangs-search" placeholder="Beweisakten durchsuchen…" aria-label="Beweisakten durchsuchen"><button class="secondary" id="gangs-reload">Aktualisieren</button><button id="gangs-new">+ Neue Beweisakte</button></div>
 <div class="message" id="gangs-message" role="status">Beweisakten werden geladen …</div>
 <div class="form" id="gangs-form" style="display:none">
  <label>Aktenzeichen / Titel<input id="gangs-title" maxlength="180" placeholder="z. B. GED-2026-001"></label>
  <label>Gruppierung<input id="gangs-group" maxlength="180" placeholder="Name der Gruppierung"></label>
  <label>Ermittlungsstatus<select id="gangs-status"><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Freigegeben</option><option value="closed">Abgeschlossen</option></select></label>
  <label>Tatzeitpunkt<input id="gangs-date" type="datetime-local"></label>
  <label class="wide">Beschreibung<textarea id="gangs-description" placeholder="Zusammenfassung des Ermittlungsstands …"></textarea></label>
  <label class="wide">Tathergang<textarea id="gangs-occurrence" placeholder="Chronologischer Ablauf, beteiligte Personen und Feststellungen …"></textarea></label>
  <label class="wide">Beweismittel<textarea id="gangs-evidence" placeholder="Videoaufnahmen, Fotos, Zeugenaussagen, Funkmitschnitte, sichergestellte Gegenstände …"></textarea></label>
  <label class="wide">Sonstige Informationen<textarea id="gangs-other" placeholder="Ergänzende Hinweise, Verknüpfungen, offene Ermittlungsansätze …"></textarea></label>
  <div class="actions wide"><button id="gangs-save">Beweisakte speichern</button><button class="secondary" id="gangs-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="gangs-items"></div>
</section>
<script>
(()=>{const key="gangs",root=document.getElementById('mdt-module-gangs');if(!root||root.dataset.ready)return;root.dataset.ready='1';let rows=[],editing=null;
 const el=id=>document.getElementById(key+'-'+id),msg=t=>el('message').textContent=t;
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const call=(method,...args)=>new Promise((resolve,reject)=>{const r=CloudApi.run;r.withSuccessHandler(resolve).withFailureHandler(reject)[method](sessionStorage.getItem('fib_mdt_session')||'',...args)});
 const date=v=>{if(!v)return '—';try{return new Date(v).toLocaleString()}catch{return String(v)}};
 const meta=r=>r.metadata&&typeof r.metadata==='object'?r.metadata:{};
 function render(){const q=el('search').value.trim().toLowerCase();const filtered=rows.filter(r=>[r.title,r.description,r.status,r.created_by_name,JSON.stringify(meta(r))].join(' ').toLowerCase().includes(q));el('items').innerHTML=filtered.length?filtered.map(r=>{const m=meta(r);return `<article class="item"><div class="itemhead"><div><h3>${esc(r.title||'Beweisakte')}</h3><div class="meta">${esc(m.group_name||'Gruppierung nicht angegeben')} · ${esc(r.status||'')} · ${esc(date(r.eventDate||r.created_at))} · ${esc(r.created_by_name||'')}</div></div><div class="actions"><button class="secondary" data-edit="${esc(r.id)}">Bearbeiten</button><button class="danger" data-delete="${esc(r.id)}">Löschen</button></div></div><div class="evidence-grid">${[['Beschreibung',r.description],['Tathergang',m.occurrence],['Beweismittel',m.evidence],['Sonstiges',m.other]].map(([label,value])=>`<section class="evidence-field"><strong>${label}</strong><div>${esc(value||'Keine Angaben hinterlegt.')}</div></section>`).join('')}</div></article>`}).join(''):'<div class="empty">Keine Beweisakten vorhanden.</div>'}
 async function load(){msg('Beweisakten werden geladen …');try{rows=await call('getModuleItems',key);if(!Array.isArray(rows))rows=[];msg(`${rows.length} Beweisakten geladen.`);render()}catch(e){msg(e.message||'Laden fehlgeschlagen.');el('items').innerHTML='<div class="empty">Zugriff fehlgeschlagen. Bitte die Berechtigung gangs.evidence.view prüfen.</div>'}}
 function open(r){editing=r?.id||null;const m=meta(r||{});el('form').style.display='grid';el('title').value=r?.title||'';el('group').value=m.group_name||'';el('status').value=r?.status||'active';el('description').value=r?.description||'';el('occurrence').value=m.occurrence||'';el('evidence').value=m.evidence||'';el('other').value=m.other||'';const d=r?.eventDate?new Date(r.eventDate):null;el('date').value=d&&!isNaN(d)?new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16):''}
 function close(){el('form').style.display='none';editing=null}
 el('new').addEventListener('click',()=>open());el('cancel').addEventListener('click',close);
 el('save').addEventListener('click',async()=>{const title=el('title').value.trim();if(!title){msg('Bitte ein Aktenzeichen oder einen Titel angeben.');return}const data={title,description:el('description').value.trim(),status:el('status').value,eventDate:el('date').value?new Date(el('date').value).toISOString():null,metadata:{entry_type:'gang_evidence',group_name:el('group').value.trim(),occurrence:el('occurrence').value.trim(),evidence:el('evidence').value.trim(),other:el('other').value.trim()}};el('save').disabled=true;try{if(editing)await call('updateModuleItem',key,editing,data);else await call('createModuleItem',key,data);close();msg('Beweisakte gespeichert.');await load()}catch(e){msg(e.message||'Speichern fehlgeschlagen.')}finally{el('save').disabled=false}});
 el('items').addEventListener('click',async e=>{const edit=e.target.closest('[data-edit]'),del=e.target.closest('[data-delete]');if(edit){const r=rows.find(x=>String(x.id)===edit.dataset.edit);if(r)open(r)}if(del){if(!window.confirm('Diese Beweisakte wirklich löschen?'))return;try{await call('deleteModuleItem',key,del.dataset.delete);await load()}catch(err){msg(err.message||'Löschen fehlgeschlagen.')}}});
 el('search').addEventListener('input',render);el('reload').addEventListener('click',load);window.addEventListener('fib-mdt:refresh-request',()=>{if(root.isConnected&&el('form').style.display==='none')load()});window.addEventListener('fib-mdt:data-changed',()=>{if(root.isConnected&&el('form').style.display==='none')load()});load();
})();
</script>
