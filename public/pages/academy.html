<style>
.academy-page{max-width:1280px;margin:0 auto;padding:26px 28px 44px;color:#17263b}.academy-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:18px}.academy-kicker{font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8a6b2d;margin-bottom:7px}.academy-head h2{margin:0;color:#12233b;font-size:25px;font-weight:800}.academy-subtitle{margin-top:7px;color:#64748b;font-size:13px}.academy-actions{display:flex;gap:8px;flex-wrap:wrap}.academy-btn{border:1px solid #d5deea;border-radius:8px;background:#fff;color:#1c304c;padding:9px 13px;font:600 12px inherit;cursor:pointer}.academy-btn.primary{background:#17345b;color:#fff;border-color:#17345b}.academy-btn.danger{color:#a33131;border-color:#e9caca}.academy-tabs{display:flex;gap:6px;border-bottom:1px solid #dce4ee;margin-bottom:18px}.academy-tab{border:0;background:transparent;padding:10px 14px;color:#718096;font:700 11px inherit;cursor:pointer;border-bottom:2px solid transparent}.academy-tab.active{color:#17345b;border-bottom-color:#b18b43}.academy-panel{display:none}.academy-panel.active{display:block}.academy-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.academy-card{background:#fff;border:1px solid #dce3ec;border-radius:12px;padding:16px;box-shadow:0 4px 14px rgba(25,44,70,.035)}.academy-card h3{margin:0;color:#17345b;font-size:14px}.academy-meta{margin-top:6px;color:#8290a1;font-size:10px}.academy-content{margin-top:12px;color:#43536a;font-size:12px;line-height:1.6}.academy-tag{display:inline-flex;padding:3px 8px;border-radius:20px;background:#eef3f8;color:#47617f;font-size:9px;font-weight:800}.academy-empty{padding:30px;text-align:center;border:1px dashed #d6dee8;border-radius:10px;color:#8793a4;background:#fff;font-size:12px}.academy-section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.academy-section-head h3{margin:0;font-size:15px;color:#17345b}.academy-form{display:grid;gap:12px}.academy-field{display:grid;gap:5px}.academy-field label{font-size:10px;font-weight:800;color:#53677e}.academy-field input,.academy-field textarea,.academy-field select{width:100%;box-sizing:border-box;border:1px solid #ccd6e2;border-radius:7px;background:#fff;color:#1b2d45;padding:9px 10px;font:inherit;font-size:11px;outline:none}.academy-field textarea{min-height:120px;resize:vertical}.academy-field input:focus,.academy-field textarea:focus,.academy-field select:focus{border-color:#8a713b;box-shadow:0 0 0 3px rgba(177,145,75,.12)}.academy-question{border:1px solid #e0e6ee;border-radius:9px;padding:12px;background:#fafbfd}.academy-question-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.academy-question-title{font-size:11px;font-weight:800;color:#29425f}.academy-option{display:grid;grid-template-columns:24px 1fr;gap:7px;align-items:center;margin-top:7px}.academy-option input[type=text]{min-width:0}.academy-test-actions{display:flex;gap:7px;margin-top:12px}.academy-score{padding:16px;border-radius:10px;background:#f6f9fc;border:1px solid #dce4ee}.academy-score strong{font-size:22px;color:#17345b}.academy-answer{margin-top:12px;padding:12px;border:1px solid #dce3ec;border-radius:8px;background:#fff}.academy-answer label{display:block;margin:6px 0;font-size:11px;color:#334963}.academy-note{padding:10px 12px;border:1px solid #dce4ee;background:#f7f9fc;border-radius:8px;color:#5d6d81;font-size:10px;margin-bottom:14px}
@media(max-width:850px){.academy-head{display:block}.academy-actions{margin-top:14px}.academy-grid{grid-template-columns:1fr}}
</style>
<section class="academy-page" id="academyPage">
  <header class="academy-head">
    <div><div class="academy-kicker">Training & Qualification</div><h2>Police Academy</h2><div class="academy-subtitle">Schulungsunterlagen, Ausbildungstests und Qualifikationsnachweise für das Department.</div></div>
    <div class="academy-actions"><button class="academy-btn" id="academyRefresh">Aktualisieren</button><button class="academy-btn primary" id="academyNewDocument" style="display:none">+ Schulungsdokument</button><button class="academy-btn primary" id="academyNewTest" style="display:none">+ Abschlusstest</button></div>
  </header>
  <div class="academy-note" id="academyAccessNote">Der Academy-Bereich ist nur für freigeschaltete Abteilungen verfügbar.</div>
  <nav class="academy-tabs"><button class="academy-tab active" data-academy-tab="documents">Schulungsdokumente</button><button class="academy-tab" data-academy-tab="tests">Abschlusstests</button><button class="academy-tab" data-academy-tab="mytests">Meine Ergebnisse</button></nav>
  <section class="academy-panel active" id="academyPanelDocuments"><div class="academy-section-head"><h3>Unterlagen</h3><span class="academy-tag" id="academyDocumentCount">0 Dokumente</span></div><div class="academy-grid" id="academyDocuments"></div></section>
  <section class="academy-panel" id="academyPanelTests"><div class="academy-section-head"><h3>Abschlusstests</h3><span class="academy-tag" id="academyTestCount">0 Tests</span></div><div class="academy-grid" id="academyTests"></div></section>
  <section class="academy-panel" id="academyPanelMytests"><div class="academy-section-head"><h3>Meine Testergebnisse</h3></div><div id="academyResults"></div></section>
</section>
<script>
(function(){
  "use strict";
  const root=document.getElementById("academyPage"); if(!root||root.dataset.ready==="1")return; root.dataset.ready="1";
  const state={documents:[],tests:[],results:[],manage:false};
  const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const call=(method,...args)=>new Promise((resolve,reject)=>{const r=CloudApi.run;r.withSuccessHandler(resolve).withFailureHandler(reject)[method](sessionStorage.getItem("fib_mdt_session")||"",...args)});
  function setTab(tab){root.querySelectorAll(".academy-tab").forEach(b=>b.classList.toggle("active",b.dataset.academyTab===tab));root.querySelectorAll(".academy-panel").forEach(p=>p.classList.toggle("active",p.id===`academyPanel${tab.charAt(0).toUpperCase()+tab.slice(1)}`));}
  root.querySelectorAll(".academy-tab").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.academyTab)));
  function renderDocuments(){const el=document.getElementById("academyDocuments");document.getElementById("academyDocumentCount").textContent=`${state.documents.length} Dokumente`;el.innerHTML=state.documents.length?state.documents.map(d=>`<article class="academy-card"><span class="academy-tag">${esc(d.category||"Ausbildung")}</span><h3 style="margin-top:8px">${esc(d.title)}</h3><div class="academy-meta">${esc(d.created_by_name||"Unbekannt")} · ${d.updated_at?esc(new Date(d.updated_at).toLocaleDateString("de-DE")):""}</div><div class="academy-content">${esc(d.content||"").slice(0,500)}</div>${state.manage?`<div class="academy-test-actions"><button class="academy-btn" data-edit-doc="${esc(d.id)}">Bearbeiten</button><button class="academy-btn danger" data-del-doc="${esc(d.id)}">Löschen</button></div>`:""}</article>`).join(""):"<div class=\"academy-empty\">Noch keine Schulungsdokumente vorhanden.</div>";}
  function renderTests(){const el=document.getElementById("academyTests");document.getElementById("academyTestCount").textContent=`${state.tests.length} Tests`;el.innerHTML=state.tests.length?state.tests.map(t=>`<article class="academy-card"><span class="academy-tag">Abschlusstest</span><h3 style="margin-top:8px">${esc(t.title)}</h3><div class="academy-meta">Bestehensgrenze: ${esc(t.passing_score)} % · ${Array.isArray(t.questions)?t.questions.length:0} Fragen</div><div class="academy-content">${esc(t.description||"Kein Beschreibungstext hinterlegt.")}</div><div class="academy-test-actions"><button class="academy-btn primary" data-take-test="${esc(t.id)}">Test starten</button>${state.manage?`<button class="academy-btn" data-edit-test="${esc(t.id)}">Bearbeiten</button><button class="academy-btn danger" data-del-test="${esc(t.id)}">Löschen</button>`:""}</div></article>`).join(""):"<div class=\"academy-empty\">Noch kein Abschlusstest angelegt.</div>";}
  function renderResults(){const el=document.getElementById("academyResults");el.innerHTML=state.results.length?state.results.map(r=>`<article class="academy-card" style="margin-bottom:10px"><h3>${esc(r.test_title||"Abschlusstest")}</h3><div class="academy-meta">${r.submitted_at?esc(new Date(r.submitted_at).toLocaleString("de-DE")):""}</div><div class="academy-score" style="margin-top:10px"><strong>${esc(r.score)} %</strong><div>${r.passed?"Bestanden":"Nicht bestanden"}</div></div></article>`).join(""):"<div class=\"academy-empty\">Noch keine Testergebnisse vorhanden.</div>";}
  function questionEditor(questions){return `<div id="academyQuestions">${(questions&&questions.length?questions:[{prompt:"",options:["","","",""],correctIndex:0}]).map((q,i)=>`<div class="academy-question" data-q="${i}"><div class="academy-question-head"><div class="academy-question-title">Frage ${i+1}</div><button type="button" class="academy-btn danger" data-remove-q="${i}">Entfernen</button></div><div class="academy-field" style="margin-top:8px"><label>Frage</label><input data-q-prompt value="${esc(q.prompt||"")}" placeholder="Fragetext"></div>${[0,1,2,3].map(j=>`<div class="academy-option"><input type="radio" name="academyCorrect${i}" data-q-correct value="${j}" ${Number(q.correctIndex)===j?"checked":""}><input type="text" data-q-option value="${esc((q.options||[])[j]||"")}" placeholder="Antwort ${j+1}"></div>`).join("")}</div>`).join("")}</div><button type="button" class="academy-btn" id="academyAddQuestion" style="margin-top:8px">+ Frage hinzufügen</button>`;}
  function collectQuestions(){return [...document.querySelectorAll("#academyQuestions .academy-question")].map((el)=>({prompt:el.querySelector("[data-q-prompt]")?.value.trim()||"",options:[...el.querySelectorAll("[data-q-option]")].map(x=>x.value.trim()),correctIndex:Number(el.querySelector("[data-q-correct]:checked")?.value||0)})).filter(q=>q.prompt&&q.options.some(Boolean));}
  function openDocument(row){FIB_MDT_MODAL.open({title:row?"Schulungsdokument bearbeiten":"Schulungsdokument erstellen",subtitle:"Police Academy",body:`<div class="academy-form"><div class="academy-field"><label>Titel</label><input id="academyDocTitle" value="${esc(row?.title||"")}"></div><div class="academy-field"><label>Kategorie</label><input id="academyDocCategory" value="${esc(row?.category||"Ausbildung")}"></div><div class="academy-field"><label>Inhalt</label><textarea id="academyDocContent">${esc(row?.content||"")}</textarea></div></div>`,saveVisible:true,saveText:"Speichern",cancelText:"Abbrechen",onSave:async()=>{const data={id:row?.id,title:document.getElementById("academyDocTitle")?.value.trim(),category:document.getElementById("academyDocCategory")?.value.trim(),content:document.getElementById("academyDocContent")?.value.trim()};if(!data.title||!data.content)throw new Error("Titel und Inhalt sind erforderlich.");call("academySaveDocument",data).then(()=>{FIB_MDT_MODAL.close();load();}).catch(err=>alert(err.message||"Speichern fehlgeschlagen."));return false;}});}
  function bindQuestionEditor(){const add=document.getElementById("academyAddQuestion");if(add&&!add.dataset.bound){add.dataset.bound="1";add.addEventListener("click",()=>{const box=document.getElementById("academyQuestions");if(!box)return;const i=box.querySelectorAll(".academy-question").length;box.insertAdjacentHTML("beforeend",`<div class="academy-question" data-q="${i}"><div class="academy-question-head"><div class="academy-question-title">Frage ${i+1}</div><button type="button" class="academy-btn danger" data-remove-q="${i}">Entfernen</button></div><div class="academy-field" style="margin-top:8px"><label>Frage</label><input data-q-prompt placeholder="Fragetext"></div>${[0,1,2,3].map(j=>`<div class="academy-option"><input type="radio" name="academyCorrect${i}" data-q-correct value="${j}" ${j===0?"checked":""}><input type="text" data-q-option placeholder="Antwort ${j+1}"></div>`).join("")}</div>`);bindQuestionEditor();});}document.querySelectorAll("[data-remove-q]").forEach(btn=>{if(btn.dataset.bound)return;btn.dataset.bound="1";btn.addEventListener("click",()=>{btn.closest(".academy-question")?.remove();});});}
  function openTest(row){const questions=row?.questions||[];FIB_MDT_MODAL.open({title:row?"Abschlusstest bearbeiten":"Abschlusstest erstellen",subtitle:"Police Academy",body:`<div class="academy-form"><div class="academy-field"><label>Titel</label><input id="academyTestTitle" value="${esc(row?.title||"")}"></div><div class="academy-field"><label>Beschreibung</label><textarea id="academyTestDescription">${esc(row?.description||"")}</textarea></div><div class="academy-field"><label>Bestehensgrenze in Prozent</label><input id="academyTestPassing" type="number" min="1" max="100" value="${esc(row?.passing_score||70)}"></div>${questionEditor(questions)}</div>`,saveVisible:true,saveText:"Test speichern",cancelText:"Abbrechen",onSave:async()=>{const data={id:row?.id,title:document.getElementById("academyTestTitle")?.value.trim(),description:document.getElementById("academyTestDescription")?.value.trim(),passingScore:Number(document.getElementById("academyTestPassing")?.value||70),questions:collectQuestions()};if(!data.title||!data.questions.length)throw new Error("Titel und mindestens eine Frage sind erforderlich.");call("academySaveTest",data).then(()=>{FIB_MDT_MODAL.close();load();}).catch(err=>alert(err.message||"Speichern fehlgeschlagen."));return false;}});bindQuestionEditor();}
  function openTakeTest(test){const qs=Array.isArray(test.questions)?test.questions:[];FIB_MDT_MODAL.open({title:test.title,subtitle:"Abschlusstest",body:`<div class="academy-form">${qs.map((q,i)=>`<div class="academy-answer"><strong>Frage ${i+1}</strong><div style="margin-top:6px;font-size:12px;color:#29425f">${esc(q.prompt)}</div>${(q.options||[]).map((o,j)=>`<label><input type="radio" name="academyAnswer${i}" value="${j}"> ${esc(o)}</label>`).join("")}</div>`).join("")}</div>`,saveVisible:true,saveText:"Test abgeben",cancelText:"Abbrechen",onSave:async()=>{const answers=qs.map((q,i)=>Number(document.querySelector(`input[name="academyAnswer${i}"]:checked`)?.value??-1));if(answers.some(v=>v<0))throw new Error("Bitte jede Frage beantworten.");call("academySubmitTest",test.id,answers).then(result=>{FIB_MDT_MODAL.close();load();setTab("mytests");alert(result.passed?`Bestanden: ${result.score} %`:`Nicht bestanden: ${result.score} %`);}).catch(err=>alert(err.message||"Test konnte nicht abgegeben werden."));return false;}});}
  root.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;try{if(b.dataset.editDoc){openDocument(state.documents.find(x=>String(x.id)===b.dataset.editDoc));}else if(b.dataset.delDoc){if(confirm("Schulungsdokument wirklich löschen?")){await call("academyDeleteDocument",b.dataset.delDoc);await load();}}else if(b.dataset.editTest){openTest(state.tests.find(x=>String(x.id)===b.dataset.editTest));}else if(b.dataset.delTest){if(confirm("Abschlusstest wirklich löschen?")){await call("academyDeleteTest",b.dataset.delTest);await load();}}else if(b.dataset.takeTest){openTakeTest(state.tests.find(x=>String(x.id)===b.dataset.takeTest));}}catch(err){alert(err.message||"Die Aktion konnte nicht ausgeführt werden.");}});
  document.getElementById("academyNewDocument").addEventListener("click",()=>openDocument());document.getElementById("academyNewTest").addEventListener("click",()=>openTest());document.getElementById("academyRefresh").addEventListener("click",load);
  async function load(){try{const data=await call("academyGetData");state.documents=data.documents||[];state.tests=data.tests||[];state.results=data.results||[];state.manage=!!data.manage;document.getElementById("academyNewDocument").style.display=state.manage?"":"none";document.getElementById("academyNewTest").style.display=state.manage?"":"none";renderDocuments();renderTests();renderResults();}catch(e){root.innerHTML=`<div class="academy-empty"><strong>Kein Zugriff</strong><div style="margin-top:6px">${esc(e.message||"Der Academy-Bereich konnte nicht geladen werden.")}</div></div>`;}}
  load();
})();
</script>
