<style>
#lspdRegulations{display:grid;gap:14px;color:#18324e;font:14px/1.5 Inter,'Segoe UI',Arial,sans-serif;min-width:0}#lspdRegulations *{box-sizing:border-box}#lspdRegulations .reg-hero{background:linear-gradient(110deg,#112c48,#1d507c);border-left:4px solid #e8bf37;border-radius:12px;padding:22px 26px;color:white;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}#lspdRegulations .reg-hero h1{font-size:24px;color:#fff!important;margin:3px 0}#lspdRegulations .reg-hero p{margin:0;color:#e3edf7}#lspdRegulations .reg-eyebrow{font-size:11px;font-weight:800;letter-spacing:.1em;color:#ffda69}#lspdRegulations .reg-panel{background:white;border:1px solid #d5e0ec;border-radius:10px;padding:16px;min-width:0}#lspdRegulations .reg-toolbar{display:flex;align-items:end;gap:12px;flex-wrap:wrap}#lspdRegulations .reg-toolbar label{display:grid;gap:4px;font-weight:650;font-size:12px;color:#405974}#lspdRegulations .reg-search{flex:1;min-width:200px}#lspdRegulations input,#lspdRegulations select{width:100%;height:39px;background:#fff!important;color:#18324e!important;border:1px solid #bdcddd!important;border-radius:7px;padding:8px 11px;font:inherit}#lspdRegulations button,.reg-modal button{font:650 13px/1.3 Inter,'Segoe UI',Arial,sans-serif;min-height:36px;border-radius:7px;border:1px solid #b8cce1;background:#eaf2fa;color:#164773;padding:8px 13px;cursor:pointer;white-space:nowrap}#lspdRegulations button.reg-primary,.reg-modal button.reg-primary{background:#1b5080;color:#fff;border-color:#1b5080}#lspdRegulations .reg-hero button{background:#fff;color:#173b60}#lspdRegulations button:disabled,.reg-modal button:disabled{opacity:.5;cursor:default}#lspdRegulations .reg-table-scroll{overflow:auto}#lspdRegulations table{width:100%;min-width:650px;border-collapse:collapse;table-layout:auto}#lspdRegulations th{background:#e8f0f8;color:#284d70;font-size:12px;text-align:left;text-transform:uppercase;letter-spacing:.04em}#lspdRegulations th,#lspdRegulations td{padding:12px 14px;border-bottom:1px solid #dce5ef;vertical-align:middle}#lspdRegulations td{color:#18324e}#lspdRegulations td:first-child{width:40%;overflow-wrap:anywhere}#lspdRegulations tr:hover td{background:#f7faff}#lspdRegulations .reg-tag{display:inline-block;background:#e9eff6;color:#415971;padding:3px 9px;border-radius:6px;white-space:nowrap;font-size:12px;font-weight:700}#lspdRegulations .reg-tag.published{background:#e5f4ea;color:#246242}#lspdRegulations .reg-tag.draft{background:#fff4d8;color:#785b18}#lspdRegulations .reg-pagination{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}#lspdRegulations .reg-empty{padding:30px;text-align:center;color:#526b81}#lspdRegulations [hidden],.reg-modal [hidden]{display:none!important}.reg-modal{display:grid;gap:14px;color:#18324e;font:14px/1.55 Inter,'Segoe UI',Arial,sans-serif}.reg-modal .reg-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.reg-modal label{display:grid;gap:5px;font-weight:650;color:#38536c}.reg-modal input,.reg-modal select,.reg-modal textarea{box-sizing:border-box;width:100%;background:#fff!important;color:#18324e!important;border:1px solid #bdcddd!important;border-radius:7px;padding:10px 12px;font:inherit}.reg-modal textarea{min-height:270px;resize:vertical;line-height:1.55}.reg-modal .reg-document{background:#fff;border:1px solid #d5e0ec;border-radius:8px;padding:20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;color:#18324e}.reg-modal .reg-meta{color:#526b81;font-size:12px}.reg-modal .reg-error{color:#a12929;white-space:pre-wrap}.reg-modal .reg-history-row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dce5ef;padding:10px 0;gap:10px}.reg-modal .reg-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.reg-modal .reg-fields{grid-template-columns:1fr}#lspdRegulations .reg-hero{padding:16px}}
html body #pageContainer #lspdRegulations{padding:20px 24px 40px!important}html body #pageContainer #lspdRegulations .reg-hero p{color:#e3edf7!important;font-size:14px!important}html body #pageContainer #lspdRegulations td{font-size:14px!important;line-height:1.45!important;color:#18324e!important}html body #pageContainer #lspdRegulations td strong{font-size:15px!important;color:#173b60!important}html body #pageContainer #lspdRegulations th{font-size:12px!important}#fibGlobalModalOverlay .reg-modal textarea#regContent{height:clamp(210px,32vh,320px)!important;min-height:210px!important;max-height:none!important;font-size:14px!important;font-weight:400!important;line-height:1.6!important;resize:vertical!important}#fibGlobalModalOverlay .reg-modal .reg-document{font-size:15px!important;line-height:1.7!important}#fibGlobalModalOverlay .reg-modal input{font-size:14px!important} @media(max-width:700px){html body #pageContainer #lspdRegulations{padding:10px!important}}
</style>
<section id="lspdRegulations">
 <header class="reg-hero"><div><div class="reg-eyebrow">LOS SANTOS POLICE DEPARTMENT · DEPARTMENT</div><h1>Dienstvorschriften</h1><p>Zentrale Bibliothek der geltenden Anweisungen und Richtlinien.</p></div><button id="regNew" type="button" hidden>+ Dienstvorschrift anlegen</button></header>
 <section class="reg-panel reg-toolbar"><label class="reg-search">Suche<input id="regSearch" type="search" maxlength="100" placeholder="Titel oder Kategorie …"></label><label id="regFilterWrap" hidden>Status<select id="regFilter"><option value="">Alle</option><option value="published">Veröffentlicht</option><option value="draft">Entwurf</option><option value="archived">Archiviert</option></select></label><button id="regRefresh" type="button">Aktualisieren</button></section>
 <section class="reg-panel" aria-label="Vorschriftenübersicht"><div id="regList" class="reg-table-scroll" aria-live="polite">Dienstvorschriften werden geladen …</div><div class="reg-pagination"><span id="regPage"></span><div><button id="regPrev" type="button" disabled>Zurück</button> <button id="regNext" type="button" disabled>Weiter</button></div></div></section>
</section>
<script>
(function(){
 'use strict';
 const root=document.getElementById('lspdRegulations');if(!root)return;
 const $=id=>root.querySelector('#'+id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const token=()=>sessionStorage.getItem('fib_mdt_session')||'';
 const api=(method,...args)=>window.runServer(method,token(),...args);
 const alive=()=>root.isConnected;
 const label=s=>({draft:'Entwurf',published:'Veröffentlicht',archived:'Archiviert'}[s]||s);
 const date=s=>{const d=new Date(s);return Number.isNaN(d.getTime())?'—':d.toLocaleString('de-AT',{dateStyle:'short',timeStyle:'short'});};
 let offset=0,request=0,manage=false,rows=[],debounce,modalGeneration=0;
 function list(){
  const n=++request;$('regList').textContent='Dienstvorschriften werden geladen …';$('regNext').disabled=true;$('regPrev').disabled=true;
  api('getRegulations',{offset,search:$('regSearch').value,status:$('regFilter').value}).then(data=>{
   if(!alive()||n!==request)return;manage=data.canManage===true;rows=data.items||[];$('regNew').hidden=!manage;$('regFilterWrap').hidden=!manage;
   $('regPage').textContent='Seite '+(offset/50+1);$('regPrev').disabled=offset===0;$('regNext').disabled=!data.hasMore;
   $('regList').innerHTML=rows.length?`<table><thead><tr><th>Titel / Kategorie</th><th>Status</th><th>Version</th><th>Geändert</th><th>Aktion</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td><strong>${esc(r.title)}</strong><div>${esc(r.category)}</div></td><td><span class="reg-tag ${esc(r.status)}">${esc(label(r.status))}</span></td><td>V${esc(r.version)}</td><td>${esc(date(r.updated_at))}</td><td><button type="button" data-reg-read="${i}">Lesen</button></td></tr>`).join('')}</tbody></table>`:'<div class="reg-empty">Keine Dienstvorschriften gefunden.</div>';
  }).catch(e=>{if(alive()&&n===request)$('regList').textContent=e.message||'Die Vorschriften konnten nicht geladen werden.';});
 }
 function showError(e){window.MDT?.notify?.error?.('Dienstvorschriften',e.message||String(e));}
 function open(config){return window.FIB_MDT_MODAL.open({...config,modalClass:'agents'});}
 function isModalCurrent(n){return alive()&&n===modalGeneration&&document.getElementById('fibGlobalModalOverlay')?.classList.contains('open');}
 function read(r,historical=false,originalId=r.id){
  ++modalGeneration;open({title:r.title,subtitle:r.category+' · Version '+r.version+' · '+label(r.status),body:`<div class="reg-modal"><div class="reg-meta">${esc(date(r.updated_at))} · ${esc(r.updated_by_name||'')}</div><div class="reg-document">${esc(r.content)}</div></div>`,buttons:manage&&!historical?[{label:'Versionshistorie',onClick:()=>history(originalId,0)},{label:'Bearbeiten',variant:'primary',onClick:()=>edit(r)}]:manage&&historical?[{label:'Zur Historie',onClick:()=>history(originalId,0)}]:[],keepCancelButton:true});
 }
 async function loadRead(id){const n=++modalGeneration;try{const r=await api('getRegulation',id);if(alive()&&n===modalGeneration)read(r);}catch(e){if(alive())showError(e);}}
 function edit(r={}){
  const n=++modalGeneration;
  open({title:r.id?'Dienstvorschrift bearbeiten':'Dienstvorschrift anlegen',subtitle:r.id?'Version '+r.version+' · Änderungen werden als neue Version gespeichert':'Neue Vorschrift',body:`<div class="reg-modal" id="regEditor"><div class="reg-fields"><label>Titel<input id="regTitle" maxlength="180" value="${esc(r.title)}"></label><label>Kategorie<input id="regCategory" maxlength="100" placeholder="z. B. Allgemeiner Dienst" value="${esc(r.category)}"></label></div><label>Status<select id="regStatus"><option value="draft">Entwurf</option><option value="published">Veröffentlicht</option>${r.id?'<option value="archived">Archiviert</option>':''}</select></label><div class="reg-meta">Veröffentlichte Inhalte sind für berechtigte Mitarbeiter sichtbar. Änderungen an veröffentlichten Vorschriften werden mit dem Speichern wirksam. Entwürfe und archivierte Vorschriften sehen nur Verwalter.</div><label>Inhalt<textarea id="regContent" maxlength="60000" placeholder="Dienstvorschrift eingeben …">${esc(r.content)}</textarea></label><div id="regEditError" class="reg-error" role="alert"></div></div>`,saveVisible:true,saveText:'Speichern',cancelText:'Abbrechen',onSave:async button=>{
   const get=id=>document.getElementById(id);const data={id:r.id,version:r.version,title:get('regTitle').value,category:get('regCategory').value,status:get('regStatus').value,content:get('regContent').value};const error=get('regEditError');error.textContent='';button.disabled=true;
   try{await api('saveRegulation',data);if(isModalCurrent(n)&&get('regEditor'))window.FIB_MDT_MODAL.close();if(alive())list();}catch(e){if(isModalCurrent(n)&&get('regEditor'))error.textContent=e.message||String(e);}finally{if(isModalCurrent(n)&&get('regEditor'))button.disabled=false;}
  }});document.getElementById('regStatus').value=r.status||'draft';
 }
 async function history(id,start){
  const n=++modalGeneration;try{const data=await api('getRegulationHistory',id,start);if(!isModalCurrent(n))return;open({title:'Versionshistorie',subtitle:'Frühere Fassungen bleiben unverändert erhalten.',body:`<div class="reg-modal" id="regHistory">${data.items.map((r,i)=>`<div class="reg-history-row"><div><strong>V${esc(r.version)} · ${esc(label(r.status))}</strong><div class="reg-meta">${esc(r.title)} · ${esc(date(r.updated_at))} · ${esc(r.updated_by_name)}</div></div><button type="button" data-reg-version="${i}">Ansehen</button></div>`).join('')}<div class="reg-actions"><button id="regHistoryPrev" type="button" ${start===0?'disabled':''}>Zurück</button><button id="regHistoryNext" type="button" ${!data.hasMore?'disabled':''}>Weiter</button><button id="regHistoryCurrent" type="button">Aktuelle Fassung</button></div></div>`});const el=document.getElementById('regHistory');el.querySelectorAll('[data-reg-version]').forEach(b=>b.onclick=async()=>{const v=++modalGeneration;try{const r=await api('getRegulationVersion',id,data.items[Number(b.dataset.regVersion)].version);if(isModalCurrent(v))read(r,true,id);}catch(e){showError(e);}});el.querySelector('#regHistoryPrev').onclick=()=>history(id,start-50);el.querySelector('#regHistoryNext').onclick=()=>history(id,start+50);el.querySelector('#regHistoryCurrent').onclick=()=>loadRead(id);
  }catch(e){if(alive())showError(e);}
 }
 $('regList').addEventListener('click',e=>{const b=e.target.closest('[data-reg-read]');if(b&&rows[Number(b.dataset.regRead)])loadRead(rows[Number(b.dataset.regRead)].id);});$('regNew').onclick=()=>edit();$('regRefresh').onclick=list;$('regFilter').onchange=()=>{offset=0;list();};$('regSearch').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(()=>{if(alive()){offset=0;list();}},250);};$('regPrev').onclick=()=>{offset=Math.max(0,offset-50);list();};$('regNext').onclick=()=>{offset+=50;list();};list();
})();
</script>
