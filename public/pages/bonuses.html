<main class="mdt-workspace mdt-workspace--bonuses" data-mdt-page="bonuses" data-lspd-module="bonuses">
<section class="mdt-module" id="mdt-module-bonuses">
 <h2>Bonussystem</h2><div class="sub">Bonus- und Leistungsbuchungen dokumentieren.</div>
 <div class="toolbar"><input id="bonuses-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="bonuses-reload">Aktualisieren</button><button id="bonuses-new">+ Neuer Eintrag</button></div>
 <div class="message" id="bonuses-message" role="status">Daten werden geladen …</div>
 <div class="form" id="bonuses-form" style="display:none">
  <input id="bonuses-title" placeholder="Titel / Bonuseintrag" maxlength="180">
  <select id="bonuses-status"><option value="pending">Pending</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="bonuses-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="bonuses-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="bonuses-save">Speichern</button><button class="secondary" id="bonuses-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="bonuses-items"></div>
</section>
<script src="/js/pages/bonuses.js?v=3.76" defer></script>
</main>
