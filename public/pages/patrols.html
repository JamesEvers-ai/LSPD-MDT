


<div class="patrols-page">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="patrols-header">

        <div class="patrols-header-left">

            <div class="patrols-eyebrow">
                Los Santos Police Department
            </div>

            <h1 class="patrols-title">
                Leitstelle
            </h1>

            <div class="patrols-subtitle">
                Übersicht und Verwaltung der aktuell besetzten Streifeneinheiten
            </div>
            <div class="patrol-toolbar-action-hint" id="patrolPermissionHint" style="margin-top:6px;">
                Leitstelle
            </div>

        </div>


        <div class="patrols-header-actions">
<button
                type="button"
                class="patrol-header-button secondary"
                id="patrolRefreshButton"
            >
                <span
                    class="patrol-refresh-icon"
                    id="patrolRefreshIcon"
                >
                    <i class="fa-solid fa-rotate-right"></i>
                </span>

                Aktualisieren
            </button>

        </div>

    </div>


    <!-- Der persönliche Status wird global in der MDT-Topbar angezeigt. -->

    <!-- =====================================================
         FILTER
    ====================================================== -->

    <div class="patrol-toolbar patrol-group-toolbar" aria-label="Leitstellenansicht">
        <div class="patrol-group-toolbar-inner">
            <div class="patrol-group-toolbar-title">
                <span class="patrol-toolbar-label">Gruppieren nach</span>
                <span class="patrol-toolbar-meta" id="patrolCount">0 Streifen</span>
            </div>
            <div class="patrol-group-controls" role="group" aria-label="Streifen gruppieren nach">
                <button type="button" class="patrol-group-button" data-group="callsign">Callsign</button>
                <button type="button" class="patrol-group-button active" data-group="status">Status</button>
            </div>
        </div>
    </div>


    <!-- =====================================================
         CONTENT
    ====================================================== -->



    <div
        class="patrols-content"
        id="patrolsList"
    >

        <div class="patrol-loading-state">

            <div class="patrol-loading-spinner"></div>

            <div class="patrol-loading-text">
                Streifen werden geladen...
            </div>

            <div class="patrol-loading-subtext">
                Verbindung zur Leitstelle wird hergestellt
            </div>

        </div>

    </div>

</div>


<script>
(function () {
    "use strict";

    const state = {
        patrolData: [],
        patrolUsers: [],
        ownPersonnelProfile: null,
        ownPersonnelProfileLoaded: false,
        ownPersonnelProfilePromise: null,
        patrolDataLoaded: false,
        patrolUsersLoaded: false,
        patrolDataPromise: null,
        patrolUsersPromise: null,
        patrolFilters: {
            group: "status"
        },
        initialized: false,
        instanceId: "",
        mounted: false
    };

    window.__FIB_MDT_PATROLS__ = state;
    let active = true;
    let pendingRefresh = false;
    window.__fibPageLifecycle.addCleanup(()=>{active=false;});

    const PATROL_PERMISSIONS = Object.freeze({
        view: "patrols.view",
        create: "patrols.create",
        edit: "patrols.edit",
        delete: "patrols.delete"
    });

    let VEHICLES = [
        "STR",
        "STR (UM)",
        "OFF",
        "OFF (UM)",
        "HSP",
        "HSP (UM)",
        "OVW"
    ];

    const DEFAULT_STATUSES = ["10-1", "10-3", "10-6", "10-23", "10-76"];
    let STATUSES = [...DEFAULT_STATUSES];
    async function loadConfiguredTenCodes() {
      try {
        const result = await (window.fibGetPatrolDutyConfig ? window.fibGetPatrolDutyConfig() : window.runServer("getPatrolDutyConfig"));
        if(result?.tenCodes?.length) STATUSES=result.tenCodes.map(String);
        if(result?.vehicles?.length) VEHICLES=result.vehicles.map(String);
      } catch(e){ console.warn("Dienstkonfiguration:",e); }
    }

    const PAGE_CACHE_MS = 30000;

    window.fibCache = window.fibCache || {};
    window.fibCache.patrols = window.fibCache.patrols || { data: null, timestamp: 0 };
    window.fibCache.patrolUsers = window.fibCache.patrolUsers || { data: null, timestamp: 0 };

    function escapeHtml(value) {
        if (typeof window.escapeDashboardHtml === "function") {
            return window.escapeDashboardHtml(value);
        }

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getToken() {
        try {
            if (typeof sessionToken !== "undefined" && sessionToken) {
                return String(sessionToken);
            }
        } catch (error) {}

        try {
            return (
                sessionStorage.getItem("fib_mdt_session") ||
                sessionStorage.getItem("lspd_mdt_session") ||
                ""
            );
        } catch (error) {
            return "";
        }
    }

    function isMasterAccount() {
        try {
            if (typeof isMaster !== "undefined" && isMaster === true) return true;
        } catch (error) {}

        return window.isMaster === true;
    }

    function hasPatrolPermission(permission) {
        if (!permission) return true;
        if (isMasterAccount()) return true;

        try {
            if (typeof hasPermission === "function") return hasPermission(permission);
        } catch (error) {}

        try {
            if (
                Array.isArray(myPermissions) &&
                myPermissions.includes(permission)
            ) {
                return true;
            }
        } catch (error) {}

        return (
            Array.isArray(window.myPermissions) &&
            window.myPermissions.includes(permission)
        );
    }

    function canCreate() {
        return hasPatrolPermission(PATROL_PERMISSIONS.create);
    }

    function canEdit() {
        return hasPatrolPermission(PATROL_PERMISSIONS.edit);
    }

    function canDelete() {
        return isMasterAccount() || hasPatrolPermission(PATROL_PERMISSIONS.delete);
    }

    function currentDomInstance() {
        return (
            state.mounted &&
            state.instanceId &&
            document.getElementById("patrolsList")
        );
    }

    function systemNotify(type, title, message) {
        if (
            window.MDT &&
            MDT.notify &&
            typeof MDT.notify[type] === "function"
        ) {
            return MDT.notify[type](title, message);
        }

        return null;
    }

    function showSuccess(message) {
        return systemNotify("success", "Erfolgreich", message);
    }

    function showError(message) {
        return systemNotify(
            "error",
            "Fehler",
            message || "Die Aktion konnte nicht ausgeführt werden."
        );
    }

    function cacheValid(cache) {
        return (
            cache &&
            Array.isArray(cache.data) &&
            cache.timestamp > 0 &&
            Date.now() - cache.timestamp < PAGE_CACHE_MS
        );
    }

    function clearPatrolsCache() {
        window.fibCache.patrols.data = null;
        window.fibCache.patrols.timestamp = 0;
        state.patrolDataLoaded = false;
    }

    function clearPatrolUsersCache() {
        window.fibCache.patrolUsers.data = null;
        window.fibCache.patrolUsers.timestamp = 0;
        state.patrolUsersLoaded = false;
    }

    function getLoggedInUserId() {
        try {
            if (typeof currentUser !== "undefined" && currentUser) {
                return String(currentUser.id || currentUser.userId || currentUser.ID || "");
            }
        } catch (_) {}
        return String(window.currentUser?.id || window.currentUser?.userId || "");
    }

    function fetchOwnPersonnelProfile(forceReload) {
        if (state.ownPersonnelProfileLoaded && !forceReload) {

            return Promise.resolve(state.ownPersonnelProfile);
        }
        if (state.ownPersonnelProfilePromise && !forceReload) return state.ownPersonnelProfilePromise;
        state.ownPersonnelProfilePromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (profile) {
                    state.ownPersonnelProfile = profile && typeof profile === "object" ? profile : {};
                    state.ownPersonnelProfileLoaded = true;
                    state.ownPersonnelProfilePromise = null;


                    resolve(state.ownPersonnelProfile);
                })
                .withFailureHandler(function (error) {
                    state.ownPersonnelProfilePromise = null;
                    const callSignEl = document.getElementById("patrolOwnCallSign");
                    if (callSignEl) callSignEl.textContent = "Nicht verfügbar";
                    reject(error);
                })
                .getMyPersonnelProfile(getToken());
        });
        return state.ownPersonnelProfilePromise;
    }

    function updateCount() {
        const element = document.getElementById("patrolCount");
        if (!element) return;

        const count = Array.isArray(state.patrolData)
            ? state.patrolData.length
            : 0;

        element.textContent =
            count === 1 ? "1 Streife" : count + " Streifen";
    }

    function setLoading(loading) {
        const button = document.getElementById("patrolRefreshButton");
        const icon = document.getElementById("patrolRefreshIcon");

        if (button) {
            button.disabled = !!loading;
            button.classList.toggle("is-loading", !!loading);
        }

        if (icon) {
            icon.setAttribute("aria-busy", loading ? "true" : "false");
        }
    }

    function renderAccessDenied() {
        const container = document.getElementById("patrolsList");
        if (!container) return;

        container.innerHTML = `
            <div class="patrol-inline-message">
                <div>
                    <strong>Kein Zugriff auf die Leitstelle</strong>
                    Für die Leitstelle wird die Berechtigung
                    „${escapeHtml(PATROL_PERMISSIONS.view)}“ benötigt.
                </div>
            </div>
        `;
    }

    function fetchPatrols(forceReload) {
        const cache = window.fibCache.patrols;

        if (!forceReload && cacheValid(cache)) {
            state.patrolData = cache.data;
            state.patrolDataLoaded = true;
            renderPatrols();


            return Promise.resolve(state.patrolData);
        }

        if (state.patrolDataPromise) {
            if(forceReload) pendingRefresh=true;
            return state.patrolDataPromise;
        }

        setLoading(true);

        state.patrolDataPromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (data) {
                    if(!active){state.patrolDataPromise=null;resolve([]);return;}
                    const normalized = Array.isArray(data) ? data : [];

                    state.patrolData = normalized;
                    state.patrolDataLoaded = true;
                    cache.data = normalized;
                    cache.timestamp = Date.now();

                    state.patrolDataPromise = null;
                    setLoading(false);
                    updateCount();
                    renderPatrols();


                    resolve(normalized);
                    if(pendingRefresh){pendingRefresh=false;fetchPatrols(true).catch(()=>{});}
                })
                .withFailureHandler(function (error) {
                    state.patrolDataPromise = null;
                    pendingRefresh=false;
                    if(!active){reject(error);return;}
                    setLoading(false);

                    if (!state.patrolData.length) {
                        const container =
                            document.getElementById("patrolsList");

                        if (container) {
                            container.innerHTML = `
                                <div class="patrol-empty">
                                    <div class="patrol-empty-icon">
                                        <i class="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                    <div class="patrol-empty-title">
                                        Leitstelle konnte nicht geladen werden
                                    </div>
                                    <div class="patrol-empty-text">
                                        Bitte versuche es erneut.
                                    </div>
                                </div>
                            `;
                        }
                    }

                    showError(
                        error && error.message
                            ? error.message
                            : "Die Streifen konnten nicht geladen werden."
                    );

                    reject(error);
                })
                .getPatrols(getToken());
        });

        return state.patrolDataPromise;
    }

    function fetchPatrolUsers(forceReload) {
        const cache = window.fibCache.patrolUsers;

        if (!forceReload && cacheValid(cache)) {
            state.patrolUsers = cache.data;
            state.patrolUsersLoaded = true;
            return Promise.resolve(state.patrolUsers);
        }

        if (state.patrolUsersPromise && !forceReload) {
            return state.patrolUsersPromise;
        }

        state.patrolUsersPromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (data) {
                    const normalized = Array.isArray(data) ? data : [];

                    state.patrolUsers = normalized;
                    state.patrolUsersLoaded = true;
                    cache.data = normalized;
                    cache.timestamp = Date.now();
                    state.patrolUsersPromise = null;

                    resolve(normalized);
                })
                .withFailureHandler(function (error) {
                    state.patrolUsersPromise = null;
                    showError(
                        error && error.message
                            ? error.message
                            : "Die Beamten konnten nicht geladen werden."
                    );
                    reject(error);
                })
                .getPatrolEligibleUsers(getToken());
        });

        return state.patrolUsersPromise;
    }

    // Patrol display colors are intentionally fixed.
    // The former master-only color customization was removed so patrol rendering
    // no longer depends on a persisted color configuration or optional globals.

    function refreshPatrolData() {
        clearPatrolsCache();
        return fetchPatrols(true);
    }

    function renderPatrols() {
        const container = document.getElementById("patrolsList");
        if (!container) return;

        updateCount();

        const filtered = state.patrolData.slice();

        if (!filtered.length) {
            container.innerHTML = `
                <div class="patrol-empty">
                    <div class="patrol-empty-icon">
                        <i class="fa-solid fa-car-side"></i>
                    </div>
                    <div class="patrol-empty-title">Keine Streifen gefunden</div>
                    <div class="patrol-empty-text">
                        Aktuell ist keine aktive Streifeneinheit eingetragen.
                    </div>
                </div>
            `;
            return;
        }

        const groups = Object.create(null);

        filtered.forEach(function (patrol) {
            const leadMember = (patrol.members || []).find(function (member) {
                return String(member.position || "").toLowerCase() === "lead";
            }) || (patrol.members || [])[0];
            const callsign = String(
                patrol.callsign || leadMember?.callSign || "Unbekannt"
            ).trim() || "Unbekannt";
            const status = String(
                patrol.tenCode || patrol.ten_code || patrol.status || "Unbekannt"
            ).trim() || "Unbekannt";
            const group = state.patrolFilters.group === "callsign" ? callsign : status;

            if (!groups[group]) groups[group] = [];
            groups[group].push(patrol);
        });

        container.innerHTML = "";

        Object.keys(groups)
            .sort((a,b)=>a.localeCompare(b,"de",{numeric:true}))
            .forEach(function (groupName) {
                const group = document.createElement("div");
                group.className = "dispatch-group";

                group.innerHTML = `
                    <div class="dispatch-group-title">
                        ${escapeHtml(groupName)}
                        <span class="dispatch-group-count">
                            ${groups[groupName].length}
                        </span>
                    </div>
                `;

                groups[groupName].sort((a,b)=>String(a.callsign||"").localeCompare(String(b.callsign||""),"de",{numeric:true})).forEach(function (patrol) {
                    group.appendChild(createPatrolCard(patrol));
                });

                container.appendChild(group);
            });
    }

    function abbreviateRank(rank) {
        const value = String(rank || "").trim();
        if (!value) return "—";
        const words = value.split(/\s+/).filter(Boolean);
        return words.length > 1 ? words.map(function (word) { return word[0].toUpperCase(); }).join("") : value;
    }

    function shortAgentName(name) {
        const value = String(name || "Unbekannt").trim();
        const parts = value.split(/\s+/).filter(Boolean);
        if (parts.length < 2) return value;
        return parts[0].charAt(0).toUpperCase() + ". " + parts.slice(1).join(" ");
    }

    function canManagePatrol(patrol) {
        return canEdit() || (patrol?.members||[]).some(m=>String(m.id||m.user_id||"")===getLoggedInUserId() && String(m.position||"").toLowerCase()==="lead");
    }
    function createPatrolCard(patrol) {
        const card=document.createElement("article");
        card.className="dispatch-row";
        const members=Array.isArray(patrol.members)?patrol.members:[];
        const statusValue=String(patrol.tenCode||patrol.ten_code||patrol.status||"—");
        const patrolActivity=String(patrol.activity||"—");
        const call=String(patrol.callsign||"—");
        const split=call.match(/^(.*?)[-\s]+(\d+[A-Z]?)$/i);
        const currentUserId=getLoggedInUserId();
        const alreadyMember=members.some(m=>String(m.id||m.user_id||"")===currentUserId);
        const busy=state.patrolData.some(p=>(p.members||[]).some(m=>String(m.id||m.user_id||"")===currentUserId));
        const crew=members.slice().sort((a,b)=>Number(String(b.position).toLowerCase()==="lead")-Number(String(a.position).toLowerCase()==="lead"));
        const membersHtml=crew.map(m=>{
            const lead=String(m.position).toLowerCase()==="lead";
            const fullName=String(m.name||"Unbekannt");
            return `<span class="dispatch-person${lead?' is-lead':''}" title="${escapeHtml(fullName+(m.callSign?' · '+m.callSign:''))}${lead?' · Streifenführer':''}"><span class="dispatch-rank">${escapeHtml(m.rankShortName||m.rank||"—")}</span><span class="dispatch-name">${escapeHtml(shortAgentName(fullName))}</span>${lead?'<span class="dispatch-lead" aria-label="Streifenführer" title="Streifenführer">SF</span>':''}</span>`;
        }).join("")||'<span class="dispatch-no-crew">Keine Besatzung</span>';
        const disabled=alreadyMember||busy;
        card.innerHTML=`
            <div class="dispatch-call" title="Funkrufname: ${escapeHtml(call)}"><span class="dispatch-prefix">${escapeHtml(split?split[1]:call)}</span>${split?`<span class="dispatch-number">${escapeHtml(split[2])}</span>`:''}</div>
            <span class="dispatch-segment lspd-row-ten" title="Ten Code: ${escapeHtml(statusValue)}">${escapeHtml(statusValue)}</span>
            <span class="dispatch-segment dispatch-location" title="Einsatzort: ${escapeHtml(patrol.location||'—')}">${escapeHtml(patrol.location||'—')}</span>
            <span class="dispatch-segment lspd-row-activity" title="Status: ${escapeHtml(patrolActivity)}">${escapeHtml(patrolActivity)}</span>
            <span class="dispatch-segment dispatch-vehicle" title="Fahrzeug: ${escapeHtml(patrol.vehicleType||patrol.vehicle_type||'—')}">${escapeHtml(patrol.vehicleType||patrol.vehicle_type||'—')}</span>
            <div class="dispatch-crew" tabindex="0" aria-label="Besatzung">${membersHtml}</div>
            <div class="dispatch-actions">${canManagePatrol(patrol)?`<button class="dispatch-button lspd-row-edit" type="button" title="Streife bearbeiten" aria-label="Streife bearbeiten" data-patrol-action="${escapeHtml(patrol.id)}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg></button>`:''}<button type="button" class="dispatch-button lspd-row-join" data-patrol-join="${escapeHtml(patrol.id)}" title="${alreadyMember?'Bereits Mitglied':busy?'Beende zuerst deinen aktuellen Dienst':'Dieser Streife beitreten'}" ${disabled?'disabled':''}>${alreadyMember?'Dabei':'Beitreten'}</button></div>`;

        const config=window.__FIB_PATROL_DUTY_CONFIG__||{};
        const validColor=value=>typeof value==="string"&&/^(#[0-9a-f]{3,8}|rgba?\([0-9\s.,%+-]+\)|hsla?\([0-9\s.,%+-]+\))$/i.test(value.trim());
        const codeColor=config.tenCodeColors?.[statusValue];
        if(validColor(codeColor))card.querySelector('.lspd-row-ten').style.setProperty('--duty-accent',codeColor);
        const activityColor=config.statusColors?.[patrolActivity];
        if(validColor(activityColor))card.querySelector('.lspd-row-activity').style.setProperty('--duty-accent',activityColor);
        const joinButton = card.querySelector("[data-patrol-join]");
        if (joinButton && !alreadyMember) {
            joinButton.addEventListener("click", function (event) {
                event.stopPropagation();
                joinButton.disabled = true;
                CloudApi.run.withSuccessHandler(function () {
                    clearPatrolsCache();
                    showSuccess("Du bist der Streife beigetreten.");
                }).withFailureHandler(function (error) {
                    joinButton.disabled = false;
                    showError(error?.message || String(error));
                }).joinPatrol(getToken(), patrol.id);
            });
        }

        const action = card.querySelector("[data-patrol-action]");
        if (action) {
            action.addEventListener("click", function (event) {
                event.stopPropagation();
                openPatrolModal(patrol);
            });
        }

        return card;
    }

    function buildPatrolForm(patrol) {
        const editing = !!patrol;

        return `
            <div class="patrol-form-grid">
                <div class="patrol-field">
                    <label>Automatisches Streifen-Callsign</label>
                    <input
                        id="patrolModalCallsign"
                        type="text"
                        maxlength="80"
                        autocomplete="off"
                        placeholder="Wird aus der Personalakte übernommen"
                        readonly
                    >
                </div>

                <div class="patrol-field">
                    <label>Dienstnummer (automatisch)</label>
                    <input
                        id="patrolModalNumber"
                        type="text"
                        maxlength="6"
                        placeholder="Automatisch" readonly
                    >
                </div>

                <div class="patrol-field">
                    <label>Fahrzeugtyp</label>
                    <select id="patrolModalVehicle">
                        ${VEHICLES.map(function (value) {
                            return `
                                <option value="${escapeHtml(value)}">
                                    ${escapeHtml(value)}
                                </option>
                            `;
                        }).join("")}
                    </select>
                </div>

                <div class="patrol-field">
                    <label>Ten Code</label>
                    <select id="patrolModalStatus">
                        ${STATUSES.map(function (value) {
                            return `
                                <option value="${escapeHtml(value)}">
                                    ${escapeHtml(value)}
                                </option>
                            `;
                        }).join("")}
                    </select>
                </div>

                <div class="patrol-field"><label>Einsatzort</label><select id="patrolModalLocation">${[...new Set([...(window.__FIB_PATROL_DUTY_CONFIG__?.locations||[]),patrol?.location].filter(Boolean))].map(v=>`<option value="${escapeHtml(v)}" ${v===patrol?.location?'selected':''}>${escapeHtml(v)}</option>`).join("")}</select></div>
                <div class="patrol-field"><label>Status / Tätigkeit</label><select id="patrolModalActivity">${[...new Set([...(window.__FIB_PATROL_DUTY_CONFIG__?.activities||[]),patrol?.activity].filter(Boolean))].map(v=>`<option value="${escapeHtml(v)}" ${v===patrol?.activity?'selected':''}>${escapeHtml(v)}</option>`).join("")}</select></div>
                <div class="patrol-field full">
                    <div class="patrol-members-box">
                        <div class="patrol-members-header">
                            <span>Besatzung</span>
                            <select class="patrol-partner-select" id="patrolPartnerSelect" aria-label="Streifenpartner auswählen">
                                <option value="">Streifenpartner auswählen …</option>
                            </select>
                        </div>

                        <div id="patrolSelectedMembers"></div>
                    </div>

                    <div class="patrol-member-picker" id="patrolMemberPicker" style="display:none;">
                        <input class="patrol-member-search" id="patrolMemberSearch" placeholder="Beamten suchen..." type="text" autocomplete="off">
                        <div id="patrolMemberOptions"></div>
                    </div>
                </div>

                <div class="patrol-field full">
                    <div id="patrolModalError" class="patrol-modal-error" style="display:none;"></div>
                </div>
            </div>
        `;
    }

    async function openPatrolModal(patrol) {
        await loadConfiguredTenCodes();
        if(!active)return;
        await fetchPatrolUsers(true).catch(()=>{});
        if(!active)return;
        const editing = !!patrol;
        const editable = editing ? canManagePatrol(patrol) : canCreate();

        if (!editable) {
            showError(
                editing
                    ? "Du besitzt keine Berechtigung zum Bearbeiten von Streifen."
                    : "Du besitzt keine Berechtigung zum Erstellen von Streifen."
            );
            return;
        }

        if (
            !window.FIB_MDT_MODAL ||
            typeof FIB_MDT_MODAL.open !== "function"
        ) {
            showError("Das globale Modal ist nicht verfügbar.");
            return;
        }

        let selectedMembers = (
            editing && Array.isArray(patrol.members)
                ? patrol.members
                : []
        ).map(function (member) {
            return {
                id: member.id,
                name: member.name,
                username: member.username || "",
                rank: member.rank || "Kein Rang",
                serviceNumber: member.serviceNumber || "",
                callSign: member.callSign || "",
                position: member.position === "Lead" ? "Lead" : "Member"
            };
        });

        FIB_MDT_MODAL.open({
            title: editing ? "Streife bearbeiten" : "Neue Streife",
            subtitle: "Streifeneinheit in der Leitstelle",
            body: buildPatrolForm(patrol),
            saveVisible: true,
            saveText: editing ? "Änderungen speichern" : "In Dienst gehen",
            cancelText: "Abbrechen",
            modalClass: "agents",
            onSave: function () {
                savePatrol(patrol, selectedMembers);
            }
        });

        const callsign =
            document.getElementById("patrolModalCallsign");
        const number =
            document.getElementById("patrolModalNumber");
        const vehicle =
            document.getElementById("patrolModalVehicle");
        const status =
            document.getElementById("patrolModalStatus");
        const picker = document.getElementById("patrolMemberPicker");
        const search = document.getElementById("patrolMemberSearch");
        const partnerSelect = document.getElementById("patrolPartnerSelect");

        if (editing && patrol) {
            callsign.value = patrol.callsign || "";
            number.value = (String(patrol.callsign||"").match(/[-\s]+(\d+[A-Z]?)$/i)||[])[1] || patrol.number || "";
            const currentVehicle=patrol.vehicleType||patrol.vehicle_type||VEHICLES[0];
            const currentCode=patrol.tenCode||patrol.ten_code||patrol.status||STATUSES[0];
            if(!VEHICLES.includes(currentVehicle))vehicle.add(new Option(currentVehicle,currentVehicle));
            if(!STATUSES.includes(currentCode))status.add(new Option(currentCode,currentCode));
            vehicle.value=currentVehicle; status.value=currentCode;
        } else {
            callsign.value = String(state.ownPersonnelProfile?.callSign || "").trim();
            vehicle.value = VEHICLES[0];
            status.value = STATUSES[0];
        }

        function modalError(message) {
            const element = document.getElementById("patrolModalError");
            if (!element) return;
            element.style.display = "block";
            element.textContent = String(message || "");
        }

        function clearModalError() {
            const element = document.getElementById("patrolModalError");
            if (!element) return;
            element.style.display = "none";
            element.textContent = "";
        }

        function refreshCallsignPreview(){
            const numbers=selectedMembers.map(m=>String(m.serviceNumber||((String(m.callSign||"").match(/[-\s]+(\d+[A-Z]?)$/i)||[])[1]||""))).filter(n=>/^\d+[A-Z]?$/i.test(n)).sort((a,b)=>parseInt(a,10)-parseInt(b,10)||a.localeCompare(b,"de",{numeric:true}));
            const generated=selectedMembers.length===1?String(selectedMembers[0].callSign||""):selectedMembers.length>1&&numbers.length?`Adam-${numbers[0]}`:"";
            callsign.value=generated;
            number.value=selectedMembers.length===1?((generated.match(/[-\s]+(\d+[A-Z]?)$/i)||[])[1]||numbers[0]||""):(numbers[0]||"");
        }
        function renderSelectedMembers() {
            refreshCallsignPreview();
            const container =
                document.getElementById("patrolSelectedMembers");
            if (!container) return;

            if (!selectedMembers.length) {
                container.innerHTML = `
                    <div class="patrol-modal-empty">
                        Noch keine Beamten zugewiesen.
                    </div>
                `;
                return;
            }

            container.innerHTML = selectedMembers
                .map(function (member, index) {
                    return `
                        <div class="patrol-selected-member">
                            <div class="patrol-selected-information">
                                <div class="patrol-selected-rank">
                                    ${escapeHtml(member.rankShortName || member.rank || "Kein Rang")}
                                </div>
                                <div class="patrol-selected-name">
                                    ${escapeHtml(member.name || "Unbekannt")}
                                </div>
                            </div>

                            <div style="display:flex;align-items:center;gap:7px;flex:0 0 auto;">
                                <select
                                    class="patrol-member-position"
                                    data-member-position="${index}"
                                >
                                    <option
                                        value="Member"
                                        ${member.position !== "Lead" ? "selected" : ""}
                                    >
                                        Mitglied
                                    </option>
                                    <option
                                        value="Lead"
                                        ${member.position === "Lead" ? "selected" : ""}
                                    >
                                        Streifenführer
                                    </option>
                                </select>

                                <button
                                    class="patrol-remove-member"
                                    data-remove-member="${index}"
                                    type="button"
                                    title="Beamten entfernen"
                                    aria-label="Streifenpartner entfernen"
                                >
                                    ×
                                </button>
                            </div>
                        </div>
                    `;
                })
                .join("");

            container
                .querySelectorAll("[data-remove-member]")
                .forEach(function (button) {
                    button.addEventListener("click", function () {
                        const index =
                            Number(button.dataset.removeMember);

                        selectedMembers.splice(index, 1);
                        renderSelectedMembers();
                        renderMemberOptions();
                    });
                });

            container
                .querySelectorAll("[data-member-position]")
                .forEach(function (select) {
                    select.addEventListener("change", function () {
                        const index =
                            Number(select.dataset.memberPosition);

                        if (selectedMembers[index]) {
                            if(select.value==="Lead")selectedMembers.forEach((m,i)=>m.position=i===index?"Lead":"Member");
                            else selectedMembers[index].position="Member";
                            clearModalError();
                            renderSelectedMembers();
                        }
                    });
                });
        }

        function renderMemberOptions() {
            if (!partnerSelect) return;
            if (!state.patrolUsersLoaded) {
                partnerSelect.innerHTML = `<option value="">Beamte werden geladen …</option>`;
                partnerSelect.disabled = true;
                return;
            }
            partnerSelect.disabled = false;
            const selectedIds = selectedMembers.map(function(member){ return String(member.id); });
            const available = state.patrolUsers.filter(function(user){
                return !selectedIds.includes(String(user.id));
            }).sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||""), "de"); });
            partnerSelect.innerHTML = `<option value="">Streifenpartner auswählen …</option>` + available.map(function(user){
                const rank = user.rank ? ` · ${escapeHtml(user.rank)}` : "";
                return `<option value="${escapeHtml(user.id)}">${escapeHtml(user.name || "Unbekannt")}${rank}</option>`;
            }).join("");
        }

        renderSelectedMembers();
        renderMemberOptions();

        if (partnerSelect && !partnerSelect.dataset.bound) {
            partnerSelect.dataset.bound = "true";
            partnerSelect.addEventListener("change", function () {
                const user = state.patrolUsers.find(function(item){ return String(item.id) === String(partnerSelect.value); });
                if (!user) return;
                if (selectedMembers.some(function(item){ return String(item.id) === String(user.id); })) { partnerSelect.value = ""; return; }
                selectedMembers.push({
                    id:user.id, name:user.name, username:user.username||"", rank:user.rank||"Kein Rang", callSign:user.callSign||"", serviceNumber:user.serviceNumber||"", position:selectedMembers.length===0?"Lead":"Member"
                });
                partnerSelect.value = "";
                clearModalError();
                renderSelectedMembers();
                renderMemberOptions();
            });
        }

        /*
         * Die Benutzerliste kann parallel zum Modal geöffnet werden.
         * Sobald sie ankommt, wird der Picker automatisch aktualisiert.
         */
        fetchPatrolUsers(false)
            .then(function () {
                renderMemberOptions();
            })
            .catch(function (error) {});

        if (editing && canDelete()) {
            FIB_MDT_MODAL.setFooterButtons([
                {
                    label: "Streife entfernen",
                    className: "danger",
                    onClick: function () {
                        deletePatrol(patrol);
                    }
                }
            ], { keepSave: true });
        }

        clearModalError();

        return true;
    }

    function setModalBusy(busy, label) {
        const save = FIB_MDT_MODAL?.getSaveButton?.();
        const cancel = FIB_MDT_MODAL?.getCancelButton?.();

        if (save) {
            save.disabled = !!busy;
            save.textContent =
                label ||
                save.textContent ||
                "Speichern";
        }

        // Keep Cancel available even while saving. The save action alone is locked
        // to prevent duplicate submissions; users must never be trapped in a modal.
        if (cancel) {
            cancel.disabled = false;
            cancel.removeAttribute("disabled");
        }
    }

    function readPatrolModalData(selectedMembers, patrol) {
        const callsign =
            document.getElementById("patrolModalCallsign");
        const number =
            document.getElementById("patrolModalNumber");
        const vehicle =
            document.getElementById("patrolModalVehicle");
        const status =
            document.getElementById("patrolModalStatus");

        return {
            id: patrol ? patrol.id : null,
            updatedAt: patrol?.updated_at || null,
            callsign: callsign?.value?.trim() || "",
            number: number?.value?.trim() || "",
            vehicleType: vehicle?.value || "",
            status: status?.value || "",
            tenCode: status?.value || "",
            location: document.getElementById("patrolModalLocation")?.value || patrol?.location || "",
            activity: document.getElementById("patrolModalActivity")?.value || patrol?.activity || "",
            members: selectedMembers.map(function (member) {
                return {
                    id: member.id,
                    position: member.position === "Lead"
                        ? "Lead"
                        : "Member"
                };
            })
        };
    }

    function savePatrol(patrol, selectedMembers) {
        const editing = !!patrol;
        const form = readPatrolModalData(selectedMembers, patrol);

        if (!selectedMembers.length) { showError("Mindestens ein Mitglied muss verbleiben."); return; }
        if (!form.vehicleType || (!VEHICLES.includes(form.vehicleType)&&form.vehicleType!==String(patrol?.vehicleType||patrol?.vehicle_type||""))) {
            showError("Bitte einen gültigen Fahrzeugtyp auswählen.");
            return;
        }

        if (!form.status || (!STATUSES.includes(form.status)&&form.status!==String(patrol?.tenCode||patrol?.ten_code||patrol?.status||""))) {
            showError("Bitte einen gültigen Status auswählen.");
            return;
        }

        const leads = selectedMembers.filter(function (member) {
            return member.position === "Lead";
        });

        if (leads.length > 1) {
            showError("Eine Streife kann nur einen Streifenführer haben.");
            return;
        }

        setModalBusy(
            true,
            editing ? "Speichern..." : "Erstellen..."
        );

        const method = editing ? "updatePatrol" : "createPatrol";

        CloudApi.run
            .withSuccessHandler(function (result) {
                if(!result||result.success!==true){setModalBusy(false,"Änderungen speichern");showError(result?.message||"Speichern fehlgeschlagen.");return;}
                FIB_MDT_MODAL.close();
                showSuccess(editing?"Die Streife wurde aktualisiert.":"Die Streife wurde erstellt.");
            })
            .withFailureHandler(function (error) {
                setModalBusy(
                    false,
                    editing ? "Änderungen speichern" : "In Dienst gehen"
                );

                showError(
                    error && error.message
                        ? error.message
                        : "Die Streife konnte nicht gespeichert werden."
                );
            })
            [method](getToken(), form);
    }

    async function deletePatrol(patrol) {
        if (!canDelete()) {
            showError("Du besitzt keine Berechtigung zum Entfernen von Streifen.");
            return;
        }

        const confirmed = await FIB_MDT_MODAL.confirm({
            title: "Streife entfernen",
            subtitle: "Diese Aktion kann nicht rückgängig gemacht werden.",
            message: "Möchtest du diese Streife wirklich entfernen?",
            confirmText: "Streife entfernen",
            cancelText: "Abbrechen",
            danger: true
        });
        if (!confirmed) return;

        CloudApi.run
            .withSuccessHandler(function () {
                state.patrolData = state.patrolData.filter(function (item) {
                    return String(item.id) !== String(patrol.id);
                });

                window.fibCache.patrols.data = state.patrolData;
                window.fibCache.patrols.timestamp = Date.now();
                state.patrolDataLoaded = true;

                renderPatrols();

                showSuccess("Die Streife wurde entfernt.");
            })
            .withFailureHandler(function (error) {
                showError(
                    error && error.message
                        ? error.message
                        : "Die Streife konnte nicht entfernt werden."
                );
            })
            .deletePatrol(getToken(), patrol.id);
    }

    function bindStaticEvents() {
        const refreshButton =
            document.getElementById("patrolRefreshButton");

        if (refreshButton && !refreshButton.dataset.bound) {
            refreshButton.dataset.bound = "true";
            refreshButton.addEventListener("click", ()=>{refreshPatrolData().catch(()=>{});window.FIBDuty?.refresh();});
        }

        document
            .querySelectorAll(".patrol-group-button")
            .forEach(function (button) {
                if (button.dataset.bound) return;

                button.dataset.bound = "true";
                button.addEventListener("click", function () {
                    state.patrolFilters.group =
                        button.dataset.group || "status";

                    document
                        .querySelectorAll(".patrol-group-button")
                        .forEach(function (item) {
                            item.classList.remove("active");
                        });

                    button.classList.add("active");
                    renderPatrols();
                });
            });
    }

    function applyPermissionUI() {
        const description =
            document.getElementById("patrolPermissionHint");

        if (description) {
            if (isMasterAccount()) {
                description.textContent = "Masterzugriff";
            } else if (canEdit() || canDelete()) {
                description.textContent = "Verwaltung freigeschaltet";
            } else {
                description.textContent = "Nur Lesezugriff";
            }
        }
    }

    function initializePatrols() {
        state.instanceId =
            String(Date.now()) +
            "_" +
            Math.random().toString(36).slice(2);

        state.mounted = true;

        if (!hasPatrolPermission(PATROL_PERMISSIONS.view)) {
            applyPermissionUI();
            renderAccessDenied();
            state.initialized = true;
            return;
        }

        applyPermissionUI();
        loadConfiguredTenCodes().then(()=>{if(active&&state.patrolDataLoaded)renderPatrols();});
        bindStaticEvents();
        // First load starts with a revision snapshot, then loads the list. A change
        // during the fetch remains detectable by the next revision check.
        poll(true);
        

        state.initialized = true;
    }

    window.initializePatrols = initializePatrols;
    let lastRevision=null, polling=false;
    async function poll(force=false){
        if(!active||polling||!hasPatrolPermission(PATROL_PERMISSIONS.view)||!document.getElementById("patrolsList"))return;
        if(!force&&document.visibilityState!=="visible")return;
        polling=true;
        try{
            const snapshot=await window.runServer("getPatrolRevision",getToken());
            if(!active)return;
            if(!snapshot||typeof snapshot.revision!=="string")throw new Error("Ungültige Leitstellen-Revision");
            if(force||lastRevision!==snapshot.revision){
                // If a write happened while a fetch was active, wait for that fetch
                // and perform a fresh read rather than marking stale data current.
                if(state.patrolDataPromise)await state.patrolDataPromise;
                if(!active)return;
                await fetchPatrols(true);
                lastRevision=snapshot.revision;
            }
        }catch(error){
            console.warn("Leitstellen-Synchronisation:",error);
            if(!state.patrolDataLoaded&&active)fetchPatrols(true).catch(()=>{});
        }finally{polling=false;}
    }
    window.__fibPageLifecycle.interval(()=>poll(),5000);
    window.__fibPageLifecycle.on(document,"visibilitychange",()=>{if(document.visibilityState==="visible")poll(true);});
    window.__fibPageLifecycle.on(window,"fib-mdt:data-changed",event=>{
        if(!active||!hasPatrolPermission(PATROL_PERMISSIONS.view))return;
        if(/^(startDuty|updateOwnDuty|leavePatrol|joinPatrol|deletePatrol|updatePatrol|createPatrol|setPatrolTenCode)$/.test(event.detail?.method||"")){
            clearPatrolsCache();fetchPatrols(true).catch(()=>{});
        }
    });

})();
</script>
