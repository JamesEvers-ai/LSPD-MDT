<style>
/* =========================================================
   LSPD MDT – LEITSTELLE
========================================================= */

.patrols-page {
    width: 100%;
    min-height: 100%;
    box-sizing: border-box;
    padding: 18px 22px 90px;
}


/* =========================================================
   HEADER
========================================================= */

.patrols-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 17px;
}

.patrols-header-left {
    min-width: 0;
}

.patrols-eyebrow {
    margin-bottom: 5px;
    color: #83b8eb;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.patrols-title {
    margin: 0;
    color: #f4f7fb;
    font-size: 25px;
    font-weight: 700;
    line-height: 1.2;
}

.patrols-subtitle {
    margin-top: 6px;
    color: #8f9bad;
    font-size: 13px;
    line-height: 1.45;
}

.patrols-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}


/* =========================================================
   BUTTONS
========================================================= */

.patrol-header-button {
    height: 38px;
    padding: 0 13px;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    border: 1px solid #286aa9;
    border-radius: 8px;

    background: #1c4f82;
    color: #ffffff;

    font-family: inherit;
    font-size: 11px;
    font-weight: 650;

    cursor: pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .15s ease,
        opacity .15s ease;
}

.patrol-header-button:hover {
    background: #23629f;
    border-color: #347dbd;
    transform: translateY(-1px);
}

.patrol-header-button:disabled {
    opacity: .7;
    cursor: not-allowed;
    transform: none;
}

.patrol-header-button.secondary {
    background: #11161d;
    border-color: rgba(255,255,255,.08);
    color: #dce3ec;
}

.patrol-header-button.secondary:hover {
    background: #151b23;
    border-color: rgba(255,255,255,.13);
}

.patrol-refresh-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

.patrol-header-button.is-loading .patrol-refresh-icon {
    animation: patrolSpin .75s linear infinite;
}

@keyframes patrolSpin {
    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   EIGENER STATUS – modulare Leitstellenübersicht
========================================================= */
.patrol-own-status {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(180px, .8fr) minmax(150px, .6fr);
    align-items: center;
    gap: 16px;
    margin: 0 0 16px;
    padding: 15px 17px;
    background: linear-gradient(120deg, rgba(27, 54, 80, .72), rgba(17, 24, 34, .96));
    border: 1px solid rgba(92, 151, 204, .24);
    border-radius: 12px;
    box-shadow: 0 8px 22px rgba(0, 0, 0, .12);
}
.patrol-own-status-heading { color: #8fbce6; font-size: 10px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 5px; }
.patrol-own-status-name { color: #f2f6fb; font-size: 15px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.patrol-own-status-caption { color: #8797aa; font-size: 11px; margin-top: 4px; line-height: 1.4; }
.patrol-own-status-cell { min-width: 0; padding-left: 15px; border-left: 1px solid rgba(255,255,255,.08); }
.patrol-own-status-label { color: #8293a8; font-size: 9px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 5px; }
.patrol-own-status-value { color: #dce8f5; font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
.patrol-own-status-value.is-idle { color: #9aa6b5; font-weight: 550; }
@media (max-width: 760px) {
    .patrol-own-status { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .patrol-own-status-main { grid-column: 1 / -1; }
    .patrol-own-status-cell { padding-left: 0; border-left: 0; }
}

/* =========================================================
   FILTER / TOOLBAR
========================================================= */

.patrol-toolbar {
    background: #11161d;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
}

.patrol-toolbar-section {
    padding: 13px 15px;
}

.patrol-toolbar-section + .patrol-toolbar-section {
    border-top: 1px solid rgba(255,255,255,.06);
}

.patrol-toolbar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 9px;
}

.patrol-toolbar-label {
    color: #dce3ec;
    font-size: 11px;
    font-weight: 700;
}

.patrol-toolbar-description {
    margin-top: 3px;
    color: #687588;
    font-size: 9px;
}

.patrol-toolbar-meta {
    color: #596577;
    font-size: 10px;
    white-space: nowrap;
}

.patrol-filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}

.patrol-filter {
    height: 29px;
    padding: 0 9px;

    border: 1px solid rgba(255,255,255,.065);
    border-radius: 7px;

    background: rgba(255,255,255,.025);
    color: #8f9bad;

    font-family: inherit;
    font-size: 9px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .14s ease,
        border-color .14s ease,
        color .14s ease;
}

.patrol-filter:hover {
    background: rgba(255,255,255,.045);
    border-color: rgba(255,255,255,.10);
    color: #dce3ec;
}

.patrol-filter.active {
    background: rgba(58,132,204,.14);
    border-color: rgba(58,132,204,.35);
    color: #9fc8ec;
}


/* =========================================================
   GROUP CONTROLS
========================================================= */

.patrol-group-controls {
    display: inline-flex;
    align-items: center;
    gap: 4px;

    padding: 3px;

    border: 1px solid rgba(255,255,255,.055);
    border-radius: 7px;

    background: #0d1117;
}

.patrol-group-button {
    height: 26px;
    padding: 0 9px;

    border: none;
    border-radius: 5px;

    background: transparent;
    color: #687588;

    font-family: inherit;
    font-size: 9px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .14s ease,
        color .14s ease;
}

.patrol-group-button:hover {
    color: #dce3ec;
}

.patrol-group-button.active {
    background: rgba(58,132,204,.14);
    color: #9fc8ec;
}


/* =========================================================
   CONTENT
========================================================= */

.patrols-content {
    min-height: 120px;
}


/* =========================================================
   LOADING
========================================================= */

.patrol-loading-state {
    min-height: 185px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 11px;

    background: #11161d;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;
}

.patrol-loading-spinner {
    width: 22px;
    height: 22px;

    border: 2px solid rgba(255,255,255,.10);
    border-top-color: #347dbd;
    border-right-color: #83b8eb;
    border-radius: 50%;

    animation: patrolSpin .75s linear infinite;
}

.patrol-loading-text {
    color: #8f9bad;
    font-size: 11px;
}

.patrol-loading-subtext {
    color: #596577;
    font-size: 9px;
}


/* =========================================================
   GROUP
========================================================= */

.patrol-group {
    margin-bottom: 8px;
}

.patrol-group:last-child {
    margin-bottom: 0;
}

.patrol-group-title {
    display: flex;
    align-items: center;
    gap: 8px;

    margin-bottom: 4px;

    color: #8f9bad;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .045em;
}

.patrol-group-count {
    min-width: 19px;
    height: 19px;
    padding: 0 5px;

    box-sizing: border-box;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    border-radius: 999px;

    background: rgba(58,132,204,.12);
    color: #83b8eb;

    font-size: 8px;
    font-weight: 700;
}


/* =========================================================
   PATROL CARD
========================================================= */

.patrol-join-button { font-size: 22px !important; font-weight: 700; color: #8ec5ff !important; border: 1px solid rgba(96,165,250,.32) !important; border-radius: 9px !important; background: rgba(37,99,235,.12) !important; min-width: 36px; min-height: 36px; cursor: pointer; }
.patrol-join-button:hover { background: rgba(37,99,235,.28) !important; }

}

.patrol-card:hover {
    background: #121820;

}

.patrol-card:last-child {
    margin-bottom: 0;
}


/* Phase 3.33 roster layout: larger rounded chips, source fields preserved */
.patrol-card { gap: 7px; min-height: 44px; margin-bottom: 6px; padding: 6px 8px; border-radius: 11px; background: #202b3b; border: 1px solid rgba(148,163,184,.22); box-shadow: 0 2px 7px rgba(0,0,0,.12); }
.patrol-card:hover { background: #26364a; border-color: rgba(56,189,248,.35); transform: translateY(-1px); }
.patrol-callsign-type, .patrol-status, .patrol-location, .patrol-vehicle, .patrol-member { border-radius: 8px; }

.patrol-members { gap: 6px; }
.patrol-member { max-width: 260px; padding: 5px 8px; }
.patrol-action-button { flex: 0 0 32px; width: 32px; height: 32px; min-height: 32px; border-radius: 9px; }
.patrol-join-button { min-width: 32px !important; min-height: 32px !important; font-size: 20px !important; }

.patrol-ten-code-top { display:flex; align-items:center; gap:7px; color:#9fb3ca; font-size:11px; font-weight:700; } .patrol-ten-code-top select { min-height:34px; max-width:130px; padding:6px 9px; color:#e5edf7; background:#172536; border:1px solid rgba(148,163,184,.3); border-radius:8px; }

/* =========================================================
   CALLSIGN
========================================================= */

.patrol-callsign {
    min-width: 0;
    flex: 0 0 auto;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 0;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.18);
}

.patrol-callsign-type {
    display: inline-flex;
    align-items: center;
    min-width: 0;
    max-width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 0;
    background: #dceafa;
    color: #245581;
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.patrol-callsign-number {
    display: inline-flex;
    align-items: center;
    flex: 0 0 auto;
    margin: 0;
    padding: 6px 10px;
    border: 0;
    border-left: 1px solid rgba(255,255,255,.12);
    border-radius: 0;
    background: #286eae;
    color: #ffffff;
    font-size: 12px;
    font-weight: 800;
}


/* =========================================================
   STATUS
========================================================= */

.patrol-status {
    display: inline-flex;
    align-items: center;

    width: max-content;
    max-width: 100%;

    min-height: 30px;
    padding: 0 10px;

    box-sizing: border-box;

    border-radius: 999px;

    background: rgba(148,163,184,.13);
    color: #e2e8f0;
    border: 1px solid rgba(148,163,184,.16);

    font-size: 12px;
    font-weight: 700;

    white-space: nowrap;
}

.patrol-status.status-10-1 {
    background: rgba(65,165,108,.11);

}

.patrol-status.status-10-3 {
    background: rgba(207,83,83,.11);

}

.patrol-status.status-10-6 {
    background: rgba(211,169,75,.11);
    color: #ead08b;
}

.patrol-status.status-10-19,
.patrol-status.status-10-23 {
    background: rgba(84,143,202,.11);
    color: #9fc8ec;
}

.patrol-status.status-10-76 {
    background: rgba(58,132,204,.12);
    color: #83b8eb;
}


.patrol-location {

    color: #34465a;
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================================================
   VEHICLE
========================================================= */

.patrol-vehicle {
    flex: 0 0 auto;
    padding: 6px 10px;
    border-radius: 8px;
    background: #0e7490;
    border: 1px solid rgba(103,232,249,.2);
    color: #ffffff;

    font-size: 12px;
    font-weight: 600;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   MEMBERS
========================================================= */

.patrol-members {
    min-width: 0;
    flex: 1 1 auto;
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 2px;
    white-space: nowrap;
}

.patrol-member {
    min-width: 0;
    max-width: 260px;
    flex: 0 1 auto;
    display: flex;
    align-items: stretch;
    gap: 0;
    padding: 0;
    overflow: hidden;
    border-radius: 10px;
    background: rgba(148,163,184,.10);
    border: 1px solid rgba(148,163,184,.18);
}

.patrol-member-rank {
    flex-shrink: 0;
    max-width: 95px;

    border: 0;

    background: #dceafa;
    color: #245581;
    font-size: 11px;
    font-weight: 800;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.patrol-member-name {
    min-width: 0;
    padding: 5px 8px;
    border: 0;
    border-left: 1px solid rgba(255,255,255,.12);
    border-radius: 0;
    background: #f0f3f7;
    color: #34465a;
    font-size: 12px;
    font-weight: 600;

}

.patrol-member-callsign {

    font-weight: 550;
}


/* =========================================================
   CARD ACTION
========================================================= */

.patrol-action-button {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 0;

    border: 1px solid rgba(255,255,255,.055);
    border-radius: 7px;

    background: rgba(255,255,255,.025);
    color: #687588;

    font-family: inherit;
    font-size: 17px;

    transition:
        background .14s ease,
        border-color .14s ease,
        color .14s ease;
}

.patrol-action-button:hover {
    background: rgba(58,132,204,.13);
    border-color: rgba(40,106,169,.40);
    color: #83b8eb;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.patrol-empty {
    min-height: 185px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 25px 20px;

    box-sizing: border-box;

    background: #11161d;
    border: 1px solid rgba(255,255,255,.07);
    border-radius: 10px;

    text-align: center;
}

.patrol-empty-icon {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 10px;

    border-radius: 9px;

    background: rgba(28,79,130,.16);
    border: 1px solid rgba(40,106,169,.38);

    color: #83b8eb;

    font-size: 17px;
}

.patrol-empty-title {
    color: #eef3f8;
    font-size: 12px;
    font-weight: 700;
}

.patrol-empty-text {
    max-width: 420px;

    margin-top: 5px;

    color: #687588;
    font-size: 10px;
    line-height: 1.45;
}




/* =========================================================
   ERROR TOAST
========================================================= */

#patrolError {
    position: fixed;

    left: 50%;
    bottom: 24px;

    z-index: 20000;

    transform:
        translateX(-50%);

    max-width:
        min(500px, calc(100vw - 30px));

    padding:
        11px
        14px;

    box-sizing:
        border-box;

    border:
        1px solid
        rgba(190,85,85,.30);

    border-radius:
        8px;

    background:
        #171114;

    color:
        #efb0b0;

    box-shadow:
        0 15px 35px
        rgba(0,0,0,.35);

    font-size:
        10px;

    line-height:
        1.45;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 1050px) {
    .patrol-card { gap: 4px; }
    .patrol-member { max-width: 220px; }
}

@media (max-width: 800px) {
    .patrols-header { flex-direction: column; }

    .patrol-status { justify-self: auto; }

    .patrol-form-grid { grid-template-columns: 1fr; }
    .patrol-field.full { grid-column: auto; }
}

        ownPersonnelProfileLoaded: false,
        ownPersonnelProfilePromise: null,
        patrolDataLoaded: false,
        patrolUsersLoaded: false,
        patrolDataPromise: null,
        patrolUsersPromise: null,
        patrolFilters: {
            group: "callsign"
        },
        initialized: false,
        instanceId: "",
        mounted: false
    };

    window.__FIB_MDT_PATROLS__ = state;
    let dutySaveQueue = Promise.resolve();

    const PATROL_PERMISSIONS = Object.freeze({
        view: "patrols.view",
        create: "patrols.create",
        edit: "patrols.edit",
        delete: "patrols.delete"
    });

    const VEHICLES = [
        "STR",
        "STR (UM)",
        "OFF",
        "OFF (UM)",
        "HSP",
        "HSP (UM)",
        "OVW"
    ];

    const DEFAULT_STATUSES = ["10-1", "10-3", "10-6", "10-23", "10-76"];
    let STATUSES = [...DEFAULT_STATUSES];
    async function loadConfiguredTenCodes() {
      try {
        const result = await window.runServer("getPatrolTenCodes");
        const values = Array.isArray(result?.codes) ? result.codes : [];
        if (values.length) STATUSES = [...new Set(values.map(v => String(typeof v === "string" ? v : (v.code || v.value || v.name || "")).trim()).filter(Boolean))];
        
      } catch (e) { console.warn("Ten-Code-Konfiguration nicht verfügbar; Standardcodes werden verwendet.", e); }
    }

    const PAGE_CACHE_MS = 30000;

    window.fibCache = window.fibCache || {};
    window.fibCache.patrols = window.fibCache.patrols || { data: null, timestamp: 0 };
    window.fibCache.patrolUsers = window.fibCache.patrolUsers || { data: null, timestamp: 0 };

    function escapeHtml(value) {
        if (typeof window.escapeDashboardHtml === "function") {
            return window.escapeDashboardHtml(value);
        }

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function getToken() {
        try {
            if (typeof sessionToken !== "undefined" && sessionToken) {
                return String(sessionToken);
            }
        } catch (error) {}

        try {
            return (
                sessionStorage.getItem("fib_mdt_session") ||
                sessionStorage.getItem("lspd_mdt_session") ||
                ""
            );
        } catch (error) {
            return "";
        }
    }

    function isMasterAccount() {
        try {
            if (typeof isMaster !== "undefined" && isMaster === true) return true;
        } catch (error) {}

        return window.isMaster === true;
    }

    function hasPatrolPermission(permission) {
        if (!permission) return true;
        if (isMasterAccount()) return true;

        try {
            if (
                typeof hasPermission === "function" &&
                hasPermission(permission)
            ) {
                return true;
            }
        } catch (error) {}

        try {
            if (
                Array.isArray(myPermissions) &&
                myPermissions.includes(permission)
            ) {
                return true;
            }
        } catch (error) {}

        return (
            Array.isArray(window.myPermissions) &&
            window.myPermissions.includes(permission)
        );
    }

    function canCreate() {
        return hasPatrolPermission(PATROL_PERMISSIONS.create);
    }

    function canEdit() {
        return hasPatrolPermission(PATROL_PERMISSIONS.edit);
    }

    function canDelete() {
        return isMasterAccount() || hasPatrolPermission(PATROL_PERMISSIONS.delete);
    }

    function currentDomInstance() {
        return (
            state.mounted &&
            state.instanceId &&
            document.getElementById("patrolsList")
        );
    }

    function systemNotify(type, title, message) {
        if (
            window.MDT &&
            MDT.notify &&
            typeof MDT.notify[type] === "function"
        ) {
            return MDT.notify[type](title, message);
        }

        return null;
    }

    function showSuccess(message) {
        return systemNotify("success", "Erfolgreich", message);
    }

    function showError(message) {
        return systemNotify(
            "error",
            "Fehler",
            message || "Die Aktion konnte nicht ausgeführt werden."
        );
    }

    function cacheValid(cache) {
        return (
            cache &&
            Array.isArray(cache.data) &&
            cache.timestamp > 0 &&
            Date.now() - cache.timestamp < PAGE_CACHE_MS
        );
    }

    function clearPatrolsCache() {
        window.fibCache.patrols.data = null;
        window.fibCache.patrols.timestamp = 0;
        state.patrolDataLoaded = false;
    }

    function clearPatrolUsersCache() {
        window.fibCache.patrolUsers.data = null;
        window.fibCache.patrolUsers.timestamp = 0;
        state.patrolUsersLoaded = false;
    }

    function getLoggedInUserId() {
        try {
            if (typeof currentUser !== "undefined" && currentUser) {
                return String(currentUser.id || currentUser.userId || currentUser.ID || "");
            }
        } catch (_) {}
        return String(window.currentUser?.id || window.currentUser?.userId || "");
    }

    function renderOwnStatus() {
        const userId = getLoggedInUserId();
        const ownPatrol = (state.patrolData || []).find(function (patrol) {
            return (patrol.members || []).some(function (member) {
                return String(member.id || member.userId || "") === userId;
            });
        });
        const profile = state.ownPersonnelProfile || {};
        const ownCallSign = String(profile.callSign || "").trim();
        const inPatrol = Boolean(ownPatrol);
        // The top-right strip is a duty overview, not a radio-code display:
        // show the selected activity as Status and the selected operational area
        // as Einsatzort. The database `status` (e.g. 10-01) and callsign/number
        // belong to the patrol record and must not be placed in these fields.
        const statusText = inPatrol
            ? String(ownPatrol.activity || "Tätigkeit nicht hinterlegt")
            : (profile.personnelStatus ? String(profile.personnelStatus) : "Nicht in Streife");
        const unitText = inPatrol
            ? String(ownPatrol.location || "Einsatzort nicht hinterlegt")
            : "Kein Einsatzort";
        if (typeof window.fibUpdateOwnStatus === "function") {
            window.fibUpdateOwnStatus({
                callSign: ownCallSign || "Kein Funkrufname hinterlegt",
                status: statusText,
                unit: unitText,
                inPatrol: inPatrol
            });
        }
    }

    function restoreOwnDutyPicker() {
      // Do not publish an off-duty state while the patrol request is still in flight.
      // Profile and patrol data load independently; the old implementation could
      // briefly overwrite a valid local/server selection with an empty state.
      if (!state.patrolDataLoaded || !Array.isArray(state.patrolData) || !state.ownPersonnelProfile) return;
      const profile = state.ownPersonnelProfile || {};
      const ownId = String(profile.userId || profile.user_id || profile.id || getLoggedInUserId() || "");
      if (!ownId) return;
      const ownPatrol = state.patrolData.find(p => (p.members || []).some(m =>
        String(m.id || m.user_id || m.userId || m.userID || "") === ownId
      ));
      if (ownPatrol) {
        window.dispatchEvent(new CustomEvent("fib-mdt:duty-state-restored", {detail: {
          inDuty: true,
          location: String(ownPatrol.location || ""),
          activity: String(ownPatrol.activity || ""),
          vehicleType: String(ownPatrol.vehicleType || ownPatrol.vehicle_type || ""),
          tenCode: String(ownPatrol.tenCode || ownPatrol.ten_code || ownPatrol.status || "10-1")
        }}));
      } else {
        window.dispatchEvent(new CustomEvent("fib-mdt:duty-state-restored", {detail: {inDuty: false}}));
      }
    }

    function fetchOwnPersonnelProfile(forceReload) {
        if (state.ownPersonnelProfileLoaded && !forceReload) {
            renderOwnStatus();
            return Promise.resolve(state.ownPersonnelProfile);
        }
        if (state.ownPersonnelProfilePromise && !forceReload) return state.ownPersonnelProfilePromise;
        state.ownPersonnelProfilePromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (profile) {
                    state.ownPersonnelProfile = profile && typeof profile === "object" ? profile : {};
                    state.ownPersonnelProfileLoaded = true;
                    state.ownPersonnelProfilePromise = null;
                    renderOwnStatus();
                    restoreOwnDutyPicker();
                    resolve(state.ownPersonnelProfile);
                })
                .withFailureHandler(function (error) {
                    state.ownPersonnelProfilePromise = null;
                    const callSignEl = document.getElementById("patrolOwnCallSign");
                    if (callSignEl) callSignEl.textContent = "Nicht verfügbar";
                    reject(error);
                })
                .getMyPersonnelProfile(getToken());
        });
        return state.ownPersonnelProfilePromise;
    }

    function updateCount() {
        const element = document.getElementById("patrolCount");
        if (!element) return;

        const count = Array.isArray(state.patrolData)
            ? state.patrolData.length
            : 0;

        element.textContent =
            count === 1 ? "1 Streife" : count + " Streifen";
    }

    function setLoading(loading) {
        const button = document.getElementById("patrolRefreshButton");
        const icon = document.getElementById("patrolRefreshIcon");

        if (button) {
            button.disabled = !!loading;
            button.classList.toggle("is-loading", !!loading);
        }

        if (icon) {
            icon.setAttribute("aria-busy", loading ? "true" : "false");
        }
    }

    function renderAccessDenied() {
        const container = document.getElementById("patrolsList");
        if (!container) return;

        container.innerHTML = `
            <div class="patrol-inline-message">
                <div>
                    <strong>Kein Zugriff auf die Leitstelle</strong>
                    Für die Leitstelle wird die Berechtigung
                    „${escapeHtml(PATROL_PERMISSIONS.view)}“ benötigt.
                </div>
            </div>
        `;
    }

    function fetchPatrols(forceReload) {
        const cache = window.fibCache.patrols;

        if (!forceReload && cacheValid(cache)) {
            state.patrolData = cache.data;
            state.patrolDataLoaded = true;
            renderPatrols();
            renderOwnStatus();
            restoreOwnDutyPicker();
            return Promise.resolve(state.patrolData);
        }

        if (state.patrolDataPromise && !forceReload) {
            return state.patrolDataPromise;
        }

        setLoading(true);

        state.patrolDataPromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (data) {
                    const normalized = Array.isArray(data) ? data : [];

                    state.patrolData = normalized;
                    state.patrolDataLoaded = true;
                    cache.data = normalized;
                    cache.timestamp = Date.now();

                    state.patrolDataPromise = null;
                    setLoading(false);
                    updateCount();
                    renderPatrols();
                    renderOwnStatus();
                    restoreOwnDutyPicker();
                    resolve(normalized);
                })
                .withFailureHandler(function (error) {
                    state.patrolDataPromise = null;
                    setLoading(false);

                    if (!state.patrolData.length) {
                        const container =
                            document.getElementById("patrolsList");

                        if (container) {
                            container.innerHTML = `
                                <div class="patrol-empty">
                                    <div class="patrol-empty-icon">
                                        <i class="fa-solid fa-triangle-exclamation"></i>
                                    </div>
                                    <div class="patrol-empty-title">
                                        Leitstelle konnte nicht geladen werden
                                    </div>
                                    <div class="patrol-empty-text">
                                        Bitte versuche es erneut.
                                    </div>
                                </div>
                            `;
                        }
                    }

                    showError(
                        error && error.message
                            ? error.message
                            : "Die Streifen konnten nicht geladen werden."
                    );

                    reject(error);
                })
                .getPatrols(getToken());
        });

        return state.patrolDataPromise;
    }

    function fetchPatrolUsers(forceReload) {
        const cache = window.fibCache.patrolUsers;

        if (!forceReload && cacheValid(cache)) {
            state.patrolUsers = cache.data;
            state.patrolUsersLoaded = true;
            return Promise.resolve(state.patrolUsers);
        }

        if (state.patrolUsersPromise && !forceReload) {
            return state.patrolUsersPromise;
        }

        state.patrolUsersPromise = new Promise(function (resolve, reject) {
            CloudApi.run
                .withSuccessHandler(function (data) {
                    const normalized = Array.isArray(data) ? data : [];

                    state.patrolUsers = normalized;
                    state.patrolUsersLoaded = true;
                    cache.data = normalized;
                    cache.timestamp = Date.now();
                    state.patrolUsersPromise = null;

                    resolve(normalized);
                })
                .withFailureHandler(function (error) {
                    state.patrolUsersPromise = null;
                    showError(
                        error && error.message
                            ? error.message
                            : "Die Beamten konnten nicht geladen werden."
                    );
                    reject(error);
                })
                .getPatrolEligibleUsers(getToken());
        });

        return state.patrolUsersPromise;
    }

    // Patrol display colors are intentionally fixed.
    // The former master-only color customization was removed so patrol rendering
    // no longer depends on a persisted color configuration or optional globals.

    function refreshPatrolData() {
        clearPatrolsCache();
        clearPatrolUsersCache();

        fetchOwnPersonnelProfile(true).catch(function () {});
        fetchPatrolUsers(true).catch(function () {});
        fetchPatrols(true).catch(function () {});
    }

    function renderPatrols() {
        const container = document.getElementById("patrolsList");
        if (!container) return;

        updateCount();

        const filtered = state.patrolData.slice();

        if (!filtered.length) {
            container.innerHTML = `
                <div class="patrol-empty">
                    <div class="patrol-empty-icon">
                        <i class="fa-solid fa-car-side"></i>
                    </div>
                    <div class="patrol-empty-title">Keine Streifen gefunden</div>
                    <div class="patrol-empty-text">
                        Aktuell ist keine aktive Streifeneinheit eingetragen.
                    </div>
                </div>
            `;
            return;
        }

        const groups = Object.create(null);

        filtered.forEach(function (patrol) {
            const leadMember = (patrol.members || []).find(function (member) {
                return String(member.position || "").toLowerCase() === "lead";
            }) || (patrol.members || [])[0];
            const callsign = String(
                leadMember?.callSign || patrol.callsign || "Unbekannt"
            ).trim() || "Unbekannt";
            const status = String(
                patrol.tenCode || patrol.ten_code || patrol.status || "Unbekannt"
            ).trim() || "Unbekannt";
            const group = state.patrolFilters.group === "callsign" ? callsign : status;

            if (!groups[group]) groups[group] = [];
            groups[group].push(patrol);
        });

        container.innerHTML = "";

        Object.keys(groups)
            .sort()
            .forEach(function (groupName) {
                const group = document.createElement("div");
                group.className = "patrol-group";

                group.innerHTML = `
                    <div class="patrol-group-title">
                        ${escapeHtml(groupName)}
                        <span class="patrol-group-count">
                            ${groups[groupName].length}
                        </span>
                    </div>
                `;

                groups[groupName].forEach(function (patrol) {
                    group.appendChild(createPatrolCard(patrol));
                });

                container.appendChild(group);
            });
    }

    function abbreviateRank(rank) {
        const value = String(rank || "").trim();
        if (!value) return "—";
        const words = value.split(/\s+/).filter(Boolean);
        return words.length > 1 ? words.map(function (word) { return word[0].toUpperCase(); }).join("") : value;
    }

    function shortAgentName(name) {
        const value = String(name || "Unbekannt").trim();
        const parts = value.split(/\s+/).filter(Boolean);
        if (parts.length < 2) return value;
        return parts[0].charAt(0).toUpperCase() + ". " + parts.slice(1).join(" ");
    }

    function createPatrolCard(patrol) {
        const card = document.createElement("article");
        card.className = "patrol-card patrol-card-compact";

        const statusValue = String(
            patrol.tenCode || patrol.ten_code || patrol.status || "Unbekannt"
        ).trim() || "Unbekannt";
        const statusClass = statusValue.toLowerCase().replace(/[^a-z0-9]+/g, "-");
        const members = Array.isArray(patrol.members) ? patrol.members : [];
        const leadMember = members.find(function (member) {
            return String(member.position || "").toLowerCase() === "lead";
        }) || members[0];

        const patrolCallsign = String(
            leadMember?.callSign || patrol.callsign || "Unbekannt"
        ).trim() || "Unbekannt";
        const patrolLocation = String(patrol.location || "").trim();
        const patrolActivity = String(patrol.activity || "").trim();
        const vehicle = String(patrol.vehicleType || patrol.vehicle_type || "—").trim() || "—";
        const currentUserId = String(state.currentUserId || window.currentUser?.id || "");
        const alreadyMember = members.some(function (member) {
            return String(member.id || member.user_id || "") === currentUserId;
        });
        const actionAllowed = canEdit() || canDelete();

        const membersHtml = members.length
            ? members.map(function (member) {
                const memberName = String(member.name || "Unbekannt").trim();
                const rank = String(member.rankShortName || member.rank || "—").trim();
                const memberCallsign = String(member.callSign || "").trim();
                const lead = String(member.position || "").toLowerCase() === "lead";
                return `
                    <span class="patrol-crew-person${lead ? " is-lead" : ""}" title="${escapeHtml(memberName)}${memberCallsign ? " · " + escapeHtml(memberCallsign) : ""}">
                        <span class="patrol-crew-rank">${escapeHtml(rank)}</span>
                        <span class="patrol-crew-name">${escapeHtml(memberName)}</span>
                        ${memberCallsign ? `<span class="patrol-crew-callsign">${escapeHtml(memberCallsign)}</span>` : ""}
                        ${lead ? `<span class="patrol-crew-lead">LEAD</span>` : ""}
                    </span>
                `;
            }).join("")
            : `<span class="patrol-crew-empty">Keine Besatzung</span>`;

        card.innerHTML = `
            <div class="patrol-compact-main">
                <div class="patrol-compact-callsign">
                    <span class="patrol-call-sign-icon"><i class="fa-solid fa-radio"></i></span>
                    <strong>${escapeHtml(patrolCallsign)}</strong>
                    <span class="patrol-card-live"><span></span> AKTIV</span>
                </div>
                <div class="patrol-compact-field patrol-compact-status">
                    <span class="patrol-info-label">STATUS</span>
                    <span class="patrol-modern-status status-${escapeHtml(statusClass)}">${escapeHtml(statusValue)}</span>
                </div>
                <div class="patrol-compact-field">
                    <span class="patrol-info-label">EINSATZORT</span>
                    <span class="patrol-info-value"><i class="fa-solid fa-location-dot"></i>${escapeHtml(patrolLocation || "—")}</span>
                </div>
                <div class="patrol-compact-field">
                    <span class="patrol-info-label">FAHRZEUG</span>
                    <span class="patrol-info-value"><i class="fa-solid fa-car-side"></i>${escapeHtml(vehicle)}</span>
                </div>
                <div class="patrol-compact-field patrol-compact-activity">
                    <span class="patrol-info-label">TÄTIGKEIT</span>
                    <span class="patrol-info-value"><i class="fa-solid fa-bullhorn"></i>${escapeHtml(patrolActivity || "—")}</span>
                </div>
                <div class="patrol-compact-crew">
                    <span class="patrol-info-label">BESATZUNG</span>
                    <div class="patrol-crew-list">${membersHtml}</div>
                </div>
                <div class="patrol-compact-actions">
                    <button class="patrol-action-button patrol-join-button" type="button"
                        title="${alreadyMember ? "Bereits Mitglied dieser Streife" : "Dieser Streife beitreten"}"
                        aria-label="${alreadyMember ? "Bereits Mitglied dieser Streife" : "Dieser Streife beitreten"}"
                        data-patrol-join="${escapeHtml(patrol.id)}" ${alreadyMember ? "disabled" : ""}>
                        <i class="fa-solid ${alreadyMember ? "fa-check" : "fa-user-plus"}"></i>
                        <span>${alreadyMember ? "Dabei" : "Beitreten"}</span>
                    </button>
                    ${actionAllowed ? `
                        <button class="patrol-action-button patrol-edit-button" type="button" title="Streife bearbeiten" data-patrol-action="${escapeHtml(patrol.id)}">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                    ` : ""}
                </div>
            </div>
        `;

        const joinButton = card.querySelector("[data-patrol-join]");
        if (joinButton && !alreadyMember) {
            joinButton.addEventListener("click", function (event) {
                event.stopPropagation();
                joinButton.disabled = true;
                CloudApi.run.withSuccessHandler(function () {
                    clearPatrolsCache();
                    refreshPatrolData();
                    if (typeof window.showSuccess === "function") window.showSuccess("Du bist der Streife beigetreten.");
                }).withFailureHandler(function (error) {
                    joinButton.disabled = false;
                    if (typeof window.showError === "function") window.showError(error?.message || String(error));
                }).joinPatrol(getToken(), patrol.id);
            });
        }

        const action = card.querySelector("[data-patrol-action]");
        if (action) {
            action.addEventListener("click", function (event) {
                event.stopPropagation();
                openPatrolModal(patrol);
            });
        }

        return card;
    }

    function buildPatrolForm(patrol) {
        const editing = !!patrol;

        return `
            <div class="patrol-form-grid">
                <div class="patrol-field">
                    <label>Funkrufname aus der Personalakte</label>
                    <input
                        id="patrolModalCallsign"
                        type="text"
                        maxlength="80"
                        autocomplete="off"
                        placeholder="Wird aus der Personalakte übernommen"
                        readonly
                    >
                </div>

                <div class="patrol-field">
                    <label>Nummer</label>
                    <input
                        id="patrolModalNumber"
                        type="text"
                        maxlength="6"
                        placeholder="z. B. 21"
                    >
                </div>

                <div class="patrol-field">
                    <label>Fahrzeugtyp</label>
                    <select id="patrolModalVehicle">
                        ${VEHICLES.map(function (value) {
                            return `
                                <option value="${escapeHtml(value)}">
                                    ${escapeHtml(value)}
                                </option>
                            `;
                        }).join("")}
                    </select>
                </div>

                <div class="patrol-field">
                    <label>Status</label>
                    <select id="patrolModalStatus">
                        ${STATUSES.map(function (value) {
                            return `
                                <option value="${escapeHtml(value)}">
                                    ${escapeHtml(value)}
                                </option>
                            `;
                        }).join("")}
                    </select>
                </div>

                <div class="patrol-field full">
                    <div class="patrol-members-box">
                        <div class="patrol-members-header">
                            <span>Besatzung</span>
                            <select class="patrol-partner-select" id="patrolPartnerSelect" aria-label="Streifenpartner auswählen">
                                <option value="">Streifenpartner auswählen …</option>
                            </select>
                        </div>

                        <div id="patrolSelectedMembers"></div>
                    </div>

                    <div class="patrol-member-picker" id="patrolMemberPicker" style="display:none;">
                        <input class="patrol-member-search" id="patrolMemberSearch" placeholder="Beamten suchen..." type="text" autocomplete="off">
                        <div id="patrolMemberOptions"></div>
                    </div>
                </div>

                <div class="patrol-field full">
                    <div id="patrolModalError" class="patrol-modal-error" style="display:none;"></div>
                </div>
            </div>
        `;
    }

    function openPatrolModal(patrol) {
        const editing = !!patrol;
        const editable = editing ? canEdit() : canCreate();

        if (!editable) {
            showError(
                editing
                    ? "Du besitzt keine Berechtigung zum Bearbeiten von Streifen."
                    : "Du besitzt keine Berechtigung zum Erstellen von Streifen."
            );
            return;
        }

        if (
            !window.FIB_MDT_MODAL ||
            typeof FIB_MDT_MODAL.open !== "function"
        ) {
            showError("Das globale Modal ist nicht verfügbar.");
            return;
        }

        let selectedMembers = (
            editing && Array.isArray(patrol.members)
                ? patrol.members
                : []
        ).map(function (member) {
            return {
                id: member.id,
                name: member.name,
                username: member.username || "",
                rank: member.rank || "Kein Rang",
                callSign: member.callSign || "",
                position: member.position === "Lead" ? "Lead" : "Member"
            };
        });

        FIB_MDT_MODAL.open({
            title: editing ? "Streife bearbeiten" : "Neue Streife",
            subtitle: "Streifeneinheit in der Leitstelle",
            body: buildPatrolForm(patrol),
            saveVisible: true,
            saveText: editing ? "Änderungen speichern" : "In Dienst gehen",
            cancelText: "Abbrechen",
            onSave: function () {
                savePatrol(patrol, selectedMembers);
            }
        });

        const callsign =
            document.getElementById("patrolModalCallsign");
        const number =
            document.getElementById("patrolModalNumber");
        const vehicle =
            document.getElementById("patrolModalVehicle");
        const status =
            document.getElementById("patrolModalStatus");
        const picker = document.getElementById("patrolMemberPicker");
        const search = document.getElementById("patrolMemberSearch");
        const partnerSelect = document.getElementById("patrolPartnerSelect");

        if (editing && patrol) {
            callsign.value = patrol.callsign || "";
            number.value = patrol.number || "";
            vehicle.value = patrol.vehicleType || VEHICLES[0];
            status.value = patrol.status || STATUSES[0];
        } else {
            callsign.value = String(state.ownPersonnelProfile?.callSign || "").trim();
            vehicle.value = VEHICLES[0];
            status.value = STATUSES[0];
        }

        function modalError(message) {
            const element = document.getElementById("patrolModalError");
            if (!element) return;
            element.style.display = "block";
            element.textContent = String(message || "");
        }

        function clearModalError() {
            const element = document.getElementById("patrolModalError");
            if (!element) return;
            element.style.display = "none";
            element.textContent = "";
        }

        function renderSelectedMembers() {
            const container =
                document.getElementById("patrolSelectedMembers");
            if (!container) return;

            if (!selectedMembers.length) {
                container.innerHTML = `
                    <div class="patrol-modal-empty">
                        Noch keine Beamten zugewiesen.
                    </div>
                `;
                return;
            }

            container.innerHTML = selectedMembers
                .map(function (member, index) {
                    return `
                        <div class="patrol-selected-member">
                            <div class="patrol-selected-information">
                                <div class="patrol-selected-rank">
                                    ${escapeHtml(member.rankShortName || member.rank || "Kein Rang")}
                                </div>
                                <div class="patrol-selected-name">
                                    ${escapeHtml(member.name || "Unbekannt")}
                                </div>
                            </div>

                            <div style="display:flex;align-items:center;gap:7px;flex:0 0 auto;">
                                <select
                                    class="patrol-member-position"
                                    data-member-position="${index}"
                                >
                                    <option
                                        value="Member"
                                        ${member.position !== "Lead" ? "selected" : ""}
                                    >
                                        Mitglied
                                    </option>
                                    <option
                                        value="Lead"
                                        ${member.position === "Lead" ? "selected" : ""}
                                    >
                                        Streifenführer
                                    </option>
                                </select>

                                <button
                                    class="patrol-remove-member"
                                    data-remove-member="${index}"
                                    type="button"
                                    title="Beamten entfernen"
                                    aria-label="Streifenpartner entfernen"
                                >
                                    ×
                                </button>
                            </div>
                        </div>
                    `;
                })
                .join("");

            container
                .querySelectorAll("[data-remove-member]")
                .forEach(function (button) {
                    button.addEventListener("click", function () {
                        const index =
                            Number(button.dataset.removeMember);

                        selectedMembers.splice(index, 1);
                        renderSelectedMembers();
                        renderMemberOptions();
                    });
                });

            container
                .querySelectorAll("[data-member-position]")
                .forEach(function (select) {
                    select.addEventListener("change", function () {
                        const index =
                            Number(select.dataset.memberPosition);

                        if (selectedMembers[index]) {
                            selectedMembers[index].position = select.value;
                            if (select.value === "Lead" && selectedMembers[index].callSign) {
                                const callsignInput = document.getElementById("patrolModalCallsign");
                                if (callsignInput) callsignInput.value = selectedMembers[index].callSign;
                            }
                            clearModalError();
                        }
                    });
                });
        }

        function renderMemberOptions() {
            if (!partnerSelect) return;
            if (!state.patrolUsersLoaded) {
                partnerSelect.innerHTML = `<option value="">Beamte werden geladen …</option>`;
                partnerSelect.disabled = true;
                return;
            }
            partnerSelect.disabled = false;
            const selectedIds = selectedMembers.map(function(member){ return String(member.id); });
            const available = state.patrolUsers.filter(function(user){
                return !selectedIds.includes(String(user.id));
            }).sort(function(a,b){ return String(a.name||"").localeCompare(String(b.name||""), "de"); });
            partnerSelect.innerHTML = `<option value="">Streifenpartner auswählen …</option>` + available.map(function(user){
                const rank = user.rank ? ` · ${escapeHtml(user.rank)}` : "";
                return `<option value="${escapeHtml(user.id)}">${escapeHtml(user.name || "Unbekannt")}${rank}</option>`;
            }).join("");
        }

        renderSelectedMembers();
        renderMemberOptions();

        if (partnerSelect && !partnerSelect.dataset.bound) {
            partnerSelect.dataset.bound = "true";
            partnerSelect.addEventListener("change", function () {
                const user = state.patrolUsers.find(function(item){ return String(item.id) === String(partnerSelect.value); });
                if (!user) return;
                if (selectedMembers.some(function(item){ return String(item.id) === String(user.id); })) { partnerSelect.value = ""; return; }
                selectedMembers.push({
                    id:user.id, name:user.name, username:user.username||"", rank:user.rank||"Kein Rang", callSign:user.callSign||"", position:selectedMembers.length===0?"Lead":"Member"
                });
                if (selectedMembers.length === 1 && user.callSign) {
                    const callsignInput=document.getElementById("patrolModalCallsign");
                    if (callsignInput) callsignInput.value=user.callSign;
                }
                partnerSelect.value = "";
                clearModalError();
                renderSelectedMembers();
                renderMemberOptions();
            });
        }

        /*
         * Die Benutzerliste kann parallel zum Modal geöffnet werden.
         * Sobald sie ankommt, wird der Picker automatisch aktualisiert.
         */
        fetchPatrolUsers(false)
            .then(function () {
                renderMemberOptions();
            })
            .catch(function (error) {});

        if (editing && canDelete()) {
            FIB_MDT_MODAL.setFooterButtons([
                {
                    label: "Streife entfernen",
                    className: "danger",
                    onClick: function () {
                        deletePatrol(patrol);
                    }
                }
            ], { keepSave: true });
        }

        clearModalError();

        return true;
    }

    function setModalBusy(busy, label) {
        const save = FIB_MDT_MODAL?.getSaveButton?.();
        const cancel = FIB_MDT_MODAL?.getCancelButton?.();

        if (save) {
            save.disabled = !!busy;
            save.textContent =
                label ||
                save.textContent ||
                "Speichern";
        }

        // Keep Cancel available even while saving. The save action alone is locked
        // to prevent duplicate submissions; users must never be trapped in a modal.
        if (cancel) {
            cancel.disabled = false;
            cancel.removeAttribute("disabled");
        }
    }

    function readPatrolModalData(selectedMembers, patrol) {
        const callsign =
            document.getElementById("patrolModalCallsign");
        const number =
            document.getElementById("patrolModalNumber");
        const vehicle =
            document.getElementById("patrolModalVehicle");
        const status =
            document.getElementById("patrolModalStatus");

        return {
            id: patrol ? patrol.id : null,
            callsign: callsign?.value?.trim() || "",
            number: number?.value?.trim() || "",
            vehicleType: vehicle?.value || "",
            status: status?.value || "",
            members: selectedMembers.map(function (member) {
                return {
                    id: member.id,
                    position: member.position === "Lead"
                        ? "Lead"
                        : "Member"
                };
            })
        };
    }

    function savePatrol(patrol, selectedMembers) {
        const editing = !!patrol;
        const form = readPatrolModalData(selectedMembers, patrol);

        if (!form.number) {
            showError("Bitte eine Streifennummer angeben.");
            return;
        }

        if (!form.callsign || !String(form.callsign).trim()) {
            showError("Bitte einen Funkrufnamen in der Personalakte hinterlegen.");
            return;
        }

        if (!VEHICLES.includes(form.vehicleType)) {
            showError("Bitte einen gültigen Fahrzeugtyp auswählen.");
            return;
        }

        if (!STATUSES.includes(form.status)) {
            showError("Bitte einen gültigen Status auswählen.");
            return;
        }

        const leads = selectedMembers.filter(function (member) {
            return member.position === "Lead";
        });

        if (leads.length > 1) {
            showError("Eine Streife kann nur einen Streifenführer haben.");
            return;
        }

        setModalBusy(
            true,
            editing ? "Speichern..." : "Erstellen..."
        );

        const method = editing ? "updatePatrol" : "createPatrol";

        CloudApi.run
            .withSuccessHandler(function (result) {
                const saved = result?.patrol || result;

                if (!saved || !saved.id) {
                    FIB_MDT_MODAL.close();
                    clearPatrolsCache();
                    fetchPatrols(true).catch(function () {});
                    showSuccess(
                        editing
                            ? "Die Streife wurde aktualisiert."
                            : "Die Streife wurde erstellt."
                    );
                    return;
                }

                if (editing) {
                    const index = state.patrolData.findIndex(function (item) {
                        return String(item.id) === String(saved.id);
                    });

                    if (index >= 0) {
                        state.patrolData[index] = saved;
                    } else {
                        state.patrolData.push(saved);
                    }
                } else {
                    state.patrolData.push(saved);
                }

                window.fibCache.patrols.data = state.patrolData;
                window.fibCache.patrols.timestamp = Date.now();
                state.patrolDataLoaded = true;

                renderPatrols();
                FIB_MDT_MODAL.close();

                showSuccess(
                    editing
                        ? "Die Streife wurde aktualisiert."
                        : "Die Streife wurde erstellt."
                );
            })
            .withFailureHandler(function (error) {
                setModalBusy(
                    false,
                    editing ? "Änderungen speichern" : "In Dienst gehen"
                );

                showError(
                    error && error.message
                        ? error.message
                        : "Die Streife konnte nicht gespeichert werden."
                );
            })
            [method](getToken(), form);
    }

    async function deletePatrol(patrol) {
        if (!canDelete()) {
            showError("Du besitzt keine Berechtigung zum Entfernen von Streifen.");
            return;
        }

        const confirmed = await FIB_MDT_MODAL.confirm({
            title: "Streife entfernen",
            subtitle: "Diese Aktion kann nicht rückgängig gemacht werden.",
            message: "Möchtest du diese Streife wirklich entfernen?",
            confirmText: "Streife entfernen",
            cancelText: "Abbrechen",
            danger: true
        });
        if (!confirmed) return;

        CloudApi.run
            .withSuccessHandler(function () {
                state.patrolData = state.patrolData.filter(function (item) {
                    return String(item.id) !== String(patrol.id);
                });

                window.fibCache.patrols.data = state.patrolData;
                window.fibCache.patrols.timestamp = Date.now();
                state.patrolDataLoaded = true;

                renderPatrols();

                showSuccess("Die Streife wurde entfernt.");
            })
            .withFailureHandler(function (error) {
                showError(
                    error && error.message
                        ? error.message
                        : "Die Streife konnte nicht entfernt werden."
                );
            })
            .deletePatrol(getToken(), patrol.id);
    }

    function bindStaticEvents() {
        const createButton = document.getElementById("patrolEndDutyButton");
        if (createButton) createButton.style.display = "none";
        const pageDutyEndButton = document.getElementById("patrolEndDutyButton");
        if (pageDutyEndButton && !pageDutyEndButton.dataset.bound) {
            pageDutyEndButton.dataset.bound = "true";
            pageDutyEndButton.addEventListener("click", function () {
                const topbarEndButton = document.getElementById("fibDutyEndButton");
                if (topbarEndButton && !topbarEndButton.hidden) {
                    topbarEndButton.click();
                    return;
                }
                pageDutyEndButton.disabled = true;
                CloudApi.run.withSuccessHandler(function () {
                    clearPatrolsCache();
                    refreshPatrolData();
                    pageDutyEndButton.hidden = true;
                    pageDutyEndButton.style.display = "none";
                    if (typeof window.showSuccess === "function") window.showSuccess("Du hast deinen Dienst beendet.");
                    window.dispatchEvent(new CustomEvent("fib-mdt:duty-ended"));
                }).withFailureHandler(function (error) {
                    pageDutyEndButton.disabled = false;
                    if (typeof window.showError === "function") window.showError(error?.message || String(error));
                }).leavePatrol(getToken());
            });
        }
        if (!window.fibPatrolDutyButtonSyncBound) {
            window.fibPatrolDutyButtonSyncBound = true;
            window.addEventListener("fib-mdt:duty-started", function () {
                const button = document.getElementById("patrolEndDutyButton");
                if (button) { button.hidden = false; button.style.display = "inline-flex"; button.disabled = false; }
            });
            window.addEventListener("fib-mdt:duty-state-restored", function (event) {
                const button = document.getElementById("patrolEndDutyButton");
                if (!button) return;
                const active = !!event.detail?.inDuty;
                button.hidden = !active;
                button.style.display = active ? "inline-flex" : "none";
                button.disabled = false;
            });
            window.addEventListener("fib-mdt:duty-ended", function () {
                const button = document.getElementById("patrolEndDutyButton");
                if (button) { button.hidden = true; button.style.display = "none"; button.disabled = false; }
            });
        }

        const refreshButton =
            document.getElementById("patrolRefreshButton");

        if (refreshButton && !refreshButton.dataset.bound) {
            refreshButton.dataset.bound = "true";
            refreshButton.addEventListener("click", refreshPatrolData);
        }

        document
            .querySelectorAll(".patrol-group-button")
            .forEach(function (button) {
                if (button.dataset.bound) return;

                button.dataset.bound = "true";
                button.addEventListener("click", function () {
                    state.patrolFilters.group =
                        button.dataset.group || "status";

                    document
                        .querySelectorAll(".patrol-group-button")
                        .forEach(function (item) {
                            item.classList.remove("active");
                        });

                    button.classList.add("active");
                    renderPatrols();
                });
            });
    }

    function applyPermissionUI() {
        const createButton =
            document.getElementById("patrolEndDutyButton");

        if (createButton) createButton.style.display = "none";

        const description =
            document.getElementById("patrolPermissionHint");

        if (description) {
            if (isMasterAccount()) {
                description.textContent = "Masterzugriff";
            } else if (canEdit() || canDelete()) {
                description.textContent = "Verwaltung freigeschaltet";
            } else {
                description.textContent = "Nur Lesezugriff";
            }
        }
    }

    function initializePatrols() {
        state.instanceId =
            String(Date.now()) +
            "_" +
            Math.random().toString(36).slice(2);

        state.mounted = true;

        if (!hasPatrolPermission(PATROL_PERMISSIONS.view)) {
            applyPermissionUI();
            renderAccessDenied();
            state.initialized = true;
            return;
        }

        applyPermissionUI();
        loadConfiguredTenCodes().then(function(){ const select=document.getElementById("patrolModalStatus"); if(select){const selected=select.value;select.innerHTML=STATUSES.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");if(STATUSES.includes(selected))select.value=selected;} });
        bindStaticEvents();

        if (cacheValid(window.fibCache.patrols)) {
            state.patrolData = window.fibCache.patrols.data;
            state.patrolDataLoaded = true;
            renderPatrols();
        }

        if (cacheValid(window.fibCache.patrolUsers)) {
            state.patrolUsers = window.fibCache.patrolUsers.data;
            state.patrolUsersLoaded = true;
        }

        fetchOwnPersonnelProfile(false).catch(function () {});
        fetchPatrols(false).catch(function () {});
        if (canCreate() || canEdit()) {
            fetchPatrolUsers(false).catch(function () {});
        }
        renderOwnStatus();

        state.initialized = true;
    }

    window.initializePatrols = initializePatrols;
    // Cross-client live sync: only a tiny patrol revision is checked frequently.
    // The full patrol payload (with users/ranks/members) is fetched only when the
    // revision actually changed. This keeps the Leitstelle current without
    // hammering Supabase with the expensive getPatrols join query.
    if (!window.fibPatrolLiveSyncTimer) {
        let lastPatrolRevision = null;
        window.fibPatrolLiveSyncTimer = window.__fibPageLifecycle.interval(function () {
            const list = document.getElementById("patrolsList");
            const modal = document.getElementById("fibGlobalModalOverlay");
            if (!list || state.saving || (modal && modal.classList.contains("open")) || document.visibilityState !== "visible") return;
            window.runServer("getPatrolRevision").then(function (snapshot) {
                const revision = String(snapshot && snapshot.revision || "");
                if (lastPatrolRevision === null) {
                    lastPatrolRevision = revision;
                    return;
                }
                if (revision !== lastPatrolRevision) {
                    lastPatrolRevision = revision;
                    clearPatrolsCache();
                    fetchPatrols(true).catch(function () {});
                }
            }).catch(function () {});
        }, 5000);
    }
    window.__fibPageLifecycle.on(window, "fib-mdt:duty-started", function () {
        const list = document.getElementById("patrolsList");
        if (list) fetchPatrols(true).catch(function () {});
    });
    window.__fibPageLifecycle.on(window, "fib-mdt:refresh-request", function (event) { const modal=document.getElementById("fibGlobalModalOverlay"); if (document.getElementById("patrolsList") && !state.saving && !(modal && modal.classList.contains("open"))) refreshPatrolData(); });
    window.__fibPageLifecycle.on(window, "fib-mdt:data-changed", function (event) { const modal=document.getElementById("fibGlobalModalOverlay"); if (document.getElementById("patrolsList") && !(modal && modal.classList.contains("open")) && /Patrol|patrol|Member|member/.test(String(event.detail && event.detail.method || ""))) refreshPatrolData(); });
})();
</script>
