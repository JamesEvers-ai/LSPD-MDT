<style>

/* =========================================================
   LSPD MDT – BEAMTE
========================================================= */

.agents-page {
    width: 100%;
    min-height: 100%;
    box-sizing: border-box;
    padding: 22px 24px 28px;
    color: #243447;
    background: transparent;
}

.agents-page-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 18px;
}

.agents-page-title-wrap {
    min-width: 0;
}

.agents-page-title {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #17324d;
}

.agents-page-subtitle {
    margin-top: 4px;
    font-size: 11px;
    color: #718399;
}

.agents-page-count {
    flex: 0 0 auto;
    font-size: 10px;
    color: #718399;
    white-space: nowrap;
}


/* =========================================================
   DEPARTMENT TABS
========================================================= */
.agents-department-tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-bottom:10px;max-height:92px;overflow:auto;padding-bottom:2px}
.agents-department-tab{border:1px solid #dce3eb;background:#f4f6f9;color:#53657a;border-radius:999px;padding:7px 10px;font:inherit;font-size:9px;white-space:nowrap;cursor:pointer;transition:.15s ease}
.agents-department-tab:hover{background:#eaf2fb;color:#245b91}
.agents-department-tab.active{background:#e8eef5;color:#102a43;border-color:#cfd9e4;font-weight:700}


/* =========================================================
   PERSONNEL DEPARTMENT WORKSPACE
========================================================= */
.agents-department-workspace{display:flex;flex-direction:column;gap:12px}
.agents-department-workspace-info{font-size:10px;line-height:1.55;color:#6f8192;background:#f4f7fa;border:1px solid #dfe7ef;border-radius:8px;padding:10px 12px}
.agents-department-workspace-actions{display:flex;justify-content:flex-end}
.agents-department-member-list{display:flex;flex-direction:column;gap:6px}
.agents-termination-link-card{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.agents-termination-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}

.agents-department-member{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:10px 12px;border:1px solid #dfe7ef;background:#fff;border-radius:8px;color:#18324a;text-align:left;cursor:pointer}
.agents-department-member:hover{border-color:#b9c9d8;background:#f7f9fb}
.agents-department-member-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.agents-department-member-main strong{font-size:11px}
.agents-department-member-main span{font-size:9px;color:#708395}

/* =========================================================
   SEARCH
========================================================= */

.agents-toolbar {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 13px;
}

.agents-search {
    position: relative;
    flex: 1;
    min-width: 0;
}

.agents-search input {
    width: 100%;
    height: 38px;

    box-sizing: border-box;

    border: 1px solid rgba(255,255,255,0.065);
    border-radius: 9px;

    background: rgba(255,255,255,0.025);

    color: #ffffff;

    font-family: inherit;
    font-size: 11px;

    padding: 0 13px 0 37px;

    outline: none;

    transition:
        border-color 0.15s ease,
        background 0.15s ease;
}

.agents-search input::placeholder {
    color: rgba(255,255,255,0.25);
}

.agents-search input:focus {
    border-color: rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.035);
}

.agents-search-icon {
    position: absolute;

    left: 13px;
    top: 50%;

    transform: translateY(-50%);

    width: 14px;
    height: 14px;

    color: rgba(255,255,255,0.32);

    pointer-events: none;
}

.agents-search-icon svg {
    width: 100%;
    height: 100%;
}


/* =========================================================
   LIST
========================================================= */

.agents-list {
    width: 100%;

    border: 1px solid rgba(255,255,255,0.055);
    border-radius: 11px;

    overflow: hidden;

    background: rgba(255,255,255,0.012);
}

.agents-list-header {
    display: grid;

    grid-template-columns:
        minmax(300px, 1.7fr)
        minmax(110px, 0.7fr)
        minmax(170px, 0.9fr)
        110px;

    align-items: center;

    min-height: 39px;

    padding: 0 14px;

    box-sizing: border-box;

    background: rgba(255,255,255,0.026);

    border-bottom:1px solid #dfe6ed;
}

.agents-list-header-cell {
    font-size: 9px;
    font-weight: 600;

    color: rgba(255,255,255,0.32);

    text-transform: uppercase;
    letter-spacing: 0.055em;
}

.agents-list-header-cell:last-child {
    text-align: right;
}

.agents-list-row {
    display: grid;

    grid-template-columns:
        minmax(300px, 1.7fr)
        minmax(110px, 0.7fr)
        minmax(170px, 0.9fr)
        110px;

    align-items: center;

    min-height: 66px;

    padding: 0 14px;

    box-sizing: border-box;

    border-bottom:
        1px solid
        rgba(255,255,255,0.045);

    cursor: pointer;

    transition:
        background 0.14s ease;
}

.agents-list-row:last-child {
    border-bottom: none;
}

.agents-list-row:hover {
    background:
        rgba(255,255,255,0.025);
}


/* =========================================================
   AGENT
========================================================= */

.agents-agent-cell {
    display: flex;
    align-items: center;

    gap: 11px;

    min-width: 0;
}

.agents-avatar {
    width: 38px;
    height: 38px;

    flex: 0 0 38px;

    border-radius: 9px;

    object-fit: cover;

    border:
        1px solid
        rgba(255,255,255,0.08);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.055),
            rgba(255,255,255,0.018)
        );
}

.agents-avatar-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
    font-weight: 700;

    color:
        rgba(255,255,255,0.56);
}

.agents-agent-main {
    min-width: 0;
}

.agents-agent-name {
    font-size: 11px;
    font-weight: 650;

    color: #ffffff;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.agents-agent-meta {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-top: 3px;

    min-width: 0;
}

.agents-agent-rank {
    font-size: 9px;

    color:
        rgba(255,255,255,0.41);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.agents-agent-username {
    font-size: 8px;

    color:
        rgba(255,255,255,0.23);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   OTHER COLUMNS
========================================================= */

.agents-service-number {
    font-size: 10px;
    color: rgba(255,255,255,0.56);
}

.agents-organization {
    min-width: 0;
}

.agents-organization-main {
    font-size: 10px;

    color:
        rgba(255,255,255,0.62);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.agents-organization-meta {
    display: flex;
    align-items: center;

    gap: 7px;

    margin-top: 3px;

    min-width: 0;
}

.agents-organization-meta span {
    font-size: 8px;

    color:
        rgba(255,255,255,0.25);

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


/* =========================================================
   FILE BUTTON
========================================================= */

.agents-file-button-wrap {
    display: flex;
    justify-content: flex-end;
}

.agents-file-button {
    height: 29px;

    padding: 0 10px;

    border:
        1px solid
        rgba(255,255,255,0.065);

    border-radius: 7px;

    background:
        rgba(255,255,255,0.028);

    color:
        rgba(255,255,255,0.63);

    font-family: inherit;
    font-size: 9px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.14s ease,
        border-color 0.14s ease,
        color 0.14s ease;
}

.agents-file-button:hover {
    background:
        rgba(255,255,255,0.055);

    border-color:
        rgba(255,255,255,0.11);

    color:#17324b;
}


/* =========================================================
   STATES
========================================================= */

.agents-state {
    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 160px;

    padding: 25px;

    box-sizing: border-box;

    font-size: 10px;

    color:
        rgba(255,255,255,0.29);

    text-align: center;
}

.agents-loading {
    display: inline-flex;
    align-items: center;

    gap: 8px;
}

.agents-loading-spinner {
    width: 12px;
    height: 12px;

    border-radius: 50%;

    border:
        2px solid
        rgba(255,255,255,0.08);

    border-top-color:
        rgba(255,255,255,0.54);

    animation:
        agentsSpin
        0.8s
        linear
        infinite;
}

@keyframes agentsSpin {

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   TABS
========================================================= */

.agents-personnel-tabs {
    display: flex;

    align-items: center;

    gap: 6px;

    margin:
        0
        0
        15px
        0;

    padding: 0;

    border-bottom:
        1px solid
        rgba(0,0,0,0.055);
}

.agents-personnel-tab {
    position: relative;

    height: 33px;

    padding:
        0
        10px;

    border: none;

    background: transparent;

    color:
        rgba(255,255,255,0.34);

    font-family: inherit;
    font-size: 10px;
    font-weight: 600;

    cursor: pointer;

    transition:
        color 0.14s ease;
}

.agents-personnel-tab:hover {
    color:
        rgba(255,255,255,0.62);
}

.agents-personnel-tab.active {
    color:#17324b;
}

.agents-personnel-tab.active::after {
    content: "";

    position: absolute;

    left: 8px;
    right: 8px;
    bottom: -1px;

    height: 2px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.72);
}


/* =========================================================
   FORM
========================================================= */

.agents-form {
    display: flex;

    flex-direction: column;

    gap: 14px;
}

.agents-form-grid {
    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:
        12px
        13px;
}

.agents-form-group {
    min-width: 0;
}

.agents-form-group.full {
    grid-column:
        1 / -1;
}

.agents-form-label {
    display: block;

    margin-bottom: 6px;

    font-size: 10px;
    font-weight: 600;

    color:
        rgba(255,255,255,0.43);

    line-height: 1.3;
}

.agents-form-input,
.agents-form-select,
.agents-form-textarea {
    width: 100%;

    box-sizing: border-box;

    border:
        1px solid
        rgba(255,255,255,0.065);

    border-radius: 7px;

    background:
        rgba(255,255,255,0.025);

    color:#17324b;

    font-family: inherit;

    font-size: 11px;

    outline: none;

    transition:
        border-color 0.14s ease,
        background 0.14s ease;
}

.agents-form-input,
.agents-form-select {
    height: 36px;

    padding:
        0
        10px;
}

.agents-form-textarea {
    min-height: 82px;

    padding:
        9px
        10px;

    resize: vertical;

    line-height: 1.5;
}

.agents-form-input::placeholder,
.agents-form-textarea::placeholder {
    color:
        rgba(255,255,255,0.23);
}

.agents-form-input:focus,
.agents-form-select:focus,
.agents-form-textarea:focus {
    border-color:
        rgba(255,255,255,0.13);

    background:
        rgba(255,255,255,0.035);
}

.agents-form-input:disabled {
    opacity: 0.58;
    cursor: not-allowed;
}


/* =========================================================
   SECTIONS
========================================================= */

.agents-section {
    margin-top: 17px;
}

.agents-section:first-child {
    margin-top: 0;
}

.agents-section-title {
    margin-bottom: 9px;

    font-size: 10px;
    font-weight: 650;

    color:
        rgba(255,255,255,0.52);

    text-transform: uppercase;
    letter-spacing: 0.045em;

    line-height: 1.35;
}

.agents-section-card {
    padding: 12px;

    border:
        1px solid
        rgba(255,255,255,0.055);

    border-radius: 8px;

    background:
        rgba(255,255,255,0.018);
}


/* =========================================================
   BUTTONS
========================================================= */

.agents-inline-actions {
    display: flex;

    align-items: center;
    justify-content: flex-end;

    gap: 7px;

    margin-top: 1px;
}

.agents-small-button {
    height: 33px;

    padding:
        0
        11px;

    border:
        1px solid
        rgba(255,255,255,0.07);

    border-radius: 7px;

    background:
        rgba(255,255,255,0.035);

    color:
        rgba(255,255,255,0.68);

    font-family: inherit;
    font-size: 10px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background 0.14s ease,
        border-color 0.14s ease,
        color 0.14s ease;
}

.agents-small-button:hover {
    background:
        rgba(255,255,255,0.06);

    color:#17324b;
}

.agents-small-button.primary {
    background:
        rgba(255,255,255,0.085);

    color:#17324b;
}

.agents-small-button.primary:hover {
    background:
        rgba(255,255,255,0.12);
}


/* =========================================================
   ENTRIES
========================================================= */

.agents-training-form,
.agents-note-form {
    display: flex;

    flex-direction: column;

    gap: 11px;
}

.agents-training-list,
.agents-note-list {
    display: flex;

    flex-direction: column;

    gap: 8px;

    margin-top: 10px;
}

.agents-entry-item {
    display: flex;

    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    padding: 11px;

    border:
        1px solid
        rgba(255,255,255,0.055);

    border-radius: 8px;

    background:
        rgba(255,255,255,0.018);
}

.agents-entry-main {
    min-width: 0;

    flex: 1;
}

.agents-entry-title {
    font-size: 11px;
    font-weight: 650;

    color:#17324b;

    line-height: 1.4;
}

.agents-entry-meta {
    display: flex;

    flex-wrap: wrap;

    align-items: center;

    gap:
        6px
        10px;

    margin-top: 5px;
}

.agents-entry-meta span {
    font-size: 9px;

    color:
        rgba(255,255,255,0.34);

    line-height: 1.4;
}

.agents-entry-content {
    margin-top: 8px;

    font-size: 10px;

    line-height: 1.55;

    color:
        rgba(255,255,255,0.48);

    white-space: pre-wrap;

    word-break: break-word;
}

.agents-entry-delete {
    width: 27px;
    height: 27px;

    flex: 0 0 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(255,255,255,0.055);

    border-radius: 6px;

    background:
        rgba(255,255,255,0.025);

    color:
        rgba(255,255,255,0.30);

    font-family: inherit;
    font-size: 13px;

    cursor: pointer;
}

.agents-entry-delete:hover {
    background:
        rgba(255,255,255,0.06);

    color:#17324b;
}

.agents-empty-list {
    padding:
        19px
        10px;

    text-align: center;

    font-size: 10px;

    color:
        rgba(255,255,255,0.27);
}


/* =========================================================
   STATUS
========================================================= */

.agents-status {
    display: inline-flex;

    align-items: center;

    height: 20px;

    padding:
        0
        8px;

    border-radius: 999px;

    background:
        rgba(255,255,255,0.045);

    color:
        rgba(255,255,255,0.53);

    font-size: 9px;
    font-weight: 600;
}

.agents-status.success {
    background:
        rgba(100,190,130,0.10);

    color:
        rgba(150,225,170,0.88);
}

.agents-status.warning {
    background:
        rgba(220,175,80,0.10);

    color:
        rgba(235,205,130,0.88);
}

.agents-status.danger {
    background:
        rgba(220,95,95,0.10);

    color:
        rgba(245,145,145,0.88);
}


/* =========================================================
   LOADING
========================================================= */

.agents-personnel-loading-strip {
    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 13px;

    padding:
        8px
        10px;

    border:
        1px solid
        rgba(255,255,255,0.045);

    border-radius: 7px;

    background:
        rgba(255,255,255,0.015);

    font-size: 9px;

    color:
        rgba(255,255,255,0.30);
}

.agents-personnel-loading-strip
.agents-loading-spinner {
    width: 9px;
    height: 9px;

    border-width: 1.5px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 700px) {

    .agents-page {
        padding:
            15px
            12px
            18px;
    }

    .agents-list-header {
        display: none;
    }

    .agents-list-row {
        display: flex;

        align-items: center;

        gap: 10px;

        padding:
            11px
            12px;
    }

    .agents-agent-cell {
        flex: 1;

        min-width: 0;
    }

    .agents-service-number,
    .agents-organization {
        display: none;
    }

    .agents-file-button-wrap {
        flex: 0 0 auto;
    }

    .agents-form-grid {
        grid-template-columns:
            1fr;
    }

    .agents-form-group.full {
        grid-column:
            auto;
    }

}

<script>

(function() {

    "use strict";

    const DEPARTMENTS = [
        "Internal Affairs Division", "Central Division", "Northern Division", "Patrol Division",
        "Investigative Division", "Metropolitan Division", "Support Division", "Internal Affairs",
        "Patrol Unit", "Detective Bureau", "Special Weapons and Tactics", "Gang Enforcement Detail",
        "Canine (K9)", "Police Academy", "Public Relations Office", "Air Support Division", "High Command"
    ];


    /* =====================================================
       STATE
    ====================================================== */

    const state =
        window.__FIB_MDT_AGENTS_PAGE__ ||
        {

            agents: [],

            filteredAgents: [],

            selectedAgent: null,

            rankOptions: [],

            trainings: [],

            notes: [],

            sanctions: [],

            history: [],

            historyLoaded: false,

            sanctionsVisible: false,

            sanctionsLoaded: false,

            trainingsLoaded: false,

            notesLoaded: false,

            bundleLoaded: false,

            bundleLoading: false,

            modalTab: "personal",

            departmentFilter: "all",

            viewMode: "active",

            terminatedRecords: [],

            terminatedLoaded: false,

            globalEventsBound: false

        };


    window.__FIB_MDT_AGENTS_PAGE__ =
        state;


    /* =====================================================
       TOKEN
    ====================================================== */

    function getAgentsSessionToken() {

        if (
            typeof sessionToken !==
            "undefined" &&
            sessionToken
        ) {

            return sessionToken;

        }


        try {

            return (
                sessionStorage.getItem(
                    "fib_mdt_session"
                ) ||
                sessionStorage.getItem(
                    "lspd_mdt_session"
                ) ||
                ""
            );

        } catch (error) {

            console.error(
                "LSPD MDT – Session konnte nicht gelesen werden:",
                error
            );

            return "";

        }

    }


    /* =====================================================
       HELPERS
    ====================================================== */

    function $(
        id
    ) {

        return document.getElementById(
            id
        );

    }


    function escapeHtml(
        value
    ) {

        return String(
            value ??
            ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function getValue(
        object,
        keys,
        fallback = ""
    ) {

        if (!object) {
            return fallback;
        }


        for (
            const key of keys
        ) {

            if (
                Object.prototype.hasOwnProperty.call(
                    object,
                    key
                ) &&
                object[key] !==
                    null &&
                object[key] !==
                    undefined
            ) {

                return object[key];

            }

        }


        return fallback;

    }


    /* =====================================================
       PERMISSIONS
    ====================================================== */

    function hasAgentPermission(permission) {

        if (
            typeof isMaster !== "undefined" &&
            isMaster === true
        ) {
            return true;
        }

        let permissions = [];

        try {

            if (
                typeof myPermissions !== "undefined" &&
                Array.isArray(myPermissions)
            ) {
                permissions = myPermissions;
            }
            else if (
                Array.isArray(window.myPermissions)
            ) {
                permissions = window.myPermissions;
            }

        } catch (error) {

            permissions = [];

        }

        return permissions.some(
            value =>
                String(value) ===
                String(permission)
        );

    }


    function canViewOfficers() {

        return hasAgentPermission(
            "officers.view"
        );

    }


    function canEditOfficers() {

        return hasAgentPermission(
            "officers.edit"
        );

    }


    function canTerminateSelectedAgent() {
        const agent = state.selectedAgent;
        if (!agent || !canEditOfficers()) return false;
        const currentId = (typeof currentUser !== "undefined" && currentUser) ? (currentUser.id || currentUser.userId || currentUser.ID || "") : "";
        if (String(currentId) === String(agent.id || agent.userId || "")) return false;
        if (agent.active === false) return false;
        if (typeof isMaster !== "undefined" && isMaster === true) return true;
        const currentRankValue = (typeof currentUser !== "undefined" && currentUser) ? (currentUser.rank || "") : "";
        const actorRank = (state.rankOptions || []).find(r => String(r.id) === String(currentRankValue) || String(r.name) === String(currentRankValue));
        const targetRank = (state.rankOptions || []).find(r => String(r.id) === String(agent.rankId || agent.rank) || String(r.name) === String(agent.rankName || agent.rank));
        if (!actorRank || !targetRank) return false;
        return Number(targetRank.level || 0) <= Number(actorRank.level || 0);
    }


    /* =====================================================
       RANK SORTING
    ====================================================== */

    function getAgentRankId(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankId",
                    "RankId",
                    "RankID"
                ],
                ""
            )
        );

    }


    function getAgentRankName(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankName",
                    "rank",
                    "Rank"
                ],
                "Kein Rang"
            )
        );

    }


    function getRankLevel(rank) {

        if (!rank) {
            return Number.NEGATIVE_INFINITY;
        }

        const raw =
            getValue(
                rank,
                [
                    "level",
                    "Level",
                    "priority",
                    "Priority",
                    "order",
                    "Order"
                ],
                ""
            );

        const level = Number(raw);

        return Number.isFinite(level)
            ? level
            : Number.NEGATIVE_INFINITY;

    }


    function findAgentRankOption(agent) {

        const rankId =
            getAgentRankId(agent);

        if (rankId) {

            const byId =
                state.rankOptions.find(
                    rank =>
                        String(
                            getValue(
                                rank,
                                [
                                    "id",
                                    "ID",
                                    "rankId",
                                    "RankId"
                                ],
                                ""
                            )
                        ) ===
                        rankId
                );

            if (byId) {
                return byId;
            }

        }

        const rankName =
            getAgentRankName(agent)
                .trim()
                .toLowerCase();

        if (!rankName) {
            return null;
        }

        return (
            state.rankOptions.find(
                rank =>
                    String(
                        getValue(
                            rank,
                            [
                                "name",
                                "Name",
                                "rank",
                                "Rank"
                            ],
                            ""
                        )
                    )
                    .trim()
                    .toLowerCase() ===
                    rankName
            ) ||
            null
        );

    }


    function sortAgentsByRank() {

        state.agents.sort(
            (a, b) => {

                const aRank =
                    findAgentRankOption(a);

                const bRank =
                    findAgentRankOption(b);

                const aLevel =
                    getRankLevel(aRank);

                const bLevel =
                    getRankLevel(bRank);

                if (aLevel !== bLevel) {
                    return bLevel - aLevel;
                }

                const rankCompare =
                    getAgentRankName(a)
                        .localeCompare(
                            getAgentRankName(b),
                            "de-DE",
                            {
                                sensitivity: "base"
                            }
                        );

                if (rankCompare !== 0) {
                    return rankCompare;
                }

                return String(
                    getValue(
                        a,
                        [
                            "name",
                            "Name"
                        ],
                        ""
                    )
                ).localeCompare(
                    String(
                        getValue(
                            b,
                            [
                                "name",
                                "Name"
                            ],
                            ""
                        )
                    ),
                    "de-DE",
                    {
                        sensitivity: "base"
                    }
                );

            }
        );

    }


    function loadAgentRankOrdering(
        token,
        callback
    ) {

        if (!Array.isArray(state.agents) || !state.agents.length) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        const firstAgentId =
            String(
                getValue(
                    state.agents[0],
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );

        if (!firstAgentId) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    state.rankOptions =
                        Array.isArray(bundle)
                            ? bundle
                            : (bundle && Array.isArray(bundle.rankOptions) ? bundle.rankOptions : []);

                    sortAgentsByRank();
                    callback();

                }
            )

            .withFailureHandler(
                error => {

                    console.warn(
                        "LSPD MDT – Beamte: Rangsortierung konnte nicht geladen werden. Die Liste wird mit Fallback-Reihenfolge sortiert.",
                        error
                    );

                    state.rankOptions = [];
                    sortAgentsByRank();
                    callback();

                }
            )

            .getPersonnelRankOptions(
                token
            );

    }


    function formatDate(
        value
    ) {

        if (
            !value
        ) {

            return "—";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );

        }


        return date.toLocaleDateString(
            "de-DE"
        );

    }


    function toDateInputValue(
        value
    ) {

        if (!value) {
            return "";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +
            "-" +
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            )
        );

    }


    /* =====================================================
       INITIALIZATION
    ====================================================== */

    function initializeAgentsPage() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        bindAgentsSearch();
        bindDepartmentTabs();


        loadAgents();

    }


    /*
     * Die Page wird dynamisch in den DOM geladen.
     *
     * Deshalb einmalig leicht verzögert initialisieren.
     *
     * WICHTIG:
     * Dieser Aufruf darf in dieser Datei nur EINMAL
     * vorhanden sein.
     */

    window.__fibPageLifecycle.timeout(
        function() {

            initializeAgentsPage();

        },
        50
    );


    function bindDepartmentTabs() {
        document.querySelectorAll("[data-agent-department]").forEach(button => {
            button.onclick = function() {
                state.viewMode = "active";
                state.departmentFilter = button.dataset.agentDepartment || "all";
                document.querySelectorAll("[data-agent-department]").forEach(item => item.classList.toggle("active", item === button));
                document.querySelectorAll("[data-agent-view]").forEach(item => item.classList.toggle("active", item.dataset.agentView === "active"));
                filterAgents($("agentsSearchInput")?.value || "");
            };
        });
        document.querySelectorAll("[data-agent-view]").forEach(button => {
            button.onclick = function() {
                state.viewMode = button.dataset.agentView || "active";
                document.querySelectorAll("[data-agent-view]").forEach(item => item.classList.toggle("active", item === button));
                document.querySelectorAll("[data-agent-department]").forEach(item => item.classList.toggle("active", item.dataset.agentDepartment === "all" && state.viewMode === "active"));
                if (state.viewMode === "terminated") loadTerminatedAgents();
                else filterAgents($("agentsSearchInput")?.value || "");
            };
        });
    }


    /* =====================================================
       SEARCH
    ====================================================== */

    function bindAgentsSearch() {

        const input =
            $("agentsSearchInput");


        if (!input) {
            return;
        }


        input.oninput =
            function() {

                filterAgents(
                    this.value
                );

            };

    }


    function filterAgents(
        query
    ) {

        const value =
            String(
                query ||
                ""
            )
            .trim()
            .toLowerCase();


        if (state.viewMode === "terminated") {
            const records = Array.isArray(state.terminatedRecords) ? state.terminatedRecords : [];
            state.filteredAgents = records.filter(record => {
                const p = record.payload || {};
                const haystack = [p.recipient, p.previousRank, p.departmentUnit, p.documentNumber, p.terminationType, p.reason, record.createdByName].map(v => String(v ?? "").toLowerCase()).join(" ");
                return !value || haystack.includes(value);
            });
            renderTerminatedList();
            return;
        }

        const department = String(state.departmentFilter || "all");
        const source = department === "all" ? state.agents : state.agents.filter(agent => String(agent.department || "") === department);

        if (!value) {

            state.filteredAgents = [...source];

        } else {

            state.filteredAgents =
                source.filter(
                    agent => {

                        const haystack = [

                            agent.name,

                            agent.username,

                            agent.rank,

                            agent.serviceNumber,

                            agent.phone,

                            agent.callSign,

                            agent.department,

                            agent.unit

                        ]
                        .map(
                            value =>
                                String(
                                    value ??
                                    ""
                                ).toLowerCase()
                        )
                        .join(" ");


                        return haystack.includes(
                            value
                        );

                    }
                );

        }


        renderAgentsList();

    }


    /* =====================================================
       LOAD AGENTS
    ====================================================== */

    function loadAgents() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        list.innerHTML = `

            <div class="agents-state">

                <div class="agents-loading">

                    <div class="agents-loading-spinner"></div>

                    Beamte werden geladen...

                </div>

            </div>

        `;


        const token =
            getAgentsSessionToken();


        console.log(
            "LSPD MDT – Beamte: Starte Laden",
            {
                hasToken:
                    !!token,

                tokenLength:
                    token
                        ? String(token).length
                        : 0
            }
        );


        if (!token) {

            console.error(
                "LSPD MDT – Beamte: Kein Session-Token vorhanden."
            );


            renderAgentsError(
                "Keine aktive Sitzung."
            );

            return;

        }


        CloudApi.run

            .withSuccessHandler(
                response => {

                    console.log(
                        "LSPD MDT – Beamte: Serverantwort",
                        response
                    );


                    /*
                     * Erwartet normalerweise:
                     *
                     * [
                     *   {...},
                     *   {...}
                     * ]
                     *
                     * Akzeptiert zusätzlich:
                     *
                     * {
                     *   agents: [...]
                     * }
                     *
                     * Eine ungültige Antwort wird NICHT
                     * mehr still zu [] umgewandelt.
                     */

                    let agents =
                        null;


                    if (
                        Array.isArray(
                            response
                        )
                    ) {

                        agents =
                            response;

                    }
                    else if (
                        response &&
                        Array.isArray(
                            response.agents
                        )
                    ) {

                        agents =
                            response.agents;

                    }


                    if (
                        !Array.isArray(
                            agents
                        )
                    ) {

                        console.error(
                            "LSPD MDT – Beamte: Ungültige Serverantwort.",
                            response
                        );


                        renderAgentsError(
                            "Der Server hat keine gültige Beamtenliste zurückgegeben."
                        );

                        return;

                    }


                    state.agents =
                        [
                            ...agents
                        ];


                    loadAgentRankOrdering(
                        token,
                        function() {

                            state.filteredAgents =
                                [
                                    ...state.agents
                                ];


                            console.log(
                                "LSPD MDT – Beamte: Beamte geladen und nach Rang sortiert",
                                state.agents.length
                            );


                            updateAgentsCount();

                            renderAgentsList();

                        }
                    );

                }
            )

            .withFailureHandler(
                error => {

                    console.error(
                        "LSPD MDT – Beamte RPC-Fehler:",
                        error
                    );


                    renderAgentsError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Beamten konnten nicht geladen werden."
                    );

                }
            )

    function loadPersonnelHistory() {
        const token = getAgentsSessionToken();
        const agent = state.selectedAgent;
        if (!token || !agent) return Promise.resolve([]);
        return new Promise((resolve, reject) => {
            CloudApi.run.withSuccessHandler(rows => { state.history = Array.isArray(rows) ? rows : []; state.historyLoaded = true; if (state.modalTab === "history") renderPersonnelModal(true); resolve(state.history); }).withFailureHandler(reject).getPersonnelHistory(token, String(agent.id));
        });
    }


    function openPersonnelFile(
        userIdOrAgent
    ) {

        const requestedId =
            userIdOrAgent && typeof userIdOrAgent === "object"
                ? getValue(userIdOrAgent, ["id", "ID", "userId", "user_id"], "")
                : userIdOrAgent;

        if (!canViewOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            return;

        }

        let agent =
            state.agents.find(
                item =>
                    String(
                        getValue(
                            item,
                            [
                                "id",
                                "ID",
                                "userId",
                                "user_id"
                            ],
                            ""
                        )
                    ) ===
                    String(requestedId)
            );

        // Gekündigte/inaktive Personen sind absichtlich nicht in der aktiven
        // Beamtenliste. Für diese Fälle nehmen wir den archivierten Datensatz
        // als leichten Platzhalter und laden die vollständige Personalakte
        // anschließend über das bestehende Bundle nach.
        if (!agent && state.viewMode === "terminated") {
            const termination = (state.terminatedRecords || []).find(
                record => String(record?.userId || "") === String(requestedId)
            );
            if (termination) {
                const payload = termination.payload || {};
                agent = {
                    id: String(termination.userId || requestedId),
                    userId: String(termination.userId || requestedId),
                    name: payload.recipient || "Unbekannte Person",
                    rank: payload.previousRank || "Kein Rang",
                    rankName: payload.previousRank || "Kein Rang",
                    department: payload.departmentUnit || "",
                    active: false,
                    approved: false,
                    personnelStatus: "Ausgeschieden"
                };
            }
        }

        if (!agent) {
            showAgentError(
                "Der ausgewählte Beamte konnte nicht gefunden werden."
            );
            return;
        }


        state.selectedAgent =
            {
                ...agent
            };


        state.modalTab =
            "personal";


        state.bundleLoaded =
            false;


        state.bundleLoading =
            true;


        state.trainings =
            [];


        state.notes =
            [];

        state.sanctions = [];
        state.history = [];
        state.historyLoaded = false;
        state.sanctionsVisible = false;
        state.sanctionsLoaded = false;
        state.terminations = [];


        state.trainingsLoaded =
            false;


        state.notesLoaded =
            false;


        openAgentsModal();


        renderPersonnelModal(
            false
        );


        const token =
            getAgentsSessionToken();


        if (!token) {

            state.bundleLoading =
                false;

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        /*
         * Genau EIN Request.
         */

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    if (
                        !state.selectedAgent ||
                        String(
                            state.selectedAgent.id
                        ) !==
                        String(
                            requestedId
                        )
                    ) {

                        return;

                    }


                    bundle =
                        bundle &&
                        typeof bundle ===
                            "object"
                            ? bundle
                            : {};


                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...(
                            bundle.agent &&
                            typeof bundle.agent ===
                                "object"
                                ? bundle.agent
                                : {}
                        )

                    };


                    /*
                     * Vorhandenes Profilbild aus
                     * der Beamtenliste behalten.
                     */

                    if (
                        !state.selectedAgent.profileImage &&
                        agent.profileImage
                    ) {

                        state.selectedAgent.profileImage =
                            agent.profileImage;

                    }


                    state.rankOptions =
                        Array.isArray(
                            bundle.rankOptions
                        )
                            ? bundle.rankOptions
                            : [];


                    state.trainings =
                        Array.isArray(
                            bundle.trainings
                        )
                            ? bundle.trainings
                            : [];


                    state.notes =
                        Array.isArray(
                            bundle.notes
                        )
                            ? bundle.notes
                            : [];

                    state.sanctions = Array.isArray(bundle.sanctions) ? bundle.sanctions : [];
                    state.terminations = Array.isArray(bundle.terminations) ? bundle.terminations : [];
                    state.history = Array.isArray(bundle.history) ? bundle.history : [];
                    state.historyLoaded = true;
                    state.sanctionsVisible = bundle.sanctionsVisible === true;
                    state.sanctionsLoaded = true;


                    state.trainingsLoaded =
                        true;


                    state.notesLoaded =
                        true;


                    state.bundleLoaded =
                        true;


                    state.bundleLoading =
                        false;


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .withFailureHandler(
                error => {

                    state.bundleLoading =
                        false;


                    console.error(
                        "LSPD MDT – Personalakten-Bundle:",
                        error
                    );


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht geladen werden."
                    );


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .getPersonnelFileBundle(
                token,
                requestedId
            );

    }

    function openAgentsModal() {
        const manager = window.FIB_MDT_MODAL;

        manager.open({ title:"Personalakte", subtitle:"", body:"", modalClass:"agents", cancelText:"Schließen", cancelVisible:true, focus:false });

        if (window.FIB_MDT_MODAL && typeof window.FIB_MDT_MODAL.close === "function") window.FIB_MDT_MODAL.close();

        }


        const name =
            String(
                getValue(
                    agent,
                    [
                        "name",
                        "Name"

            String(

                    ],

                )
            );


        const title =
            $("fibGlobalModalTitle");


        const description =
            $("fibGlobalModalSubtitle");


        const body =
            $("fibGlobalModalBody");


        if (
            !title ||
            !description ||
            !body
        ) {
            return;
        }


        title.textContent =
            name;


        description.textContent =
            `Personalakte · ${rank}`;


        if (!loaded && state.bundleLoading) {
            body.innerHTML = `${renderTabs("personal")}<div class="agents-form"><div class="agents-personnel-loading-strip">Personalakte wird geladen …</div></div>`;
            bindPersonnelTabEvents();
            return;
        }

        if (
            state.modalTab ===
            "department"
        ) {

            body.innerHTML =
                renderDepartmentTab();

        }
        else if (
            state.modalTab ===
            "trainings"
        ) {

            body.innerHTML =
                renderTrainingsTab();

        }
        else if (
            state.modalTab ===
            "notes"
        ) {

            body.innerHTML =
                renderNotesTab();

        }
        else if (state.modalTab === "sanctions" && state.sanctionsVisible) {
            body.innerHTML = renderSanctionsTab();
        }
        else if (state.modalTab === "history") {
            body.innerHTML = renderHistoryTab();
        }
        else if (state.modalTab === "termination" && canTerminateSelectedAgent()) {
            body.innerHTML = renderTerminationTab();
        }
        else {

            body.innerHTML =
                renderPersonalTab(
                    loaded
                );

        }


        bindPersonnelTabEvents();
        populateRankSelect();
        if (window.FIB_MDT_SELECTS && typeof window.FIB_MDT_SELECTS.refresh === "function") window.FIB_MDT_SELECTS.refresh();

        bindPersonalForm();

        bindTrainingForm();
        bindDepartmentWorkspace();

        bindNoteForm();
        bindTerminationForm();

    }

    function getCurrentRankLabel(rankId, fallback) {
        const found=(state.rankOptions||[]).find(rank=>String(getValue(rank,["id","ID"],""))===String(rankId));
        return found?String(getValue(found,["name","Name"],fallback)):(fallback||"Kein Rang");
    }

    function populateRankSelect() {
        const select=$("agentRankNativeSelect"); if(!select)return;
        const currentRankId=String(getValue(state.selectedAgent,["rankId","RankId"],""));
        const sorted=[...(state.rankOptions||[])].sort((a,b)=>{const level=getRankLevel(b)-getRankLevel(a);if(level!==0)return level;return String(getValue(a,["name","Name"],"")).localeCompare(String(getValue(b,["name","Name"],"")),"de-DE",{sensitivity:"base"});});
        select.innerHTML=`<option value="">Rang auswählen...</option>`+sorted.map(rank=>{const id=String(getValue(rank,["id","ID"],""));const name=String(getValue(rank,["name","Name"],id));return `<option value="${escapeHtml(id)}" ${id===currentRankId?"selected":""}>${escapeHtml(name)}</option>`;}).join("");
        select.onchange=function(){const selected=sorted.find(rank=>String(getValue(rank,["id","ID"],""))===String(select.value));if(!selected)return;const rankName=String(getValue(selected,["name","Name"],select.value));state.selectedAgent.rankId=String(select.value);state.selectedAgent.rankName=rankName;state.selectedAgent.rank=rankName;};
    }

    function savePersonnelProfile() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const userId =
            String(
                getValue(
                    agent,
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );


        if (!token) {

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        const data = {

            serviceNumber:
                $("agentServiceNumber")
                    ?.value
                    ?.trim() ||
                "",

            phone:
                $("agentPhone")
                    ?.value
                    ?.trim() ||
                "",

            callSign:
                $("agentCallSign")
                    ?.value
                    ?.trim() ||
                "",

            department:
                $("agentDepartment")
                    ?.value
                    ?.trim() ||
                "",

            unit:
                $("agentUnit")
                    ?.value
                    ?.trim() ||
                "",

            email:
                $("agentEmail")
                    ?.value
                    ?.trim() ||
                "",

            address:
                $("agentAddress")
                    ?.value
                    ?.trim() ||
                "",

            entryDate:
                $("agentEntryDate")
                    ?.value ||
                "",

            personnelStatus:
                $("agentPersonnelStatus")
                    ?.value
                    ?.trim() ||
                "",

            note:
                $("agentPersonnelNote")
                    ?.value
                    ?.trim() ||
                "",

            rankId:
                $("agentRankNativeSelect")
                    ?.value ||
                getValue(
                    agent,
                    [
                        "rankId",
                        "RankId"
                    ],
                    ""
                )

        };


        const button =
            $("agentSavePersonalButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird gespeichert...";

        }


        CloudApi.run

            .withSuccessHandler(
                () => {

                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...data

                    };


                    const selectedRank =
                        state.rankOptions.find(
                            rank =>
                                String(
                                    getValue(
                                        rank,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                String(
                                    data.rankId
                                )
                        );


                    if (
                        selectedRank
                    ) {

                        state.selectedAgent.rankId =
                            data.rankId;


                        state.selectedAgent.rankName =
                            getValue(
                                selectedRank,
                                [
                                    "name",
                                    "Name"
                                ],
                                "Kein Rang"
                            );


                        state.selectedAgent.rank =
                            state.selectedAgent.rankName;

                    }


                    const index =
                        state.agents.findIndex(
                            item =>
                                String(
                                    getValue(
                                        item,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                userId
                        );


                    if (
                        index !==
                        -1
                    ) {

                        state.agents[index] = {

                            ...state.agents[index],

                            ...state.selectedAgent

                        };

                    }


                    filterAgents(
                        $("agentsSearchInput")
                            ?.value ||
                        ""
                    );


                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    renderPersonnelModal(true);
                    loadPersonnelHistory().catch(function () {});
                    showAgentSuccess(
                        "Die Personalakte wurde erfolgreich gespeichert."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht gespeichert werden."
                    );

                }
            )

            .savePersonnelProfile(
                token,
                userId,
                data
            );

    }

    function saveDepartmentOnly(department) {
        if (!canEditOfficers() || !state.selectedAgent) return;
        const token = getAgentsSessionToken();
        const agent = state.selectedAgent;
        const userId = String(agent.id || "");
        if (!token || !userId) return showAgentError("Keine aktive Personalakte.");
        const data = {
            serviceNumber: String(getValue(agent,["serviceNumber"],"")||""),
            phone: String(getValue(agent,["phone"],"")||""),
            callSign: String(getValue(agent,["callSign"],"")||""),
            department: String(department||""),
            unit: String(getValue(agent,["unit"],"")||""),
            email: String(getValue(agent,["email"],"")||""),
            address: String(getValue(agent,["address"],"")||""),
            entryDate: getValue(agent,["entryDate"],"")||"",
            personnelStatus: String(getValue(agent,["personnelStatus"],"")||""),
            note: String(getValue(agent,["personnelNote","note"],"")||""),
            rankId: String(getValue(agent,["rankId"],"")||"")
        };
        const save = $("agentDepartmentWorkspaceSave");
        if (save) { save.disabled=true; save.textContent="Wird gespeichert..."; }
        CloudApi.run.withSuccessHandler(() => {
            state.selectedAgent = {...state.selectedAgent, department:data.department};
            state.agents = state.agents.map(item => String(item.id)===userId ? {...item,department:data.department} : item);
            filterAgents($("agentsSearchInput")?.value || "");
            if (save) { save.disabled=false; save.textContent="Abteilung gespeichert"; }
            renderPersonnelModal(true);
            showAgentSuccess("Abteilung wurde gespeichert.");
        }).withFailureHandler(error => {
            if (save) { save.disabled=false; save.textContent="Abteilung speichern"; }
            showAgentError(error?.message || "Die Abteilung konnte nicht gespeichert werden.");
        }).savePersonnelProfile(token,userId,data);
    }

    function createTraining() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const userId =
            String(
                agent.id
            );


        const name =
            $("trainingName")
                ?.value
                ?.trim() ||
            "";


        if (!name) {

            showAgentError(
                "Bitte einen Namen für die Schulung eingeben."
            );

            return;

        }


        const button =
            $("createTrainingButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird eingetragen...";

        }


        const data = {

            name:
                name,

            category:
                $("trainingCategory")
                    ?.value
                    ?.trim() ||
                "",

            date:
                $("trainingDate")
                    ?.value ||
                "",

            instructor:
                $("trainingInstructor")
                    ?.value
                    ?.trim() ||
                "",

            status:
                $("trainingStatus")
                    ?.value ||
                "Bestanden",

            expiryDate:
                $("trainingExpiryDate")
                    ?.value ||
                "",

            notes:
                $("trainingNotes")
                    ?.value
                    ?.trim() ||
                ""

        };


        CloudApi.run

            .withSuccessHandler(
                created => {

                    state.trainings =
                        [
                            created,
                            ...state.trainings
                        ];


                    state.trainingsLoaded =
                        true;


                    renderPersonnelModal(
                        true
                    );


                    showAgentSuccess(
                        "Die Schulung wurde eingetragen."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Schulung eintragen";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Schulung konnte nicht eingetragen werden."
                    );

                }
            )

            .createPersonnelTraining(
                token,
                userId,
                data
            );

    function setupSignatureCanvas(canvas) {
        if (!canvas) return {clear(){},data(){return "";}};
        const ctx = canvas.getContext("2d"); ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#102a43"; ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
        let drawing=false,dirty=false;
        const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};};
        const start=e=>{drawing=true;dirty=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
        const move=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
        const end=()=>{drawing=false;};
        canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",end);canvas.addEventListener("pointerleave",end);
        return {clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);dirty=false;},data(){return dirty?canvas.toDataURL("image/png",0.8):"";}};
    }

        const idValue = String(agent.id || agent.userId || "");
        if (!idValue) return;

        try {
            state.bundleLoading = true;
            const bundle = await new Promise((resolve, reject) => {
                CloudApi.run
                    .withSuccessHandler(resolve)
                    .withFailureHandler(reject)
                    .getPersonnelFileBundle(token, idValue);
            });

            if (!state.selectedAgent || String(state.selectedAgent.id || state.selectedAgent.userId || "") !== idValue) return;

            state.selectedAgent = { ...state.selectedAgent, ...(bundle?.agent || {}) };
            state.rankOptions = Array.isArray(bundle?.rankOptions) ? bundle.rankOptions : state.rankOptions;
            state.trainings = Array.isArray(bundle?.trainings) ? bundle.trainings : [];
            state.notes = Array.isArray(bundle?.notes) ? bundle.notes : [];
            state.sanctions = Array.isArray(bundle?.sanctions) ? bundle.sanctions : [];
            state.terminations = Array.isArray(bundle?.terminations) ? bundle.terminations : [];
            state.history = Array.isArray(bundle?.history) ? bundle.history : [];
            state.sanctionsVisible = bundle?.sanctionsVisible === true;
            state.trainingsLoaded = true;
            state.notesLoaded = true;
            state.sanctionsLoaded = true;
            state.historyLoaded = true;
            state.bundleLoaded = true;
        } catch (error) {
            console.warn("LSPD MDT – Offene Personalakte konnte nicht aktualisiert werden:", error);
        } finally {
            state.bundleLoading = false;
            if (state.selectedAgent && String(state.selectedAgent.id || state.selectedAgent.userId || "") === idValue) {
                renderPersonnelModal(true);
            }
        }
    }

    /* =====================================================
       GLOBAL FUNCTIONS
    ====================================================== */

    window.__fibPageLifecycle.on(window, "fib-mdt:refresh-request", function (event) { if (document.getElementById("agentsPage") && !(event.detail && event.detail.source === "mutation")) loadAgents(); });

    window.__fibPageLifecycle.on(window, "fib-mdt:data-changed", function (event) {
        if (!document.getElementById("agentsPage")) return;
        const method = String(event.detail && event.detail.method || "");
        if (!/Personnel|Agent|Training|Note|Rank|User|Termination|Sanction/i.test(method)) return;
        const modal = document.getElementById("fibGlobalModalOverlay");
        if (modal && modal.classList.contains("open") && state.selectedAgent) {
            refreshOpenPersonnelFile();
        } else {
            loadAgents();
        }
    });

    window.openPersonnelFile =
        openPersonnelFile;


    window.closePersonnelFile =
        closePersonnelFile;


})();
</script>
