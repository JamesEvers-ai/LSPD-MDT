<main class="mdt-workspace mdt-workspace--agents" data-mdt-page="agents" data-lspd-module="agents">
<div
    id="agentsPage"
    class="agents-page"
>

    <div class="agents-page-header">

        <div class="agents-page-title-wrap">

            <div class="agents-page-title">
                Beamte
            </div>

            <div class="agents-page-subtitle">
                Übersicht der aktiven Beamten
            </div>

        </div>

        <div
            id="agentsPageCount"
            class="agents-page-count"
        >
            0 Beamte
        </div>

    </div>


    <div class="agents-toolbar">

        <div class="agents-search">

            <div class="agents-search-icon">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >

                    <circle
                        cx="11"
                        cy="11"
                        r="7"
                    ></circle>

                    <path
                        d="M20 20L16.2 16.2"
                    ></path>

                </svg>

            </div>

            <input
                id="agentsSearchInput"
                type="text"
                placeholder="Beamte suchen..."
                autocomplete="off"
            >

        </div>

    </div>


    <div class="agents-list">

        <div class="agents-list-header">

            <div class="agents-list-header-cell">
                Beamter
            </div>

            <div class="agents-list-header-cell">
                Dienstnummer
            </div>

            <div class="agents-list-header-cell">
                Organisation
            </div>

            <div class="agents-list-header-cell">
                Personalakte
            </div>

        </div>


        <div id="agentsList">

            <div class="agents-state">

                <div class="agents-loading">

                    <div class="agents-loading-spinner"></div>

                    Beamte werden geladen...

                </div>

            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     PERSONALAKTE
========================================================== -->

<div
    id="agentsSystemModalOverlay"
    class="agents-system-modal-overlay"
>

    <div
        id="agentsSystemModal"
        class="agents-system-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="agentsSystemModalTitle"
    >

        <div class="agents-system-modal-header">

            <div>

                <div
                    id="agentsSystemModalTitle"
                    class="agents-system-modal-title"
                >
                    Personalakte
                </div>

                <div
                    id="agentsSystemModalDescription"
                    class="agents-system-modal-description"
                ></div>

            </div>


            <button
                type="button"
                class="agents-system-modal-close"
                onclick="closePersonnelFile()"
                aria-label="Schließen"
            >
                ×
            </button>

        </div>


        <div
            id="agentsSystemModalBody"
            class="agents-system-modal-body"
        ></div>


        <div class="agents-system-modal-actions">

            <button
                type="button"
                class="agents-system-button"
                onclick="closePersonnelFile()"
            >
                Abbrechen
            </button>

        </div>

    </div>

</div>


<script src="/js/pages/agents.js?v=3.76" defer></script>
</main>
