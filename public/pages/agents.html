<script>
(function() {

    "use strict";

    const DEPARTMENTS = [
        "Internal Affairs Division", "Central Division", "Northern Division", "Patrol Division",
        "Investigative Division", "Metropolitan Division", "Support Division", "Internal Affairs",
        "Patrol Unit", "Detective Bureau", "Special Weapons and Tactics", "Gang Enforcement Detail",
        "Canine (K9)", "Police Academy", "Public Relations Office", "Air Support Division", "High Command"
    ];


    /* =====================================================
       STATE
    ====================================================== */

    const state =
        window.__FIB_MDT_AGENTS_PAGE__ ||
        {

            agents: [],

            filteredAgents: [],

            selectedAgent: null,

            rankOptions: [],

            trainings: [],

            notes: [],

            sanctions: [],

            history: [],

            historyLoaded: false,

            sanctionsVisible: false,

            sanctionsLoaded: false,

            trainingsLoaded: false,

            notesLoaded: false,

            bundleLoaded: false,

            bundleLoading: false,

            modalTab: "personal",

            departmentFilter: "all",

            globalEventsBound: false,

            lastTerminationUrl: ""

        };


    window.__FIB_MDT_AGENTS_PAGE__ =
        state;


    /* =====================================================
       TOKEN
    ====================================================== */

    function getAgentsSessionToken() {

        if (
            typeof sessionToken !==
            "undefined" &&
            sessionToken
        ) {

            return sessionToken;

        }


        try {

            return (
                sessionStorage.getItem(
                    "fib_mdt_session"
                ) ||
                sessionStorage.getItem(
                    "lspd_mdt_session"
                ) ||
                ""
            );

        } catch (error) {

            console.error(
                "LSPD MDT – Session konnte nicht gelesen werden:",
                error
            );

            return "";

        }

    }


    /* =====================================================
       HELPERS
    ====================================================== */

    function $(
        id
    ) {

        return document.getElementById(
            id
        );

    }


    function escapeHtml(
        value
    ) {

        return String(
            value ??
            ""
        )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

    }


    function getValue(
        object,
        keys,
        fallback = ""
    ) {

        if (!object) {
            return fallback;
        }


        for (
            const key of keys
        ) {

            if (
                Object.prototype.hasOwnProperty.call(
                    object,
                    key
                ) &&
                object[key] !==
                    null &&
                object[key] !==
                    undefined
            ) {

                return object[key];

            }

        }


        return fallback;

    }


    /* =====================================================
       PERMISSIONS
    ====================================================== */

    function hasAgentPermission(permission) {

        if (
            typeof isMaster !== "undefined" &&
            isMaster === true
        ) {
            return true;
        }

        let permissions = [];

        try {

            if (
                typeof myPermissions !== "undefined" &&
                Array.isArray(myPermissions)
            ) {
                permissions = myPermissions;
            }
            else if (
                Array.isArray(window.myPermissions)
            ) {
                permissions = window.myPermissions;
            }

        } catch (error) {

            permissions = [];

        }

        return permissions.some(
            value =>
                String(value) ===
                String(permission)
        );

    }


    function canViewOfficers() {

        return hasAgentPermission(
            "officers.view"
        );

    }


    function canEditOfficers() {

        return hasAgentPermission(
            "officers.edit"
        );

    }


    /* =====================================================
       RANK SORTING
    ====================================================== */

    function getAgentRankId(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankId",
                    "RankId",
                    "RankID"
                ],
                ""
            )
        );

    }


    function getAgentRankName(agent) {

        return String(
            getValue(
                agent,
                [
                    "rankName",
                    "rank",
                    "Rank"
                ],
                "Kein Rang"
            )
        );

    }


    function getRankLevel(rank) {

        if (!rank) {
            return Number.NEGATIVE_INFINITY;
        }

        const raw =
            getValue(
                rank,
                [
                    "level",
                    "Level",
                    "priority",
                    "Priority",
                    "order",
                    "Order"
                ],
                ""
            );

        const level = Number(raw);

        return Number.isFinite(level)
            ? level
            : Number.NEGATIVE_INFINITY;

    }


    function findAgentRankOption(agent) {

        const rankId =
            getAgentRankId(agent);

        if (rankId) {

            const byId =
                state.rankOptions.find(
                    rank =>
                        String(
                            getValue(
                                rank,
                                [
                                    "id",
                                    "ID",
                                    "rankId",
                                    "RankId"
                                ],
                                ""
                            )
                        ) ===
                        rankId
                );

            if (byId) {
                return byId;
            }

        }

        const rankName =
            getAgentRankName(agent)
                .trim()
                .toLowerCase();

        if (!rankName) {
            return null;
        }

        return (
            state.rankOptions.find(
                rank =>
                    String(
                        getValue(
                            rank,
                            [
                                "name",
                                "Name",
                                "rank",
                                "Rank"
                            ],
                            ""
                        )
                    )
                    .trim()
                    .toLowerCase() ===
                    rankName
            ) ||
            null
        );

    }


    function sortAgentsByRank() {

        state.agents.sort(
            (a, b) => {

                const aRank =
                    findAgentRankOption(a);

                const bRank =
                    findAgentRankOption(b);

                const aLevel =
                    getRankLevel(aRank);

                const bLevel =
                    getRankLevel(bRank);

                if (aLevel !== bLevel) {
                    return bLevel - aLevel;
                }

                const rankCompare =
                    getAgentRankName(a)
                        .localeCompare(
                            getAgentRankName(b),
                            "de-DE",
                            {
                                sensitivity: "base"
                            }
                        );

                if (rankCompare !== 0) {
                    return rankCompare;
                }

                return String(
                    getValue(
                        a,
                        [
                            "name",
                            "Name"
                        ],
                        ""
                    )
                ).localeCompare(
                    String(
                        getValue(
                            b,
                            [
                                "name",
                                "Name"
                            ],
                            ""
                        )
                    ),
                    "de-DE",
                    {
                        sensitivity: "base"
                    }
                );

            }
        );

    }


    function loadAgentRankOrdering(
        token,
        callback
    ) {

        if (!Array.isArray(state.agents) || !state.agents.length) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        const firstAgentId =
            String(
                getValue(
                    state.agents[0],
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );

        if (!firstAgentId) {

            state.rankOptions = [];
            sortAgentsByRank();
            callback();
            return;

        }

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    state.rankOptions =
                        Array.isArray(bundle)
                            ? bundle
                            : (bundle && Array.isArray(bundle.rankOptions) ? bundle.rankOptions : []);

                    sortAgentsByRank();
                    callback();

                }
            )

            .withFailureHandler(
                error => {

                    console.warn(
                        "LSPD MDT – Beamte: Rangsortierung konnte nicht geladen werden. Die Liste wird mit Fallback-Reihenfolge sortiert.",
                        error
                    );

                    state.rankOptions = [];
                    sortAgentsByRank();
                    callback();

                }
            )

            .getPersonnelRankOptions(
                token
            );

    }


    function formatDate(
        value
    ) {

        if (
            !value
        ) {

            return "—";

        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return String(
                value
            );

        }


        return date.toLocaleDateString(
            "de-DE"
        );

    }


    function toDateInputValue(
        value
    ) {

        if (!value) {
            return "";
        }


        const date =
            new Date(
                value
            );


        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "";

        }


        return (
            date.getFullYear() +
            "-" +
            String(
                date.getMonth() + 1
            ).padStart(
                2,
                "0"
            ) +
            "-" +
            String(
                date.getDate()
            ).padStart(
                2,
                "0"
            )
        );

    }


    /* =====================================================
       INITIALIZATION
    ====================================================== */

    function initializeAgentsPage() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        bindAgentsSearch();
        bindDepartmentTabs();

        bindGlobalEvents();

        loadAgents();

    }


    /*
     * Die Page wird dynamisch in den DOM geladen.
     *
     * Deshalb einmalig leicht verzögert initialisieren.
     *
     * WICHTIG:
     * Dieser Aufruf darf in dieser Datei nur EINMAL
     * vorhanden sein.
     */

    window.__fibPageLifecycle.timeout(
        function() {

            initializeAgentsPage();

        },
        50
    );


    function bindDepartmentTabs() {
        document.querySelectorAll("[data-agent-department]").forEach(button => {
            button.onclick = function() {
                state.departmentFilter = button.dataset.agentDepartment || "all";

    function filterAgents(
        query
    ) {

        const value =
            String(
                query ||
                ""
            )
            .trim()
            .toLowerCase();


        const department = String(state.departmentFilter || "all");
        const source = department === "all" ? state.agents : state.agents.filter(agent => String(agent.department || "") === department);

        if (!value) {

            state.filteredAgents = [...source];

        } else {

            state.filteredAgents =
                source.filter(
                    agent => {

                        const haystack = [

                            agent.name,

                            agent.username,

                            agent.rank,

                            agent.serviceNumber,

                            agent.phone,

                            agent.callSign,

                            agent.department,

                            agent.unit

                        ]
                        .map(
                            value =>
                                String(
                                    value ??
                                    ""
                                ).toLowerCase()
                        )
                        .join(" ");


                        return haystack.includes(
                            value
                        );

                    }
                );

        }


        renderAgentsList();

    }


    /* =====================================================
       LOAD AGENTS
    ====================================================== */

    function loadAgents() {

        const list =
            $("agentsList");


        if (!list) {
            return;
        }


        if (!canViewOfficers()) {

            renderAgentsError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            updateAgentsCount();
            return;

        }


        list.innerHTML = `

            <div class="agents-state">

                <div class="agents-loading">

                    <div class="agents-loading-spinner"></div>

                    Beamte werden geladen...

                </div>

            </div>

        `;


        const token =
            getAgentsSessionToken();


        console.log(
            "LSPD MDT – Beamte: Starte Laden",
            {
                hasToken:
                    !!token,

                tokenLength:
                    token
                        ? String(token).length
                        : 0
            }
        );


        if (!token) {

            console.error(
                "LSPD MDT – Beamte: Kein Session-Token vorhanden."
            );


            renderAgentsError(
                "Keine aktive Sitzung."
            );

            return;

        }


        CloudApi.run

            .withSuccessHandler(
                response => {

                    console.log(
                        "LSPD MDT – Beamte: Serverantwort",
                        response
                    );


                    /*
                     * Erwartet normalerweise:
                     *
                     * [
                     *   {...},
                     *   {...}
                     * ]
                     *
                     * Akzeptiert zusätzlich:
                     *
                     * {
                     *   agents: [...]
                     * }
                     *
                     * Eine ungültige Antwort wird NICHT
                     * mehr still zu [] umgewandelt.
                     */

                    let agents =
                        null;


                    if (
                        Array.isArray(
                            response
                        )
                    ) {

                        agents =
                            response;

                    }
                    else if (
                        response &&
                        Array.isArray(
                            response.agents
                        )
                    ) {

                        agents =
                            response.agents;

                    }


                    if (
                        !Array.isArray(
                            agents
                        )
                    ) {

                        console.error(
                            "LSPD MDT – Beamte: Ungültige Serverantwort.",
                            response
                        );


                        renderAgentsError(
                            "Der Server hat keine gültige Beamtenliste zurückgegeben."
                        );

                        return;

                    }


                    state.agents =
                        [
                            ...agents
                        ];


                    loadAgentRankOrdering(
                        token,
                        function() {

                            state.filteredAgents =
                                [
                                    ...state.agents
                                ];


                            console.log(
                                "LSPD MDT – Beamte: Beamte geladen und nach Rang sortiert",
                                state.agents.length
                            );


                            updateAgentsCount();

                            renderAgentsList();

                        }
                    );

                }
            )

            .withFailureHandler(
                error => {

                    console.error(
                        "LSPD MDT – Beamte RPC-Fehler:",
                        error
                    );


                    renderAgentsError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Beamten konnten nicht geladen werden."
                    );

                }
            )

            .getPersonnelList(
                token
            );

    }

    function loadPersonnelHistory() {
        const token = getAgentsSessionToken();
        const agent = state.selectedAgent;
        if (!token || !agent) return Promise.resolve([]);
        return new Promise((resolve, reject) => {
            CloudApi.run.withSuccessHandler(rows => { state.history = Array.isArray(rows) ? rows : []; state.historyLoaded = true; if (state.modalTab === "history") renderPersonnelModal(true); resolve(state.history); }).withFailureHandler(reject).getPersonnelHistory(token, String(agent.id));
        });
    }


    function openPersonnelFile(
        userId
    ) {

        if (!canViewOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Einsehen der Personalakten."
            );

            return;

        }

        const agent =
            state.agents.find(
                item =>
                    String(
                        getValue(
                            item,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    ) ===
                    String(
                        userId
                    )
            );


        if (!agent) {

            showAgentError(
                "Der ausgewählte Beamte konnte nicht gefunden werden."
            );

            return;

        }


        state.selectedAgent =
            {
                ...agent
            };


        state.modalTab =
            "personal";


        state.bundleLoaded =
            false;


        state.bundleLoading =
            true;


        state.trainings =
            [];


        state.notes =
            [];

        state.sanctions = [];
        state.history = [];
        state.historyLoaded = false;
        state.sanctionsVisible = false;
        state.sanctionsLoaded = false;


        state.trainingsLoaded =
            false;


        state.notesLoaded =
            false;


        renderPersonnelModal(
            false
        );


        openAgentsModal();


        const token =
            getAgentsSessionToken();


        if (!token) {

            state.bundleLoading =
                false;

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        /*
         * Genau EIN Request.
         */

        CloudApi.run

            .withSuccessHandler(
                bundle => {

                    if (
                        !state.selectedAgent ||
                        String(
                            state.selectedAgent.id
                        ) !==
                        String(
                            userId
                        )
                    ) {

                        return;

                    }


                    bundle =
                        bundle &&
                        typeof bundle ===
                            "object"
                            ? bundle
                            : {};


                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...(
                            bundle.agent &&
                            typeof bundle.agent ===
                                "object"
                                ? bundle.agent
                                : {}
                        )

                    };


                    /*
                     * Vorhandenes Profilbild aus
                     * der Beamtenliste behalten.
                     */

                    if (
                        !state.selectedAgent.profileImage &&
                        agent.profileImage
                    ) {

                        state.selectedAgent.profileImage =
                            agent.profileImage;

                    }


                    state.rankOptions =
                        Array.isArray(
                            bundle.rankOptions
                        )
                            ? bundle.rankOptions
                            : [];


                    state.trainings =
                        Array.isArray(
                            bundle.trainings
                        )
                            ? bundle.trainings
                            : [];


                    state.notes =
                        Array.isArray(
                            bundle.notes
                        )
                            ? bundle.notes
                            : [];

                    state.sanctions = Array.isArray(bundle.sanctions) ? bundle.sanctions : [];
                    state.history = Array.isArray(bundle.history) ? bundle.history : [];
                    state.historyLoaded = true;
                    state.sanctionsVisible = bundle.sanctionsVisible === true;
                    state.sanctionsLoaded = true;


                    state.trainingsLoaded =
                        true;


                    state.notesLoaded =
                        true;


                    state.bundleLoaded =
                        true;


                    state.bundleLoading =
                        false;


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .withFailureHandler(
                error => {

                    state.bundleLoading =
                        false;


                    console.error(
                        "LSPD MDT – Personalakten-Bundle:",
                        error
                    );


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht geladen werden."
                    );


                    renderPersonnelModal(
                        true
                    );

                }
            )

            .getPersonnelFileBundle(
                token,
                userId
            );

    }


    /* =====================================================
       MODAL
    ====================================================== */

    function openAgentsModal() {
        const overlay = $("agentsSystemModalOverlay");
        const modalElement = $("agentsSystemModal");
        if (!overlay || !modalElement) return;

        // The personnel file owns its complete modal shell. Do not pass this
        // node through the global modal manager: doing so nests one modal
        // inside another and breaks the tab buttons, scrolling and styling.
        if (modalElement.parentElement !== overlay) {
            overlay.appendChild(modalElement);
        }

        overlay.classList.add("active");
        overlay.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
    }

    function closePersonnelFile() {
        const overlay = $("agentsSystemModalOverlay");
        const modalElement = $("agentsSystemModal");
        if (overlay && modalElement && modalElement.parentElement !== overlay) {
            overlay.appendChild(modalElement);
        }
        if (overlay) {
            overlay.classList.remove("active");
            overlay.setAttribute("aria-hidden", "true");
        }
        document.body.style.overflow = "";
        closeRankDropdown();
        state.selectedAgent = null;
        state.bundleLoading = false;
    }

    function bindPersonnelTabEvents() {
        const body = $("agentsSystemModalBody");
        if (!body || body.dataset.personnelTabsBound === "true") return;

        // Delegate once from the stable modal body. The tab row itself is
        // re-rendered on every tab switch, so binding directly to the
        // individual buttons was unnecessarily fragile.
        body.dataset.personnelTabsBound = "true";
        body.addEventListener("click", function (event) {
            const button = event.target.closest("[data-personnel-tab]");
            if (!button || !body.contains(button)) return;

            event.preventDefault();
            state.modalTab = button.dataset.personnelTab || "personal";
            renderPersonnelModal(true);
        });
    }

    function getCurrentRankLabel(
        rankId,
        fallback
    ) {

        const found =
            state.rankOptions.find(
                rank =>
                    String(
                        getValue(
                            rank,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    ) ===
                    String(
                        rankId
                    )
            );


        return found
            ? String(
                getValue(
                    found,
                    [
                        "name",
                        "Name"
                    ],
                    fallback
                )
              )
            : (
                fallback ||
                "Kein Rang"
              );

    }


    function bindRankDropdown() {

        if (!canEditOfficers()) {
            return;
        }

        const wrapper =
            $("agentRankSelect");


        const button =
            $("agentRankSelectButton");


        if (!wrapper || !button) {
            return;
        }


        button.onclick =
            function(event) {

                event.stopPropagation();


                const isOpen =
                    wrapper.classList.contains(
                        "open"
                    );


                closeRankDropdown();


                if (!isOpen) {

                    wrapper.classList.add(
                        "open"
                    );


                    renderRankOptions();

                }

            };


        renderRankOptions();

    }


    function renderRankOptions() {

        const menu =
            $("agentRankSelectMenu");


        const native =
            $("agentRankNativeSelect");


        const label =
            $("agentRankSelectLabel");


        if (
            !menu ||
            !native ||
            !label
        ) {
            return;
        }


        menu.innerHTML =
            "";


        native.innerHTML =
            "";


        if (
            !state.rankOptions.length
        ) {

            menu.innerHTML = `

                <div class="agents-rank-empty">

                    Keine Ränge verfügbar

                </div>

            `;

            return;

        }


        const currentRankId =
            String(
                getValue(
                    state.selectedAgent,
                    [
                        "rankId",
                        "RankId"
                    ],
                    ""
                )
            );


        const sortedRankOptions =
            [
                ...state.rankOptions
            ].sort(
                (a, b) => {

                    const levelCompare =
                        getRankLevel(b) -
                        getRankLevel(a);

                    if (levelCompare !== 0) {
                        return levelCompare;
                    }

                    return String(
                        getValue(
                            a,
                            [
                                "name",
                                "Name"
                            ],
                            ""
                        )
                    ).localeCompare(
                        String(
                            getValue(
                                b,
                                [
                                    "name",
                                    "Name"
                                ],
                                ""
                            )
                        ),
                        "de-DE",
                        { sensitivity: "base" }
                    );

                }
            );


        sortedRankOptions.forEach(
            rank => {

                const id =
                    String(
                        getValue(
                            rank,
                            [
                                "id",
                                "ID"
                            ],
                            ""
                        )
                    );


                const name =
                    String(
                        getValue(
                            rank,
                            [
                                "name",
                                "Name"
                            ],
                            id
                        )
                    );


                const nativeOption =
                    document.createElement(
                        "option"
                    );


                nativeOption.value =
                    id;


                nativeOption.textContent =
                    name;


                if (
                    id ===
                    currentRankId
                ) {

                    nativeOption.selected =
                        true;


                    label.textContent =
                        name;

                }


                native.appendChild(
                    nativeOption
                );


                const item =
                    document.createElement(
                        "button"
                    );


                item.type =
                    "button";


                item.className =
                    "agents-rank-option";


                item.dataset.rankId =
                    id;


                item.textContent =
                    name;


                if (
                    id ===
                    currentRankId
                ) {

                    item.classList.add(
                        "selected"
                    );

                }


                item.onclick =
                    function(event) {

                        event.stopPropagation();


                        selectPersonnelRank(
                            id,
                            name
                        );

                    };


                menu.appendChild(
                    item
                );

            }
        );


        if (
            !currentRankId
        ) {

            label.textContent =
                "Rang auswählen...";

        }

    }


    function selectPersonnelRank(
        rankId,
        rankName
    ) {

        if (!canEditOfficers()) {
            return;
        }

        const native =
            $("agentRankNativeSelect");


        const label =
            $("agentRankSelectLabel");


        const wrapper =
            $("agentRankSelect");


        if (
            !native ||
            !label
        ) {
            return;
        }


        native.value =
            String(
                rankId
            );


        label.textContent =
            rankName;


        document
            .querySelectorAll(
                ".agents-rank-option"
            )
            .forEach(
                option => {

                    option.classList.toggle(
                        "selected",
                        String(
                            option.dataset.rankId
                        ) ===
                        String(
                            rankId
                        )
                    );

                }
            );


        state.selectedAgent.rankId =
            String(
                rankId
            );


        state.selectedAgent.rankName =
            rankName;


        state.selectedAgent.rank =
            rankName;


        if (wrapper) {

            wrapper.classList.remove(
                "open"
            );

        }

    }


    function closeRankDropdown() {

        const wrapper =
            $("agentRankSelect");


        if (wrapper) {

            wrapper.classList.remove(
                "open"
            );

        }

    }

    function savePersonnelProfile() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const userId =
            String(
                getValue(
                    agent,
                    [
                        "id",
                        "ID"
                    ],
                    ""
                )
            );


        if (!token) {

            showAgentError(
                "Keine aktive Sitzung."
            );

            return;

        }


        const data = {

            serviceNumber:
                $("agentServiceNumber")
                    ?.value
                    ?.trim() ||
                "",

            phone:
                $("agentPhone")
                    ?.value
                    ?.trim() ||
                "",

            callSign:
                $("agentCallSign")
                    ?.value
                    ?.trim() ||
                "",

            department:
                $("agentDepartment")
                    ?.value
                    ?.trim() ||
                "",

            unit:
                $("agentUnit")
                    ?.value
                    ?.trim() ||
                "",

            email:
                $("agentEmail")
                    ?.value
                    ?.trim() ||
                "",

            address:
                $("agentAddress")
                    ?.value
                    ?.trim() ||
                "",

            entryDate:
                $("agentEntryDate")
                    ?.value ||
                "",

            personnelStatus:
                $("agentPersonnelStatus")
                    ?.value
                    ?.trim() ||
                "",

            note:
                $("agentPersonnelNote")
                    ?.value
                    ?.trim() ||
                "",

            rankId:
                $("agentRankNativeSelect")
                    ?.value ||
                getValue(
                    agent,
                    [
                        "rankId",
                        "RankId"
                    ],
                    ""
                )

        };


        const button =
            $("agentSavePersonalButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird gespeichert...";

        }


        CloudApi.run

            .withSuccessHandler(
                () => {

                    state.selectedAgent = {

                        ...state.selectedAgent,

                        ...data

                    };


                    const selectedRank =
                        state.rankOptions.find(
                            rank =>
                                String(
                                    getValue(
                                        rank,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                String(
                                    data.rankId
                                )
                        );


                    if (
                        selectedRank
                    ) {

                        state.selectedAgent.rankId =
                            data.rankId;


                        state.selectedAgent.rankName =
                            getValue(
                                selectedRank,
                                [
                                    "name",
                                    "Name"
                                ],
                                "Kein Rang"
                            );


                        state.selectedAgent.rank =
                            state.selectedAgent.rankName;

                    }


                    const index =
                        state.agents.findIndex(
                            item =>
                                String(
                                    getValue(
                                        item,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) ===
                                userId
                        );


                    if (
                        index !==
                        -1
                    ) {

                        state.agents[index] = {

                            ...state.agents[index],

                            ...state.selectedAgent

                        };

                    }


                    filterAgents(
                        $("agentsSearchInput")
                            ?.value ||
                        ""
                    );


                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    loadPersonnelHistory().catch(function () {});
                    showAgentSuccess(
                        "Die Personalakte wurde erfolgreich gespeichert."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Personalakte speichern";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Personalakte konnte nicht gespeichert werden."
                    );

                }
            )

            .savePersonnelProfile(
                token,
                userId,
                data
            );

    }

    function saveDepartmentOnly(department) {
        if (!canEditOfficers() || !state.selectedAgent) return;
        const token = getAgentsSessionToken();
        const agent = state.selectedAgent;
        const userId = String(agent.id || "");
        if (!token || !userId) return showAgentError("Keine aktive Personalakte.");
        const data = {
            serviceNumber: String(getValue(agent,["serviceNumber"],"")||""),
            phone: String(getValue(agent,["phone"],"")||""),
            callSign: String(getValue(agent,["callSign"],"")||""),
            department: String(department||""),
            unit: String(getValue(agent,["unit"],"")||""),
            email: String(getValue(agent,["email"],"")||""),
            address: String(getValue(agent,["address"],"")||""),
            entryDate: getValue(agent,["entryDate"],"")||"",
            personnelStatus: String(getValue(agent,["personnelStatus"],"")||""),
            note: String(getValue(agent,["personnelNote","note"],"")||""),
            rankId: String(getValue(agent,["rankId"],"")||"")
        };
        const save = $("agentDepartmentWorkspaceSave");
        if (save) { save.disabled=true; save.textContent="Wird gespeichert..."; }
        CloudApi.run.withSuccessHandler(() => {
            state.selectedAgent = {...state.selectedAgent, department:data.department};
            state.agents = state.agents.map(item => String(item.id)===userId ? {...item,department:data.department} : item);
            filterAgents($("agentsSearchInput")?.value || "");
            if (save) { save.disabled=false; save.textContent="Abteilung gespeichert"; }
            renderPersonnelModal(true);
            showAgentSuccess("Abteilung wurde gespeichert.");
        }).withFailureHandler(error => {
            if (save) { save.disabled=false; save.textContent="Abteilung speichern"; }
            showAgentError(error?.message || "Die Abteilung konnte nicht gespeichert werden.");
        }).savePersonnelProfile(token,userId,data);
    }

        return state.trainings

                    const name =
                        getValue(

                    let statusClass =

    function createTraining() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const userId =
            String(
                agent.id
            );


        const name =
            $("trainingName")
                ?.value
                ?.trim() ||
            "";


        if (!name) {

            showAgentError(
                "Bitte einen Namen für die Schulung eingeben."
            );

            return;

        }


        const button =
            $("createTrainingButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird eingetragen...";

        }


        const data = {

            name:
                name,

            category:
                $("trainingCategory")
                    ?.value
                    ?.trim() ||
                "",

            date:
                $("trainingDate")
                    ?.value ||
                "",

            instructor:
                $("trainingInstructor")
                    ?.value
                    ?.trim() ||
                "",

            status:
                $("trainingStatus")
                    ?.value ||
                "Bestanden",

            expiryDate:
                $("trainingExpiryDate")
                    ?.value ||
                "",

            notes:
                $("trainingNotes")
                    ?.value
                    ?.trim() ||
                ""

        };


        CloudApi.run

            .withSuccessHandler(
                created => {

                    state.trainings =
                        [
                            created,
                            ...state.trainings
                        ];


                    state.trainingsLoaded =
                        true;


                    renderPersonnelModal(
                        true
                    );


                    showAgentSuccess(
                        "Die Schulung wurde eingetragen."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Schulung eintragen";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Schulung konnte nicht eingetragen werden."
                    );

                }
            )

            .createPersonnelTraining(
                token,
                userId,
                data
            );

    }


    function deleteTraining(
        trainingId
    ) {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        CloudApi.run

            .withSuccessHandler(
                () => {

                    state.trainings =
                        state.trainings.filter(
                            item =>
                                String(
                                    getValue(
                                        item,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) !==
                                String(
                                    trainingId
                                )
                        );


                    renderPersonnelModal(
                        true
                    );


                    loadPersonnelHistory().catch(function () {});
                    showAgentSuccess(
                        "Die Schulung wurde gelöscht."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Die Schulung konnte nicht gelöscht werden."
                    );

                }
            )

            .deletePersonnelTraining(
                token,
                String(agent.id),
                trainingId
            );

    }

    function setupSignatureCanvas(canvas) {
        if (!canvas) return {clear(){},data(){return "";}};
        const ctx = canvas.getContext("2d"); ctx.lineWidth=3; ctx.lineCap="round"; ctx.strokeStyle="#102a43"; ctx.fillStyle="#fff"; ctx.fillRect(0,0,canvas.width,canvas.height);
        let drawing=false,dirty=false;
        const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height};};
        const start=e=>{drawing=true;dirty=true;const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();};
        const move=e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();};
        const end=()=>{drawing=false;};
        canvas.addEventListener("pointerdown",start);canvas.addEventListener("pointermove",move);canvas.addEventListener("pointerup",end);canvas.addEventListener("pointerleave",end);
        return {clear(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);dirty=false;},data(){return dirty?canvas.toDataURL("image/png",0.8):"";}};
    }

                                            title="Vermerk löschen"
                                        >
                                            ×
                                        </button>
                                      `
                                    : ""
                            }

                        </div>

                    `;

                }
            )
            .join("");

    }


    function bindNoteForm() {

        if (!canEditOfficers()) {
            return;
        }

        const createButton =
            $("createNoteButton");


        if (
            createButton
        ) {

            createButton.onclick =
                function() {

                    createNote();

                };

        }


        document
            .querySelectorAll(
                "[data-note-id]"
            )
            .forEach(
                button => {

                    button.onclick =
                        function() {

                            deleteNote(
                                button.dataset.noteId
                            );

                        };

                }
            );

    }


    function createNote() {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        const title =
            $("noteTitle")
                ?.value
                ?.trim() ||
            "";


        const content =
            $("noteContent")
                ?.value
                ?.trim() ||
            "";


        if (!title) {

            showAgentError(
                "Bitte einen Titel für den Vermerk eingeben."
            );

            return;

        }


        if (!content) {

            showAgentError(
                "Bitte einen Inhalt für den Vermerk eingeben."
            );

            return;

        }


        const button =
            $("createNoteButton");


        if (button) {

            button.disabled =
                true;


            button.textContent =
                "Wird eingetragen...";

        }


        const data = {

            type:
                $("noteType")
                    ?.value ||
                "Vermerk",

            title:
                title,

            content:
                content

        };


        CloudApi.run

            .withSuccessHandler(
                created => {

                    state.notes =
                        [
                            created,
                            ...state.notes
                        ];


                    renderPersonnelModal(
                        true
                    );


                    loadPersonnelHistory().catch(function () {});
                    showAgentSuccess(
                        "Der Vermerk wurde hinzugefügt."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    if (button) {

                        button.disabled =
                            false;


                        button.textContent =
                            "Vermerk hinzufügen";

                    }


                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Der Vermerk konnte nicht hinzugefügt werden."
                    );

                }
            )

            .createPersonnelNote(
                token,
                String(agent.id),
                data
            );

    }


    function deleteNote(
        noteId
    ) {

        if (!canEditOfficers()) {

            showAgentError(
                "Du besitzt keine Berechtigung zum Bearbeiten von Beamten."
            );

            return;

        }

        const agent =
            state.selectedAgent;


        if (!agent) {
            return;
        }


        const token =
            getAgentsSessionToken();


        CloudApi.run

            .withSuccessHandler(
                () => {

                    state.notes =
                        state.notes.filter(
                            item =>
                                String(
                                    getValue(
                                        item,
                                        [
                                            "id",
                                            "ID"
                                        ],
                                        ""
                                    )
                                ) !==
                                String(
                                    noteId
                                )
                        );


                    renderPersonnelModal(
                        true
                    );


                    loadPersonnelHistory().catch(function () {});
                    showAgentSuccess(
                        "Der Vermerk wurde gelöscht."
                    );

                }
            )

            .withFailureHandler(
                error => {

                    showAgentError(
                        error?.message ||
                        String(
                            error ||
                            ""
                        ) ||
                        "Der Vermerk konnte nicht gelöscht werden."
                    );

                }
            )

            .deletePersonnelNote(
                token,
                String(agent.id),
                noteId
            );

    }


    /* =====================================================
       GLOBAL EVENTS
    ====================================================== */

    function bindGlobalEvents() {

        if (
            state.globalEventsBound
        ) {
            return;
        }


        state.globalEventsBound =
            true;


        window.__fibPageLifecycle.on(document, 
            "click",
            function(event) {

                const rankSelect =
                    $("agentRankSelect");


                if (
                    rankSelect &&
                    !rankSelect.contains(
                        event.target
                    )
                ) {

                    closeRankDropdown();

                }

            }
        );


        window.__fibPageLifecycle.on(document, 
            "keydown",
            function(event) {

                if (
                    event.key !==
                    "Escape"
                ) {

                    return;

                }


                const overlay =
                    $("agentsSystemModalOverlay");


                if (
                    overlay &&
                    overlay.classList.contains(
                        "active"
                    )
                ) {

                    closePersonnelFile();

                }

            }
        );


        window.__fibPageLifecycle.on(document, 
            "click",
            function(event) {

                const overlay =
                    $("agentsSystemModalOverlay");


                if (
                    overlay &&
                    event.target ===
                    overlay
                ) {

                    closePersonnelFile();

                }

            }
        );

    }


    /* =====================================================
       NOTIFICATIONS
    ====================================================== */

    function showAgentError(
        message
    ) {

        if (
            typeof window.showSystemError ===
            "function"
        ) {

            window.showSystemError(
                message
            );

            return;

        }


        console.error(
            "LSPD MDT – Fehler:",
            message
        );

    }


    function showAgentSuccess(
        message
    ) {

        if (
            typeof window.showSystemSuccess ===
            "function"
        ) {

            window.showSystemSuccess(
                message
            );

            return;

        }


        console.log(
            "LSPD MDT – Erfolg:",
            message
        );

    }


    /* =====================================================
       GLOBAL FUNCTIONS
    ====================================================== */

    window.__fibPageLifecycle.on(window, "fib-mdt:refresh-request", function (event) { if (document.getElementById("agentsPage") && !(event.detail && event.detail.source === "mutation")) loadAgents(); });

    window.__fibPageLifecycle.on(window, "fib-mdt:data-changed", function (event) { const modal=document.getElementById("fibGlobalModalOverlay"); if (document.getElementById("agentsPage") && !(modal && modal.classList.contains("open")) && /Personnel|Agent|Training|Note|Rank|User/i.test(String(event.detail && event.detail.method || ""))) loadAgents(); });

    window.openPersonnelFile =
        openPersonnelFile;


    window.closePersonnelFile =
        closePersonnelFile;


})();

</script>
