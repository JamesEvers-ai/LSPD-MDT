<main class="mdt-workspace mdt-workspace--logs" data-mdt-page="logs" data-lspd-module="logs">
<section class="mdt-module" id="mdt-module-logs">
 <h2>Systemprotokolle</h2><div class="sub">Protokoll der Änderungen innerhalb des migrierten MDT.</div>
 <div class="toolbar"><input id="logs-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="logs-reload">Aktualisieren</button></div>
 <div class="message" id="logs-message" role="status">Daten werden geladen …</div>
 <div class="form" id="logs-form" style="display:none">
  <input id="logs-title" placeholder="Titel / Protokolleintrag" maxlength="180">
  <select id="logs-status"><option value="logged">Logged</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="logs-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="logs-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="logs-save">Speichern</button><button class="secondary" id="logs-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="logs-items"></div>
</section>
<script src="/js/pages/logs.js?v=3.75" defer></script>
</main>
