<main class="mdt-workspace mdt-workspace--records" data-mdt-page="records" data-lspd-module="records">
<div class="records-page" id="fibRecordsPage">
  <div class="records-header">
    <div class="records-header-left">
      <div class="records-eyebrow">Los Santos Police Department</div>
      <h1 class="records-title">Akten &amp; Berichte</h1>
      <p class="records-description">
        Zentralisierte Verwaltung von Ermittlungsakten, Berichten und besonders geschützten LSPD-Unterlagen.
      </p>
    </div>

    <div class="records-header-actions">
      <button
        type="button"
        class="records-button primary"
        id="recordsCreateButton"
        style="display:none"
        onclick="recordsOpenCreateModal()"
      >
        <i class="fa-solid fa-plus"></i>
        <span id="recordsCreateButtonLabel">Neue Akte</span>
      </button>
    </div>
  </div>

  <div class="records-tabs" id="recordsTabs"></div>

  <div class="records-toolbar">
    <div class="records-toolbar-left">
      <div class="records-toolbar-title" id="recordsToolbarTitle">Ermittlungsakten</div>
      <div class="records-toolbar-description" id="recordsToolbarDescription">
        Ermittlungsakten mit entsprechender Berechtigung.
      </div>
    </div>

    <div class="records-toolbar-right">
      <input
        id="recordsSearch"
        class="records-search"
        type="search"
        maxlength="100"
        placeholder="Akte, Titel, Betreff suchen..."
        autocomplete="off"
        oninput="recordsSearchChanged(this.value)"
      >

      <select
        id="recordsStatus"
        class="records-select"
        onchange="recordsStatusChanged(this.value)"
      ></select>
    </div>
  </div>

  <div class="records-table-card">
    <div class="records-table-wrap">
      <table class="records-table">
        <thead>
          <tr>
            <th>Aktenzeichen</th>
            <th>Titel</th>
            <th>Betreff</th>
            <th>Art</th>
            <th>Status</th>
            <th>Klassifizierung</th>
            <th>Aktualisiert</th>
            <th style="text-align:right">Aktionen</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
      </table>
    </div>
  </div>
</div>


<script src="/js/pages/records.js?v=3.75" defer></script>
</main>
