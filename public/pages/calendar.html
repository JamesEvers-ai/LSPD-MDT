<main class="mdt-workspace mdt-workspace--calendar" data-mdt-page="calendar" data-lspd-module="calendar">
<section class="mdt-module" id="mdt-module-calendar">
 <h2>Kalender</h2><div class="sub">Termine und dienstliche Ereignisse verwalten.</div>
 <div class="toolbar"><input id="calendar-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="calendar-reload">Aktualisieren</button><button id="calendar-new">+ Neuer Eintrag</button></div>
 <div class="message" id="calendar-message" role="status">Daten werden geladen …</div>
 <div class="form" id="calendar-form" style="display:none">
  <input id="calendar-title" placeholder="Titel / Termin" maxlength="180">
  <select id="calendar-status"><option value="scheduled">Scheduled</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="calendar-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="calendar-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="calendar-save">Speichern</button><button class="secondary" id="calendar-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="calendar-items"></div>
</section>
<script src="/js/pages/calendar.js?v=3.76" defer></script>
</main>
