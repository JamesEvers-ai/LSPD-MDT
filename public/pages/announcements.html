<main class="mdt-workspace mdt-workspace--announcements" data-mdt-page="announcements" data-lspd-module="announcements">
<section class="mdt-module" id="mdt-module-announcements">
 <h2>Bekanntmachungen</h2><div class="sub">Bekanntmachungen veröffentlichen und verwalten.</div>
 <div class="toolbar"><input id="announcements-search" placeholder="Einträge durchsuchen…" aria-label="Einträge durchsuchen"><button class="secondary" id="announcements-reload">Aktualisieren</button><button id="announcements-new">+ Neuer Eintrag</button></div>
 <div class="message" id="announcements-message" role="status">Daten werden geladen …</div>
 <div class="form" id="announcements-form" style="display:none">
  <input id="announcements-title" placeholder="Titel / Ankündigung" maxlength="180">
  <select id="announcements-status"><option value="active">Active</option><option value="active">Aktiv</option><option value="pending">Ausstehend</option><option value="approved">Genehmigt</option><option value="rejected">Abgelehnt</option><option value="closed">Abgeschlossen</option><option value="scheduled">Geplant</option></select>
  <input id="announcements-date" type="datetime-local" aria-label="Datum und Uhrzeit">
  <textarea id="announcements-description" placeholder="Beschreibung / Details"></textarea>
  <div class="actions"><button id="announcements-save">Speichern</button><button class="secondary" id="announcements-cancel">Abbrechen</button></div>
 </div>
 <div class="items" id="announcements-items"></div>
</section>
<script src="/js/pages/announcements.js?v=3.76" defer></script>
</main>
